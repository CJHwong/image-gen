<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen-Image-2.1</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<style>
  /* The stage is a true neutral grey (R = G = B), the grey photographers view
     prints against, so the image is the only colour on it and nothing tints how
     it reads. The chrome around it is a faintly cool graphite, and the one
     accent marks only what acts: the run button, focus and the selection. */
  :root {
    color-scheme: dark;
    --chrome: #17181b; --chrome-2: #1e1f23; --chrome-3: #26272c;
    --line: #2d2f35; --line-strong: #3d3f47;
    --stage: #212121; --plate: #2b2b2b;
    --text: #ebecef; --text-2: #a4a7b1; --text-3: #858893;
    --accent: #8c95ff; --accent-fill: #5561e8; --accent-soft: rgba(124, 134, 255, .16);
    --danger: #ff8589; --danger-fill: #cf3a3f;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --chrome: #ffffff; --chrome-2: #f5f5f7; --chrome-3: #ebebef;
      --line: #e2e2e7; --line-strong: #cbccd3;
      --stage: #e4e4e4; --plate: #d6d6d6;
      --text: #17181b; --text-2: #5d606b; --text-3: #6a6d78;
      --accent: #4a54d6; --accent-fill: #4a54d6; --accent-soft: rgba(74, 84, 214, .1);
      --danger: #c0353a; --danger-fill: #cf3a3f;
      --shadow: 0 10px 30px rgba(20, 20, 30, .14);
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--chrome); color: var(--text);
    font: 13px/1.45 ui-sans-serif, -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Controls are clicked, often twice in a row; a double click must not paint
     a text selection over them. */
  .refs, .chip, .seg, .stepper, .modes, .frame, .icon-btn, .btn, #go { user-select: none; -webkit-user-select: none; }
  .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
    stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* The row is capped at the window, so no content can make the page taller
     and push the pinned run button out of view. */
  .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr);
    height: 100vh; }

  /* Left: top bar, stage, filmstrip. Nothing here scrolls but the strip. */
  .work { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0;
    background: var(--stage); }
  .topbar { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 20px;
    background: var(--chrome); border-bottom: 1px solid var(--line); }
  .topbar h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.005em; }
  .badge { padding: 1px 7px; border: 1px solid var(--line-strong); border-radius: 999px;
    color: var(--text-2); font-size: 11px; }
  .privacy { margin-left: auto; display: flex; align-items: center; gap: 6px;
    color: var(--text-3); font-size: 12px; }

  .stage { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  .canvas { position: relative; min-height: 0; display: flex; align-items: center;
    justify-content: center; padding: 24px; }
  /* A percentage max-height does not bound an image inside a grid-sized flex
     box, and a tall image pushed the filmstrip off the screen. The shot is
     sized in pixels to the image's own shape instead (fitShot), so it cannot
     overflow, and anything laid over the image lines up with its edges. */
  .shot { position: relative; flex: none; box-shadow: 0 2px 12px rgba(0, 0, 0, .28); }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  /* Before and after: the source image lies over the edit, clipped at the
     slider. The range input covers the image, so a drag anywhere moves it.
     The source is stretched to the shot, because the edit resized the whole
     source; cropping it would shift every point it is compared against. */
  .shot img.before { object-fit: fill; clip-path: inset(0 calc(100% - var(--split)) 0 0); }
  .compare-range { position: absolute; inset: 0; width: 100%; height: 100%;
    margin: 0; opacity: 0; cursor: ew-resize; z-index: 2; }
  .divider { position: absolute; top: 0; bottom: 0; left: var(--split); width: 2px; margin-left: -1px;
    background: #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .2); pointer-events: none; z-index: 1; }
  .divider::after { content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
    margin: -15px 0 0 -15px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 6px rgba(0, 0, 0, .35); }
  .divider .icon { position: absolute; top: 50%; left: 50%; z-index: 1; margin: -8px 0 0 -8px;
    color: #3a3b40; }
  .compare-range:focus-visible ~ .divider,
  .compare-range:focus-visible ~ .divider::after { background: var(--accent-fill); }
  .compare-range:focus-visible ~ .divider .icon { color: #fff; }
  .compare-tag { position: absolute; top: 10px; z-index: 1; padding: 2px 8px; border-radius: 5px;
    background: rgba(0, 0, 0, .55); color: #fff; font-size: 12px; pointer-events: none; }
  .compare-tag.left { left: 10px; }
  .compare-tag.right { right: 10px; }
  .arrive { animation: arrive .22s ease-out; }
  @keyframes arrive { from { opacity: 0; transform: scale(.985); } }

  .empty { max-width: 320px; text-align: center; color: var(--text-2); }
  .empty strong { display: block; color: var(--text); font-size: 15px; font-weight: 600; }
  .empty p { margin: 4px 0 16px; }

  /* The one bold element: a plate at the shape the image will have, holding
     the progress ring. The finished image takes its place. */
  .card { display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; min-width: 240px; min-height: 220px; border-radius: 3px;
    background: var(--plate); color: var(--text-2); text-align: center; }
  .ring { width: 72px; height: 72px; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 4; }
  .ring .track { stroke: var(--line-strong); }
  .ring .value { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s linear; }
  .ring.waiting svg { animation: turn 1.1s linear infinite; }
  .ring .percent { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; color: var(--text); font-size: 15px; font-weight: 600; }
  @keyframes turn { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
  .card .lines { display: flex; flex-direction: column; gap: 2px; }
  .card .lines strong { color: var(--text); font-weight: 600; font-size: 14px; }

  .canvas { overflow: hidden; }
  .stage-bar { display: flex; align-items: center; gap: 20px; padding: 0 24px 16px; min-width: 0; }
  .stage-bar[hidden] { display: none; }
  .about { flex: 1; min-width: 0; }
  .facts { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; color: var(--text-2);
    font-size: 12px; }
  .facts .mode { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px 0 5px;
    border: 1px solid var(--line-strong); border-radius: 999px; color: var(--text); font-weight: 500; }
  .facts .mode .icon { width: 12px; height: 12px; }
  .prompt-line { margin: 3px 0 0; color: var(--text-3); font-size: 12px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .actions { display: flex; align-items: center; gap: 4px; flex: none; }
  .actions .rule { width: 1px; height: 20px; background: var(--line-strong); margin: 0 6px; }

  .icon-btn { width: 32px; height: 32px; display: inline-flex; align-items: center;
    justify-content: center; border: 1px solid transparent; border-radius: 7px;
    background: none; color: var(--text-2); cursor: pointer; padding: 0; }
  .icon-btn:hover { background: var(--chrome-3); color: var(--text); border-color: var(--line); }
  .icon-btn.danger:hover { background: var(--danger-fill); border-color: var(--danger-fill); color: #fff; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 7px; background: var(--chrome);
    color: var(--text); cursor: pointer; text-decoration: none; font-size: 12px; font-weight: 500; }
  .btn:hover { background: var(--chrome-3); }
  .btn.quiet { border-color: transparent; background: none; color: var(--text-2); }
  .btn.quiet:hover { background: var(--chrome-3); border-color: var(--line); color: var(--text); }
  /* Menus open from a button and float over the page. */
  .menu-anchor { position: relative; }
  .menu { position: absolute; top: calc(100% + 6px); right: 0; z-index: 6; min-width: 220px;
    padding: 4px; background: var(--chrome); border: 1px solid var(--line-strong);
    border-radius: 10px; box-shadow: var(--shadow); animation: arrive .12s ease-out; }
  .menu.up { top: auto; bottom: calc(100% + 6px); }
  #templates { top: 30px; width: min(310px, 100%); }
  .menu button { display: flex; align-items: flex-start; gap: 9px; width: 100%; padding: 7px 10px;
    border: 0; border-radius: 6px; background: none; color: var(--text); text-align: left;
    cursor: pointer; font-size: 13px; }
  .menu button .icon { margin-top: 1px; color: var(--text-2); }
  .menu button:hover, .menu button:focus-visible { background: var(--chrome-3); outline: none; }
  .item-note { display: block; color: var(--text-3); font-size: 12px; }
  .menu-head, .menu-foot { padding: 6px 10px; color: var(--text-3); font-size: 12px; }
  .menu-head { font-weight: 500; color: var(--text-2); }
  .menu-foot { border-top: 1px solid var(--line); margin-top: 4px; }
  .text-btn { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; white-space: nowrap;
    font-size: 12px; }
  .text-btn:hover { text-decoration: underline; }

  .toasts { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); z-index: 4;
    width: min(520px, calc(100% - 32px)); display: flex; flex-direction: column; gap: 8px; }
  .toast { display: flex; gap: 10px; align-items: flex-start; padding: 10px 10px 10px 12px;
    background: var(--chrome); border: 1px solid var(--line-strong); border-radius: 10px;
    box-shadow: var(--shadow); animation: arrive .18s ease-out; }
  .toast .icon { margin-top: 1px; color: var(--text-2); }
  .toast.error .icon:first-child { color: var(--danger); }
  .toast p { margin: 0; flex: 1; white-space: pre-wrap; overflow-wrap: anywhere; }
  .toast .icon-btn { width: 22px; height: 22px; }

  .strip-wrap { background: var(--chrome); border-top: 1px solid var(--line); padding: 8px 16px 12px; }
  .strip-wrap[hidden] { display: none; }
  .strip-head { display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 6px; color: var(--text-3); font-size: 12px; }
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px; scrollbar-width: thin; }
  .frame { position: relative; flex: none; height: 72px; padding: 0; border: 1px solid var(--line);
    border-radius: 5px; overflow: hidden; background: var(--plate); cursor: pointer; }
  .frame img { height: 100%; width: auto; display: block; }
  .frame:hover { border-color: var(--line-strong); }
  .frame.selected { outline: 2px solid var(--accent); outline-offset: 2px; }
  .frame .corner { position: absolute; right: 4px; bottom: 4px; width: 18px; height: 18px;
    display: flex; align-items: center; justify-content: center; border-radius: 5px;
    background: rgba(0, 0, 0, .55); color: #fff; }
  .frame .corner .icon { width: 12px; height: 12px; }
  .frame.pending { display: flex; align-items: center; justify-content: center; }
  .frame.pending .ring { width: 30px; height: 30px; }
  .frame.pending .ring circle { stroke-width: 5; }

  /* Right: the controls. Only this column's middle scrolls; the run button stays put. */
  aside { background: var(--chrome); border-left: 1px solid var(--line); min-height: 0; }
  form { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .controls { flex: 1; overflow-y: auto; padding: 16px 20px 24px; display: flex;
    flex-direction: column; gap: 20px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  label, .label { color: var(--text-2); font-size: 12px; font-weight: 500; }
  .prompt-field { position: relative; }
  .pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px;
    border: 1px solid var(--line-strong); border-radius: 999px; background: var(--chrome-2);
    color: var(--text-2); cursor: pointer; font-size: 12px; }
  .pill .icon { width: 14px; height: 14px; }
  .pill:hover, .pill[aria-expanded=true] { border-color: var(--accent); color: var(--text); }
  .field-head:has(.pill) { align-items: center; }
  .caption { color: var(--text-3); font-size: 12px; }
  textarea, input[type=text], input[type=number], select { width: 100%; background: var(--chrome-2);
    border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea { min-height: 96px; max-height: 320px; resize: none; font-size: 14px; line-height: 1.5; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent-fill); }
  ::placeholder { color: var(--text-3); }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; position: relative;
    background: var(--chrome-2); border: 1px solid var(--line); border-radius: 9px; }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes label { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 7px 0;
    border-radius: 6px; cursor: pointer; color: var(--text-2); font-size: 13px; }
  .modes input:checked + label { background: var(--chrome); color: var(--text);
    box-shadow: 0 0 0 1px var(--line-strong); }
  .modes input:focus-visible + label { outline: 2px solid var(--accent); }

  .refs { border: 1px dashed var(--line-strong); border-radius: 9px; background: var(--chrome-2);
    cursor: pointer; padding: 10px; transition: border-color .15s; }
  .refs:hover, .refs.over { border-color: var(--accent); }
  .refs.over { background: var(--accent-soft); }
  .refs-empty { display: flex; align-items: center; gap: 10px; color: var(--text-2); }
  .refs-empty .icon { width: 20px; height: 20px; color: var(--text-3); }
  .refs-empty strong { display: block; color: var(--text); font-weight: 500; }
  form.mode-edit .refs-empty { flex-direction: column; text-align: center; padding: 18px 8px; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
  .thumb { position: relative; width: 60px; height: 60px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; display: block; }
  .thumb .remove { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; padding: 0;
    display: flex; align-items: center; justify-content: center; border-radius: 50%;
    border: 1px solid var(--line-strong); background: var(--chrome); color: var(--text-2); cursor: pointer; }
  .thumb .remove .icon { width: 11px; height: 11px; }
  .thumb .remove:hover { background: var(--danger-fill); border-color: var(--danger-fill); color: #fff; }
  .add-tile { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
    border: 1px dashed var(--line-strong); border-radius: 5px; color: var(--text-3); }
  .refs-note { margin-top: 8px; color: var(--text-3); font-size: 12px; }

  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .chip { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--chrome-2);
    color: var(--text-2); cursor: pointer; font-size: 12px; }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
  .glyph { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; flex: none; }
  .glyph i { display: block; border: 1.5px solid currentColor; border-radius: 2px; }
  .glyph i.dashed { border-style: dashed; }
  .seg { display: flex; padding: 2px; gap: 2px; background: var(--chrome-2);
    border: 1px solid var(--line); border-radius: 7px; }
  .seg button { flex: 1; height: 28px; border: 0; border-radius: 5px; background: none;
    color: var(--text-2); cursor: pointer; font-size: 12px; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed=true] { background: var(--chrome); color: var(--text);
    box-shadow: 0 0 0 1px var(--line-strong); }

  .stepper { display: inline-grid; grid-template-columns: 34px 48px 34px; height: 34px; width: max-content;
    border: 1px solid var(--line); border-radius: 7px; background: var(--chrome-2); overflow: hidden; }
  .stepper button { border: 0; background: none; color: var(--text-2); cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .stepper button:hover:not(:disabled) { background: var(--chrome-3); color: var(--text); }
  .stepper button:disabled { color: var(--line-strong); cursor: default; }
  .stepper input { border: 0; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
    border-radius: 0; background: none; text-align: center; padding: 0; }
  .stepper input:focus { box-shadow: none; }

  form.mode-generate .edit-only, form.mode-edit .generate-only { display: none; }
  /* Strength means something only when there is a reference to be strong about. */
  .strength-field { display: none; }
  form.mode-generate.has-ref .strength-field { display: flex; }

  details { border-top: 1px solid var(--line); padding-top: 14px; }
  summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none;
    color: var(--text-2); font-size: 12px; font-weight: 500; }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: ""; width: 6px; height: 6px; margin: 0 2px;
    border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
    transform: rotate(-45deg); transition: transform .15s; }
  details[open] summary::before { transform: rotate(45deg); }
  summary .values { margin-left: auto; color: var(--text-3); font-weight: 400; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  details[open] summary .values { visibility: hidden; }
  .advanced { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .footer { padding: 14px 20px 18px; border-top: 1px solid var(--line); background: var(--chrome); }
  /* The run button only starts a run. While one is in flight it is disabled
     and reads Generating or Editing, with the step count below; Cancel sits on
     the progress card. The second line carries the estimate when idle. */
  #go { position: relative; overflow: hidden; width: 100%; min-height: 52px; border: 1px solid transparent;
    border-radius: 10px; background: var(--accent-fill); color: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
  #go:hover:not(:disabled) { filter: brightness(1.08); }
  #go:disabled { background: var(--chrome-3); color: var(--text-3); cursor: not-allowed; }
  #go .main { font-size: 14px; font-weight: 600; }
  #go .sub { font-size: 12px; }
  #go .busy-label, #go .stopping-label { display: none; }
  body.busy #go { background: var(--chrome-2); border-color: var(--line-strong); color: var(--text);
    filter: none; cursor: progress; }
  body.busy #go .idle-label { display: none; }
  body.busy #go .busy-label { display: inline; }
  body.stopping #go .busy-label { display: none; }
  body.stopping #go .stopping-label { display: inline; }
  body.stopping #go { color: var(--text-3); cursor: progress; }
  #go .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent);
    transition: width .5s linear; display: none; }
  body.busy #go .fill { display: block; }
  #go .sub { color: inherit; }
  body.busy #go .sub { color: var(--text-2); }

  #progress, #incoming { display: none; }

  /* On a phone the image leads, and the run button sits at the bottom of the
     screen so it is reachable from anywhere in the form. */
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; grid-template-rows: none; height: auto; }
    .work { grid-template-rows: auto 62vh auto; }
    .privacy span { display: none; }
    .stage-bar { flex-wrap: wrap; gap: 10px; padding: 0 16px 12px; }
    .about { flex-basis: 100%; }
    .actions { flex: 1 1 100%; flex-wrap: wrap; min-width: 0; }
    .actions .rule { display: none; }
    aside { border-left: 0; border-top: 1px solid var(--line); }
    form { height: auto; }
    .controls { overflow: visible; padding-bottom: 104px; }
    .footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>

  <symbol id="i-brush" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-9 9"/></symbol>
  <symbol id="i-image-in" viewBox="0 0 24 24"><path d="M20 11v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h7"/><path d="M4 16l4-4 4 4 3-3 5 5"/><path d="M18 3v6M15 6h6"/></symbol>
  <symbol id="i-hash" viewBox="0 0 24 24"><path d="M5 9h14M5 15h14M10 4L8 20M16 4l-2 16"/></symbol>

<div class="app">
  <div class="work">
    <header class="topbar">
      <h1>Qwen-Image-2.1</h1>
      <span class="badge">__PRECISION__</span>
      <span class="privacy"><svg class="icon"><use href="#i-lock"/></svg><span>Nothing is saved to disk</span></span>
    </header>

    <section class="stage">
      <div class="canvas" id="canvas"></div>
      <div class="stage-bar" id="stage-bar" hidden></div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
    </section>

    <section class="strip-wrap" id="strip-wrap" hidden>
      <div class="strip-head">
        <span id="strip-note"></span>
        <button type="button" class="text-btn" id="clear-gallery">Clear all</button>
      </div>
      <div class="strip" id="strip"></div>
    </section>

    <!-- Server answers land here and move into the gallery. The batch chain
         placeholders wait here too, so the next request stays in the DOM. -->
    <div id="incoming"></div>
    <div id="progress"></div>
  </div>

  <aside>
    <form id="form" class="mode-generate" hx-post="/generate" hx-target="#incoming" hx-swap="beforeend">
      <div class="controls">
        <div class="modes" role="radiogroup" aria-label="Mode">
          <input type="radio" name="mode" id="mode-generate" value="generate" checked>
          <label for="mode-generate"><svg class="icon"><use href="#i-sparkle"/></svg>Generate</label>
          <input type="radio" name="mode" id="mode-edit" value="edit">
          <label for="mode-edit"><svg class="icon"><use href="#i-brush"/></svg>Edit</label>
        </div>

        <div class="field prompt-field">
          <div class="field-head">
            <label for="prompt"><span class="generate-only">Prompt</span><span class="edit-only">What to change</span></label>
            <button type="button" class="pill" id="templates-toggle" aria-expanded="false"
              aria-controls="templates"><svg class="icon"><use href="#i-layout"/></svg>Templates</button>
          </div>
          <div class="menu" id="templates" role="menu" hidden></div>
          <textarea id="prompt" name="prompt" autofocus rows="4"></textarea>
        </div>

        <div class="field">
          <div class="field-head">
            <span class="label"><span class="generate-only">Starting image</span><span class="edit-only">Images to edit</span></span>
            <button type="button" class="text-btn" id="clear-reference" hidden>Remove all</button>
          </div>
          <div class="refs" id="refs" tabindex="0" role="button" aria-label="Add reference images">
            <div class="refs-empty" id="refs-empty">
              <svg class="icon"><use href="#i-image"/></svg>
              <div>
                <strong id="refs-title"></strong>
                <span id="refs-sub"></span>
              </div>
            </div>
            <div class="thumbs" id="thumbs"></div>
            <div class="refs-note" id="refs-note"></div>
          </div>
          <input id="reference" type="file" accept="image/*" hidden>
        </div>

        <div class="field strength-field">
          <div class="field-head">
            <label for="strength">Reference strength</label>
            <span class="caption num" id="strength-value">0.40</span>
          </div>
          <input id="strength" name="strength" type="range" value="0.4" step="0.05" min="0.05" max="1">
          <span class="caption">Higher stays closer to the starting image.</span>
        </div>

        <div class="field">
          <div class="field-head">
            <span class="label">Size</span>
            <span class="caption num" id="size-caption"></span>
          </div>
          <div class="generate-only">
            <div class="chips" id="size-chips"></div>
            <div class="seg" id="tier-sizes" style="margin-top: 6px"></div>
          </div>
          <div class="seg edit-only" id="edit-sizes"></div>
          <select id="size" name="size" hidden>__SIZE_OPTIONS__</select>
          <select id="resolution" name="resolution" hidden>__EDIT_RESOLUTIONS__</select>
        </div>

        <div class="field">
          <div class="field-head">
            <span class="label">Images</span>
            <span class="caption">Each one uses the next seed</span>
          </div>
          <div class="stepper">
            <button type="button" id="count-down" aria-label="Fewer images"><svg class="icon"><use href="#i-minus"/></svg></button>
            <input id="count" name="count" type="text" inputmode="numeric" value="1" aria-label="Number of images" class="num">
            <button type="button" id="count-up" aria-label="More images"><svg class="icon"><use href="#i-plus"/></svg></button>
          </div>

        <details id="advanced">
          <summary>Advanced <span class="values num" id="advanced-values"></span></summary>
          <div class="advanced">
            <div class="field">
              <div class="field-head">
                <label for="steps">Steps</label>
                <span class="caption num" id="steps-value">40</span>
              </div>
              <input id="steps" name="steps" type="range" value="40" min="1" max="100">
            </div>
            <div class="pair">
              <div class="field generate-only">
                <label for="guidance">Guidance</label>
                <input id="guidance" name="guidance" type="number" value="1.0" step="0.5" min="0" class="num">
              </div>
              <div class="field edit-only">
                <label for="cfg">True CFG</label>
                <input id="cfg" name="cfg" type="number" value="1.0" step="0.5" min="1" max="10" class="num">
              </div>
              <div class="field">
                <div class="field-head">
                  <label for="seed">Seed</label>
                  <button type="button" class="text-btn" id="random-seed">Random</button>
                </div>
                <input id="seed" name="seed" type="text" inputmode="numeric" placeholder="Random" class="num">
              </div>
            </div>

            <div class="field">
              <label for="negative">Negative prompt</label>

            </div>

      <div class="footer">
        <button id="go" type="submit">
          <span class="main">
            <span class="idle-label"><span class="generate-only">Generate</span><span class="edit-only">Edit</span></span>
            <span class="busy-label" id="go-busy">Generating</span>
            <span class="stopping-label">Stopping&hellip;</span>
          </span>
          <span class="sub num" id="go-sub" aria-live="polite"></span>
          <span class="fill" id="go-fill"></span>
        </button>
      </div>

</div>

<script>
  const MAX_REFERENCES = __MAX_REFERENCES__;
  const MAX_BATCH = __MAX_BATCH__;
  const EDIT_MATCH_CAP = __EDIT_MATCH_CAP__;

  const form = document.getElementById('form');
  const go = document.getElementById('go');
  const goSub = document.getElementById('go-sub');
  const goFill = document.getElementById('go-fill');
  const promptInput = document.getElementById('prompt');
  const countInput = document.getElementById('count');
  const sizeSelect = document.getElementById('size');
  const resolutionSelect = document.getElementById('resolution');
  const progressSlot = document.getElementById('progress');
  const incoming = document.getElementById('incoming');

  function icon(name) {
    return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  }

  function editing() {
    return document.getElementById('mode-edit').checked;
  }

  function busy() {
    return document.body.classList.contains('busy');
  }

  function spell(seconds) {
    if (seconds < 90) return Math.max(5, Math.round(seconds / 5) * 5) + 's';
    const minutes = Math.floor(seconds / 60);
    const rest = Math.round((seconds % 60) / 15) * 15;
    if (rest && rest < 60) return minutes + ' min ' + rest + 's';
    return (minutes + (rest ? 1 : 0)) + ' min';
  }

  // ---- References ---------------------------------------------------------
  // References live in one array, whatever put them there: the picker, a drop,
  // a paste, or "Use as reference" on a result. Generate takes one image, since
  // mflux exposes a single image_path, so a new one replaces the old. Edit takes
  // up to MAX_REFERENCES. Files are read here and posted as base64 in a normal
  // form field, which keeps the server off multipart parsing that the standard
  // library no longer ships.
  const referenceInput = document.getElementById('reference');
  const refsZone = document.getElementById('refs');
  const thumbs = document.getElementById('thumbs');
  let references = [];

  function referenceLimit() {
    return editing() ? MAX_REFERENCES : 1;
  }

  function lastReference() {
    return references[references.length - 1];
  }

  function renderReferences() {
    const count = references.length;
    form.classList.toggle('has-ref', count > 0);
    referenceInput.multiple = editing();
    document.getElementById('refs-empty').hidden = count > 0;
    document.getElementById('clear-reference').hidden = count < 2;
    document.getElementById('refs-title').textContent = editing()
      ? 'Add the image to edit' : 'Start from an image';
    document.getElementById('refs-sub').textContent = editing()
      ? 'Drop, paste or choose up to ' + MAX_REFERENCES + '.'
      : 'Optional. Drop, paste or choose one.';

    thumbs.innerHTML = '';
    references.forEach(function (reference, index) {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.title = reference.name;
      const image = document.createElement('img');
      image.src = 'data:image/png;base64,' + reference.b64;
      image.alt = reference.name;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.innerHTML = icon('x');
      remove.setAttribute('aria-label', 'Remove ' + reference.name);
      remove.addEventListener('click', function (event) {
        event.stopPropagation();  // the zone opens the picker on click
        references.splice(index, 1);
        renderReferences();
      });
      thumb.append(image, remove);
      thumbs.append(thumb);
    });
    if (editing() && count && count < MAX_REFERENCES) {
      const add = document.createElement('div');
      add.className = 'add-tile';
      add.innerHTML = icon('plus');
      thumbs.append(add);
    }

    const note = document.getElementById('refs-note');
    note.hidden = count === 0;
    if (editing() && count) {
      const last = lastReference();
      note.textContent = count + ' of ' + MAX_REFERENCES + ' images. The result takes the shape of the last one'
        + (last.width ? ', ' + last.width + ' × ' + last.height + '.' : '.');
    } else if (count) {
      note.textContent = 'Drop or paste another image to replace it.';
    }
    refreshForm();
    // An empty stage says what to do next, and that depends on the references.
    if (view === null) renderStage();
  }

  function addReference(b64, name) {
    if (referenceLimit() === 1) references = [];
    if (references.length >= referenceLimit()) {
      showToast('info', 'Edit takes at most ' + MAX_REFERENCES + ' images.');
      return;
    }
    const entry = { b64: b64, name: name, width: 0, height: 0 };
    references.push(entry);
    // The estimate, the "Match" size and the progress card's shape all need the
    // pixel size, so it is read once here.
    const probe = new Image();
    probe.onload = function () {
      entry.width = probe.naturalWidth;
      entry.height = probe.naturalHeight;
      renderReferences();
    };
    probe.src = 'data:image/png;base64,' + b64;
    renderReferences();
  }

  function addFiles(files) {
    Array.from(files).filter(function (file) {
      return file.type.startsWith('image/');
    }).forEach(function (file) {
      const reader = new FileReader();
      reader.onload = function () {
        addReference(reader.result.split(',')[1], file.name);
      };
      reader.readAsDataURL(file);
    });
  }

  referenceInput.addEventListener('change', function () {
    addFiles(referenceInput.files);
    referenceInput.value = '';
  });
  refsZone.addEventListener('click', function () { referenceInput.click(); });
  refsZone.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    referenceInput.click();
  });
  refsZone.addEventListener('dragover', function (event) {
    event.preventDefault();
    refsZone.classList.add('over');
  });
  refsZone.addEventListener('dragleave', function () { refsZone.classList.remove('over'); });
  refsZone.addEventListener('drop', function (event) {
    event.preventDefault();
    refsZone.classList.remove('over');
    addFiles(event.dataTransfer.files);
  });
  document.addEventListener('paste', function (event) {
    const files = event.clipboardData ? event.clipboardData.files : [];
    if (!files.length) return;  // a text paste goes to the field as usual
    event.preventDefault();
    addFiles(files);
  });
  document.getElementById('clear-reference').addEventListener('click', function () {
    references = [];
    renderReferences();
  });

  // ---- Size -----------------------------------------------------------------
  // The hidden selects stay the form fields, filled by the server as before.
  // The chips only drive them, so the request is exactly what it was.
  const sizeOptions = Array.from(sizeSelect.options).filter(function (option) {
    return option.value !== 'match';
  }).map(function (option) {
    const parts = option.value.split('x').map(Number);
    const named = option.textContent.match(/\((\d+:\d+)\)/);
    return { value: option.value, width: parts[0], height: parts[1],
             ratio: parts[0] === parts[1] ? '1:1' : (named ? named[1] : parts[0] + ':' + parts[1]) };
  });
  const ratios = [];
  sizeOptions.forEach(function (option) {
    if (ratios.indexOf(option.ratio) < 0) ratios.push(option.ratio);
  });

  function glyph(ratio) {
    if (ratio === 'match') return '<span class="glyph"><i class="dashed" style="width:13px;height:13px"></i></span>';
    const parts = ratio.split(':').map(Number);
    const wide = parts[0] >= parts[1];
    const width = wide ? 16 : Math.round(16 * parts[0] / parts[1]);
    const height = wide ? Math.round(16 * parts[1] / parts[0]) : 16;
    return '<span class="glyph"><i style="width:' + width + 'px;height:' + height + 'px"></i></span>';
  }

  function currentOption() {
    return sizeOptions.find(function (option) { return option.value === sizeSelect.value; });
  }

  function setSelect(select, value) {
    select.value = value;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function pickRatio(ratio) {
    if (ratio === 'match') return setSelect(sizeSelect, 'match');
    const current = currentOption();
    if (current && current.ratio === ratio) return;
    // A new shape starts at the tier nearest 1 MP, where the model was trained.
    const group = sizeOptions.filter(function (option) { return option.ratio === ratio; });
    const preferred = group.slice().sort(function (a, b) {
      return Math.abs(a.width * a.height - 1048576) - Math.abs(b.width * b.height - 1048576);
    })[0];
    setSelect(sizeSelect, preferred.value);
  }

  function buildSizeControls() {
    const chips = document.getElementById('size-chips');
    ratios.concat(['match']).forEach(function (ratio) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.ratio = ratio;
      chip.innerHTML = glyph(ratio) + '<span>' + (ratio === 'match' ? 'Match' : ratio) + '</span>';
      chip.addEventListener('click', function () { pickRatio(ratio); });
      chips.append(chip);
    });
    const edits = document.getElementById('edit-sizes');
    Array.from(resolutionSelect.options).sort(function (a, b) {
      return (a.value === 'match' ? 0 : Number(a.value)) - (b.value === 'match' ? 0 : Number(b.value));
    }).forEach(function (option) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'num';
      button.dataset.value = option.value;
      button.textContent = option.value === 'match' ? 'Match' : option.value;
      button.addEventListener('click', function () { setSelect(resolutionSelect, option.value); });
      edits.append(button);
    });
  }

  // The sizes of the chosen shape, smallest first, labelled by their pixels.
  function renderTiers(ratio) {
    const tiers = document.getElementById('tier-sizes');
    tiers.hidden = ratio === 'match';
    tiers.innerHTML = '';
    sizeOptions.filter(function (option) { return option.ratio === ratio; })
      .sort(function (a, b) { return a.width * a.height - b.width * b.height; })
      .forEach(function (option) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'num';
        button.textContent = option.width + '\u00d7' + option.height;
        button.setAttribute('aria-pressed', String(option.value === sizeSelect.value));
        button.addEventListener('click', function () { setSelect(sizeSelect, option.value); });
        tiers.append(button);
      });
  }

  function editResolution() {
    const chosen = resolutionSelect.value;
    if (chosen !== 'match') return Number(chosen);
    const reference = lastReference();
    if (!reference || !reference.width) return 1024;
    return Math.min(Math.round(Math.sqrt(reference.width * reference.height)), EDIT_MATCH_CAP);
  }

  function renderSize() {
    const current = currentOption();
    const ratio = current ? current.ratio : 'match';
    document.querySelectorAll('#size-chips .chip').forEach(function (chip) {
      chip.setAttribute('aria-pressed', String(chip.dataset.ratio === ratio));
    });
    renderTiers(ratio);
    document.querySelectorAll('#edit-sizes button').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.value === resolutionSelect.value));
    });
    const caption = document.getElementById('size-caption');
    const reference = lastReference();
    if (editing()) {
      caption.textContent = reference && reference.width
        ? 'about ' + editResolution() + ' px, shape follows the image'
        : 'shape follows the image';
    } else if (current) {
      caption.textContent = current.width + ' × ' + current.height;
    } else {
      caption.textContent = reference ? 'reference shape, about 1 MP' : '1024 × 1024 until you add an image';
    }
  }

  // The shape the next image will have, for the progress card and its frame.
  function targetRatio() {
    const reference = lastReference();
    const referenceRatio = reference && reference.width ? reference.width / reference.height : 1;
    if (editing()) return referenceRatio;
    const current = currentOption();
    return current ? current.width / current.height : referenceRatio;
  }

  // ---- Count, steps, seed ------------------------------------------------------
  function clampCount() {
    const value = Math.min(MAX_BATCH, Math.max(1, parseInt(countInput.value, 10) || 1));
    countInput.value = value;
    document.getElementById('count-down').disabled = value <= 1;
    document.getElementById('count-up').disabled = value >= MAX_BATCH;
    return value;
  }
  function stepCount(delta) {
    countInput.value = clampCount() + delta;
    clampCount();
    refreshForm();
  }
  document.getElementById('count-down').addEventListener('click', function () { stepCount(-1); });
  document.getElementById('count-up').addEventListener('click', function () { stepCount(1); });
  countInput.addEventListener('blur', function () { clampCount(); refreshForm(); });

  document.getElementById('random-seed').addEventListener('click', function () {
    document.getElementById('seed').value = '';
    refreshForm();
  });

  function renderAdvancedValues() {
    const steps = document.getElementById('steps').value;
    const seed = document.getElementById('seed').value.trim();
    const scale = editing()
      ? 'CFG ' + document.getElementById('cfg').value
      : 'guidance ' + document.getElementById('guidance').value;
    const negative = document.getElementById('negative').value.trim() ? ', negative prompt' : '';
    document.getElementById('advanced-values').textContent =
      steps + ' steps, ' + scale + ', ' + (seed ? 'seed ' + seed : 'random seed') + negative;
    document.getElementById('steps-value').textContent = steps;
    document.getElementById('strength-value').textContent =
      Number(document.getElementById('strength').value).toFixed(2);
  }

  // ---- Estimate and the run button -----------------------------------------
  // Cost, before you spend it. Measured seconds per step on this machine:
  //
  //   megapixels   0.26   0.59   1.05   1.60   1.75
  //   mflux t2i    1.01   1.79   3.32      -   6.14
  //   edit         0.76   1.87   3.52   7.95   7.40
  //
  // The cost is superlinear in pixels, because attention is quadratic in token
  // count. A flat rate per pixel fit the small sizes and then under-promised
  // badly at the top: it called a run 4 minutes that took 345 seconds. That
  // edit was 1265 px at 40 steps; the same edit at 768 px and 24 steps took 72s
  // and was just as correct, so size is the dial to show. An
  // exponent of 1.25 holds both engines inside 3.3 to 4.4, so one curve covers
  // both. The constant sits at the high end on purpose, because an estimate
  // that runs short is worse than one that runs long.
  const STEP_COST = 4.0;          // seconds per step at one megapixel
  const STEP_EXPONENT = 1.25;
  const GENERATE_OVERHEAD = 3;    // per image; the model is already resident
  const EDIT_OVERHEAD = 20;       // once per batch; the child may have to load a pipeline

  // The constants above fit one machine. Once a run shows its real step rate,
  // that rate, brought back to one megapixel, replaces STEP_COST for the next
  // estimate on this device. It comes from the live steps, not from the time
  // an image took, which also holds one-off loads. Guidance above 1 runs two
  // passes per step, so those runs learn apart. Tab memory only.
  const learnedCost = {};
  let runKey = null;
  let runPixels = 0;

  function costKey() {
    const scale = Number(document.getElementById(editing() ? 'cfg' : 'guidance').value);
    return (editing() ? 'edit' : 'generate') + (scale > 1 ? ' two-pass' : '');
  }

  function targetPixels() {
    if (editing()) return Math.pow(editResolution(), 2);
    const current = currentOption();
    return current ? current.width * current.height : 1024 * 1024;
  }

  function estimate() {
    const steps = Number(document.getElementById('steps').value) || 0;
    const count = clampCount();
    const cost = learnedCost[costKey()] || STEP_COST;
    const perStep = cost * Math.pow(targetPixels() / 1e6, STEP_EXPONENT);
    const overhead = editing() ? EDIT_OVERHEAD : count * GENERATE_OVERHEAD;
    return 'about ' + spell(count * steps * perStep + overhead);
  }

  // What stops a run, said on the button itself rather than as an error after.
  function blocker() {
    if (editing() && !references.length) return 'Add an image to edit';
    if (!promptInput.value.trim()) return editing() ? 'Describe the change' : 'Write a prompt';
    if (PLACEHOLDER.test(promptInput.value)) return 'Fill in the [brackets]';
    return '';
  }

  function renderRunButton() {
    if (busy()) return;
    const reason = blocker();
    go.disabled = Boolean(reason);
    goSub.textContent = reason || estimate();
  }

  function refreshForm() {
    renderSize();
    renderAdvancedValues();
    renderRunButton();
  }

  function growPrompt() {
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.min(promptInput.scrollHeight + 2, 320) + 'px';
  }
  promptInput.addEventListener('input', growPrompt);

  // Templates follow the prompt tests in PROMPTS.md: concrete nouns, light,
  // lens and placement, and exact text in quotes. No quality suffix and no
  // negative prompt, because both cost more than they gave.
  const TEMPLATES = {
    generate: [
      ['Portrait photo', 'A person, with light and lens',
        'Close-up portrait photograph of [who: age, hair, look] in [place], at [time of day]. Wearing [clothing and colors], [pose or gaze], [expression]. [Light: direction and quality], [background, softly blurred]. 85mm lens at f/1.8, shallow depth of field, natural skin texture, [color mood].'],
      ['Product shot', 'An object on a surface, with space for copy',
        'Product photograph of [product: material, color, finish] on [surface] in [setting]. [Light: direction and quality], [one or two props] beside it. [Angle, e.g. three-quarter view at eye level], 85mm lens, empty space on the [side], [mood] mood.'],
      ['Landscape', 'A place, with the time and the view',
        'Wide photograph of [place] with [landmark] at [time of day and weather]. [A path, road or river] leads the eye from [where] toward [where]. [Sky and light]. Shot from [viewpoint], 24mm lens, deep focus, [detail] in the foreground, no text.'],
      ['Poster with text', 'Exact lettering, in any language',
        'Minimalist poster for [what]. At the top, a [lettering style] title "[title text]" in [color], with "[second line]" below it in [typeface style]. In the center, [main image]. At the bottom, the text "[small text]" in small [color] letters. [Background], generous empty space, centered layout, no other text.'],
      ['Illustration', 'A drawn or painted style',
        '[Medium, e.g. watercolor] illustration of [subject doing what] in [setting]. Palette of [3 or 4 colors], [line or brush quality], [light]. [Where the subject sits in the frame], [mood] mood, no text.'],
    ],
    edit: [
      ['Change a color or material', 'One object, the rest untouched',
        "Change only the [object]'s [color or material] to [new color and finish], keeping its [shape, texture, details]. Do not change the background, the lighting or the camera angle."],
      ['Replace the background', 'Keep the subject, move the scene',
        "Replace only the background with [new place, time, weather, 2 or 3 details]. Keep the [subject]'s face, expression, clothing, pose and framing exactly as they are, and match the light on the [subject] to the new scene."],
      ['Add text', 'A sign, label or banner',
        'Add [a sign, label or banner] at [position] with the text "[exact text]" in [color, letter style, size], spelled exactly. Match the scene\'s lighting and perspective, and keep everything else unchanged.'],
    ],
  };
  const PLACEHOLDER = /\[[^\]\n]+\]/;
  const templatesToggle = document.getElementById('templates-toggle');
  const templatesMenu = document.getElementById('templates');

  // The list is rebuilt on each open, because it follows the current mode. The
  // header and the hint are not items, so arrow keys and Tab skip them.
  function openTemplates() {
    templatesMenu.replaceChildren();
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = editing() ? 'Start an edit from a template' : 'Start from a template';
    templatesMenu.append(head);
    TEMPLATES[editing() ? 'edit' : 'generate'].forEach(function ([name, hint, text]) {
      const option = menuItem('', name, function () { useTemplate(text); });
      const note = document.createElement('span');
      note.className = 'item-note';
      note.textContent = hint;
      option.querySelector('.item-text').append(note);
      templatesMenu.append(option);
    });
    const foot = document.createElement('div');
    foot.className = 'menu-foot';
    foot.textContent = 'Press Tab to jump to the next [bracket].';
    templatesMenu.append(foot);
    toggleMenu(templatesMenu);
  }

  function useTemplate(text) {
    promptInput.value = text;
    growPrompt();
    refreshForm();
    promptInput.focus();
    selectPlaceholder(0);
  }

  // Selects the next [placeholder] at or after a position, so typing replaces
  // it. Returns false when none is left, and Tab then moves focus as usual.
  function selectPlaceholder(from) {
    const found = PLACEHOLDER.exec(promptInput.value.slice(from));
    if (!found) return false;
    promptInput.setSelectionRange(from + found.index, from + found.index + found[0].length);
    return true;
  }

  templatesToggle.addEventListener('click', function () {
    if (templatesMenu.hidden) openTemplates(); else closeMenus();
  });
  promptInput.addEventListener('keydown', function (event) {
    if (event.key !== 'Tab' || event.shiftKey) return;
    if (selectPlaceholder(promptInput.selectionEnd)) event.preventDefault();
  });
  form.addEventListener('input', refreshForm);
  form.addEventListener('change', refreshForm);

  // The mode only changes what the form looks like. The route stays /generate,
  // which dispatches on the mode field. Swapping hx-post here does not work:
  // htmx resolves the route when it first processes the element, so a later
  // setAttribute is ignored and every edit went to the generate engine.
  // The references are cleared, because the two modes read them differently:
  // a list built for an edit would silently shrink to its first image. The
  // prompt is cleared too: a scene description is not an edit instruction.
  function applyMode() {
    form.classList.toggle('mode-edit', editing());
    form.classList.toggle('mode-generate', !editing());
    promptInput.placeholder = editing()
      ? 'For example: make it night, with the lights on'
      : 'Describe the image. Put any text you want rendered in quotes.';
  }
  form.querySelectorAll('input[name=mode]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      applyMode();
      closeMenus();
      references = [];
      promptInput.value = '';
      growPrompt();
      renderReferences();
      renderStage();
    });
  });

  // ---- Gallery ----------------------------------------------------------------
  // The gallery lives in this tab only. The server keeps no image after it
  // answers and the page keeps them in memory, so a reload clears them and
  // nothing reaches disk. Download is the way to keep one.
  const canvas = document.getElementById('canvas');
  const stageBar = document.getElementById('stage-bar');
  const strip = document.getElementById('strip');
  let gallery = [];
  let view = null;          // an image id, or 'progress' while a run is shown
  let arrivedId = null;     // the image to fade in once, on arrival
  let nextId = 1;
  let batchSource = null;   // the source of a one-image edit, for before and after

  function harvest() {
    incoming.querySelectorAll('.item').forEach(function (node) {
      const data = node.dataset;
      const entry = {
        id: nextId++, src: node.querySelector('img').src, seed: data.seed,
        width: data.width, height: data.height, steps: data.steps, elapsed: data.elapsed,
        position: data.position, mode: data.mode, prompt: data.prompt,
        before: data.mode === 'edit' ? batchSource : null,
      };
      gallery.unshift(entry);
      arrivedId = entry.id;
      if (view !== 'progress') view = entry.id;
      node.remove();
    });
    incoming.querySelectorAll(':scope > .err, :scope > .hint').forEach(function (node) {
      showToast(node.classList.contains('err') ? 'error' : 'info', node.textContent);
      node.remove();
    });
    // The last image of a batch arrives by a chain placeholder, and removing it
    // here detaches the node htmx then fires afterSettle on, so that event never
    // reaches the body. The run ends here instead, once no link is left.
    // stopWork renders, and a second render would restart the arrival fade.
    if (busy() && !incoming.querySelector('.chain')) return stopWork();
    renderStrip();
    renderStage();
  }

  // Answers arrive by several routes: the form's own request, and each chain
  // placeholder replacing itself. Watching the container catches all of them.
  new MutationObserver(function (records) {
    if (records.some(function (record) { return record.addedNodes.length; })) harvest();
  }).observe(incoming, { childList: true, subtree: true });

  function selected() {
    return gallery.find(function (entry) { return entry.id === view; });
  }

  function ringMarkup(size) {
    const radius = size === 'small' ? 12 : 30;
    const box = radius * 2 + 8;
    return '<div class="ring waiting"><svg viewBox="0 0 ' + box + ' ' + box + '">'
      + '<circle class="track" cx="' + box / 2 + '" cy="' + box / 2 + '" r="' + radius + '"/>'
      + '<circle class="value" cx="' + box / 2 + '" cy="' + box / 2 + '" r="' + radius + '"'
      + ' stroke-dasharray="' + (2 * Math.PI * radius) + '" stroke-dashoffset="' + (2 * Math.PI * radius * 0.75) + '"/>'
      + '</svg>' + (size === 'small' ? '' : '<span class="percent num"></span>') + '</div>';
  }

  function renderStrip() {
    const wrap = document.getElementById('strip-wrap');
    wrap.hidden = !gallery.length && !busy();
    strip.innerHTML = '';
    if (busy()) {
      const pending = document.createElement('button');
      pending.type = 'button';
      pending.className = 'frame pending' + (view === 'progress' ? ' selected' : '');
      pending.style.width = Math.round(72 * Math.min(2, Math.max(0.5, targetRatio()))) + 'px';
      pending.setAttribute('aria-label', 'Show the image in progress');
      pending.innerHTML = ringMarkup('small');
      pending.addEventListener('click', function () { view = 'progress'; renderStrip(); renderStage(); });
      strip.append(pending);
    }
    gallery.forEach(function (entry) {
      const frame = document.createElement('button');
      frame.type = 'button';
      frame.className = 'frame' + (entry.id === view ? ' selected' : '') + (entry.id === arrivedId ? ' arrive' : '');
      frame.title = 'Seed ' + entry.seed;
      frame.setAttribute('aria-label', entry.mode + ', seed ' + entry.seed);
      frame.innerHTML = '<img alt="" src="' + entry.src + '">'
        + (entry.mode === 'edit' ? '<span class="corner">' + icon('brush') + '</span>' : '');
      frame.addEventListener('click', function () { view = entry.id; renderStrip(); renderStage(); });
      strip.append(frame);
    });
    const count = gallery.length;
    document.getElementById('strip-note').textContent = count
      ? count + (count === 1 ? ' image' : ' images') + ' in this tab. Download the ones you want to keep.'
      : 'Images stay in this tab only.';
    document.getElementById('clear-gallery').hidden = !count;
    renderProgress();
  }

  function renderStage() {
    canvas.innerHTML = '';
    stageBar.hidden = true;
    if (view === 'progress' && busy()) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = ringMarkup('large')
        + '<div class="lines"><strong class="num" data-slot="step"></strong>'
        + '<span class="num" data-slot="image"></span><span class="num" data-slot="left"></span></div>';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', requestCancel);
      card.append(cancel);
      canvas.append(card);
      fitStage();
      renderProgress();
      return;
    }
    const entry = selected();
    if (!entry) return renderEmpty();
    const shot = document.createElement('div');
    shot.className = 'shot' + (entry.id === arrivedId ? ' arrive' : '');
    shot.dataset.ratio = entry.width / entry.height;
    const image = document.createElement('img');
    image.src = entry.src;
    image.alt = entry.prompt;
    shot.append(image);
    if (entry.before) renderCompare(shot, entry.before);
    canvas.append(shot);
    arrivedId = null;
    // The bar takes its height from the stage, so the shot is fitted after it.
    renderStageBar(entry);
    fitStage();
  }

  // An empty stage names the next step and offers it as a button.
  function renderEmpty() {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const title = document.createElement('strong');
    const line = document.createElement('p');
    const start = document.createElement('button');
    start.type = 'button';
    start.className = 'btn';
    if (editing() && references.length) {
      title.textContent = 'Ready to edit';
      line.textContent = 'Say what to change, then press Edit.';
      empty.append(title, line);
      canvas.append(empty);
      return;
    }
    if (editing()) {
      title.textContent = 'Edit an image';
      line.textContent = 'Add the image, then say what to change.';
      start.innerHTML = icon('image-in') + 'Choose an image';
      start.addEventListener('click', function () { referenceInput.click(); });
    } else {
      title.textContent = 'Nothing here yet';
      line.textContent = 'Write a prompt and press Generate, or start from a template.';
      start.innerHTML = icon('layout') + 'Browse templates';
      start.addEventListener('click', function (event) {
        event.stopPropagation();  // the click would reach the document and close the menu
        openTemplates();
      });
    }
    empty.append(title, line, start);
    canvas.append(empty);
  }

  function renderCompare(shot, source) {
    const before = document.createElement('img');
    before.className = 'before';
    before.src = source;
    before.alt = 'The image before the edit';
    const range = document.createElement('input');
    range.type = 'range';
    range.className = 'compare-range';
    range.min = '0';
    range.max = '100';
    range.setAttribute('aria-label', 'Compare before and after');
    const divider = document.createElement('div');
    divider.className = 'divider';
    divider.innerHTML = icon('grip');
    const left = document.createElement('span');
    left.className = 'compare-tag left';
    left.textContent = 'Before';
    const right = document.createElement('span');
    right.className = 'compare-tag right';
    right.textContent = 'After';
    function split() { shot.style.setProperty('--split', range.value + '%'); }
    range.value = '50';
    range.addEventListener('input', split);
    split();
    shot.append(before, range, divider, left, right);
  }

  function renderStageBar(entry) {
    stageBar.hidden = false;
    stageBar.innerHTML = '';
    const about = document.createElement('div');
    about.className = 'about';
    const facts = document.createElement('div');
    facts.className = 'facts num';
    const mode = document.createElement('span');
    mode.className = 'mode';
    mode.innerHTML = icon(entry.mode === 'edit' ? 'brush' : 'sparkle') + (entry.mode === 'edit' ? 'Edit' : 'Generate');
    facts.append(mode);
    [[entry.position === '1 image' ? '' : 'Image ' + entry.position, ''],
     ['Seed ' + entry.seed, ''], [entry.width + ' × ' + entry.height, ''],
     [entry.steps + ' steps', ''], [entry.elapsed + 's', '']].forEach(function (pair) {
      if (!pair[0]) return;
      const fact = document.createElement('span');
      fact.className = pair[1];
      fact.textContent = pair[0];
      facts.append(fact);
    });
    const prompt = document.createElement('p');
    prompt.className = 'prompt-line';
    prompt.textContent = entry.prompt;
    prompt.title = entry.prompt;
    about.append(facts, prompt);

    // Every action is page state only; nothing is sent until the next run.
    const actions = document.createElement('div');
    actions.className = 'actions';
    // Edit this and Download are the two next steps people take; the reuse
    // actions are rarer, so they wait behind More to keep the row short.
    const more = document.createElement('div');
    more.className = 'menu-anchor';
    const moreToggle = iconButton('more', 'More actions', function () { toggleMenu(moreMenu); });
    moreToggle.setAttribute('aria-controls', 'more-menu');
    moreToggle.setAttribute('aria-expanded', 'false');
    const moreMenu = document.createElement('div');
    moreMenu.className = 'menu up';
    moreMenu.id = 'more-menu';
    moreMenu.setAttribute('role', 'menu');
    moreMenu.hidden = true;
    moreMenu.append(
      menuItem('image-in', 'Use as reference', function () {
        addReference(entry.src.split(',')[1], 'Seed ' + entry.seed);
      }),
      menuItem('hash', 'Reuse seed ' + entry.seed, function () {
        document.getElementById('seed').value = entry.seed;
        document.getElementById('advanced').open = true;
        refreshForm();
      }),
      menuItem('text', 'Reuse prompt', function () {
        promptInput.value = entry.prompt;
        growPrompt();
        refreshForm();
        promptInput.focus();
      })
    );
    more.append(moreToggle, moreMenu);
    const download = document.createElement('a');
    download.className = 'btn';
    download.href = entry.src;
    download.download = 'qwen21-' + entry.mode + '-' + entry.seed + '.png';
    download.innerHTML = icon('download') + 'Download';
    const rule = document.createElement('span');
    rule.className = 'rule';
    actions.append(textButton('brush', 'Edit this', function () { editThis(entry); }), more,
      download, rule,
      iconButton('trash', 'Remove from this tab', function () { removeEntry(entry.id); }, 'danger'));
    stageBar.append(about, actions);
  }

  // ---- Menus -----------------------------------------------------------------
  // One menu is open at most. A click outside or Escape closes it, and Escape
  // returns focus to the button that opened it.
  function toggleMenu(menu) {
    const opening = menu.hidden;
    closeMenus();
    if (!opening) return;
    menu.hidden = false;
    menuToggle(menu).setAttribute('aria-expanded', 'true');
    menu.querySelector('button').focus();
  }

  function menuToggle(menu) {
    return document.querySelector('[aria-controls="' + menu.id + '"]');
  }

  function closeMenus() {
    document.querySelectorAll('.menu:not([hidden])').forEach(function (menu) {
      menu.hidden = true;
      const toggle = menuToggle(menu);
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  function menuItem(name, label, handler) {
    const item = document.createElement('button');
    item.type = 'button';
    item.setAttribute('role', 'menuitem');
    item.innerHTML = (name ? icon(name) : '') + '<span class="item-text"></span>';
    item.querySelector('.item-text').textContent = label;
    item.addEventListener('click', function () {
      closeMenus();
      handler();
    });
    return item;
  }

  document.addEventListener('click', function (event) {
    if (event.target.closest('.menu, [aria-controls]')) return;
    closeMenus();
  });
  document.addEventListener('keydown', function (event) {
    const open = document.querySelector('.menu:not([hidden])');
    if (!open) return;
    if (event.key === 'Escape') {
      closeMenus();
      menuToggle(open).focus();
      return;
    }
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    event.preventDefault();
    const items = Array.from(open.querySelectorAll('button'));
    const step = event.key === 'ArrowDown' ? 1 : -1;
    const index = items.indexOf(document.activeElement);
    items[(index + step + items.length) % items.length].focus();
  });

  // Edit mode with this image as the only reference, an empty prompt, and the
  // image's own seed, so a rerun of the same edit gives the same result.
  function editThis(entry) {
    const editRadio = document.getElementById('mode-edit');
    if (!editRadio.checked) {
      editRadio.checked = true;
      editRadio.dispatchEvent(new Event('change', { bubbles: true }));
    }
    references = [];
    promptInput.value = '';
    growPrompt();
    document.getElementById('seed').value = entry.seed;
    addReference(entry.src.split(',')[1], 'Seed ' + entry.seed);
    view = entry.id;
    renderStage();
    promptInput.focus();
  }

  function textButton(name, label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn quiet';
    button.innerHTML = icon(name) + label;
    button.addEventListener('click', handler);
    return button;
  }

  function iconButton(name, label, handler, extra) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon-btn' + (extra ? ' ' + extra : '');
    button.title = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = icon(name);
    button.addEventListener('click', handler);
    return button;
  }

  // The card takes the shape of the coming image, fitted inside the stage the
  // way the image itself will be.
  function fitBox(box, ratio, share) {
    const width = Math.min((canvas.clientWidth - 48) * share, (canvas.clientHeight - 48) * share * ratio);
    box.style.width = Math.round(width) + 'px';
    box.style.height = Math.round(width / ratio) + 'px';
  }

  function fitStage() {
    const card = canvas.querySelector('.card');
    if (card) fitBox(card, targetRatio(), 0.9);
    const shot = canvas.querySelector('.shot');
    if (shot) fitBox(shot, Number(shot.dataset.ratio), 1);
  }
  window.addEventListener('resize', fitStage);

  function removeEntry(id) {
    const index = gallery.findIndex(function (entry) { return entry.id === id; });
    gallery.splice(index, 1);
    const neighbour = gallery[Math.min(index, gallery.length - 1)];
    view = neighbour ? neighbour.id : null;
    renderStrip();
    renderStage();
  }

  document.getElementById('clear-gallery').addEventListener('click', function () {
    if (!confirm('Remove all ' + gallery.length + ' images from this tab?')) return;
    gallery = [];
    view = busy() ? 'progress' : null;
    renderStrip();
    renderStage();
  });

  // ---- Toasts -----------------------------------------------------------------
  // Errors stay until closed, because they say what to fix. Anything else
  // clears itself.
  const toasts = document.getElementById('toasts');
  function showToast(kind, text) {
    const toast = document.createElement('div');
    toast.className = 'toast ' + kind;
    toast.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    const message = document.createElement('p');
    message.textContent = text;
    toast.innerHTML = icon(kind === 'error' ? 'alert' : 'info');
    toast.append(message, iconButton('x', 'Dismiss', function () { toast.remove(); }));
    toasts.append(toast);
    if (kind !== 'error') setTimeout(function () { toast.remove(); }, 4000);
  }

  // ---- Run, progress, cancel --------------------------------------------------
  // The poller clocks itself off its own response, and stops when the server
  // says nothing is running. That gap happens between two images of a batch, so
  // every request the page sends plants a fresh poller.
  const POLLER = '<div hx-get="/progress" hx-trigger="load"'
    + ' hx-target="#progress" hx-swap="innerHTML"></div>';
  let progressState = null;
  let pace = null;          // when this image's steps started arriving, for the time left

  function startWork(element) {
    const fresh = element === form;
    document.body.classList.add('busy');
    go.disabled = true;
    document.getElementById('go-busy').textContent = editing() ? 'Editing' : 'Generating';
    progressSlot.innerHTML = POLLER;
    htmx.process(progressSlot);
    if (fresh) {
      runKey = costKey();
      runPixels = targetPixels();
      view = 'progress';
      progressState = null;
      pace = null;
      renderStrip();
      renderStage();
    }
  }

  // The tab title shows the progress, so a run can be watched from another tab.
  // A run that ends in the background leaves "Done" until the tab is seen.
  const BASE_TITLE = document.title;
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !busy()) document.title = BASE_TITLE;
  });

  function stopWork() {
    if (!busy()) return;
    document.title = (document.hidden ? '(Done) ' : '') + BASE_TITLE;
    document.body.classList.remove('busy', 'stopping');
    progressSlot.innerHTML = '';
    progressState = null;
    goFill.style.width = '0';
    if (view === 'progress') view = gallery.length ? gallery[0].id : null;
    renderStrip();
    renderStage();
    renderRunButton();
  }

  function requestCancel() {
    if (document.body.classList.contains('stopping')) return;
    document.body.classList.add('stopping');
    renderProgress();
    htmx.ajax('POST', '/cancel', { swap: 'none' });
  }

  // Cmd+Enter (Ctrl+Enter off a Mac) runs from anywhere on the page. It obeys
  // the same rule as a click: nothing happens while the button is disabled.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || !(event.metaKey || event.ctrlKey)) return;
    event.preventDefault();
    if (!go.disabled) form.requestSubmit(go);
  });

  new MutationObserver(function () {
    const node = progressSlot.querySelector('.progress-state');
    progressState = node ? {
      stage: node.dataset.stage, step: Number(node.dataset.step), total: Number(node.dataset.total),
      label: node.dataset.label, stopping: node.dataset.stopping === '1',
    } : null;
    trackPace();
    renderProgress();
  }).observe(progressSlot, { childList: true, subtree: true });

  // Time left comes from how fast this image's steps actually arrive, not from
  // the estimate: the rate is only known once two steps have been seen.
  function trackPace() {
    const state = progressState;
    if (!state || state.stage !== 'running') return;
    const now = Date.now();
    if (!pace || pace.label !== state.label || state.step < pace.lastStep) {
      pace = { label: state.label, startedAt: now, firstStep: state.step, lastStep: state.step };
      return;
    }
    pace.lastStep = state.step;
    const stepsSeen = state.step - pace.firstStep;
    if (stepsSeen < 2) return;
    const perStep = (now - pace.startedAt) / 1000 / stepsSeen;
    learnedCost[runKey] = perStep / Math.pow(runPixels / 1e6, STEP_EXPONENT);
  }

  function timeLeft() {
    const state = progressState;
    if (!state || !pace || state.step - pace.firstStep < 1) return 'Estimating time left';
    const perStep = (Date.now() - pace.startedAt) / 1000 / (state.step - pace.firstStep);
    const batch = (state.label || '').match(/(\d+) of (\d+)/);
    const imagesAfter = batch ? Number(batch[2]) - Number(batch[1]) : 0;
    const seconds = perStep * ((state.total - state.step) + imagesAfter * state.total);
    return seconds < 3 ? 'Almost done' : 'About ' + spell(seconds) + ' left';
  }

  function renderProgress() {
    if (!busy()) return;
    const state = progressState;
    const stopping = document.body.classList.contains('stopping') || (state && state.stopping);
    const running = state && state.stage === 'running' && state.total;
    const fraction = running ? state.step / state.total : 0;
    let stepText = 'Starting';
    if (state && state.stage === 'preparing') stepText = 'Preparing the model';
    if (running) stepText = 'Step ' + state.step + ' of ' + state.total;
    if (stopping) stepText = 'Stopping at the end of this step';

    goSub.textContent = stopping ? '' : stepText;
    document.title = (running ? '(' + Math.round(fraction * 100) + '%) ' : '') + BASE_TITLE;
    goFill.style.width = Math.round(fraction * 100) + '%';
    document.querySelectorAll('.ring').forEach(function (ring) {
      ring.classList.toggle('waiting', !running);
      const value = ring.querySelector('.value');
      const circumference = Number(value.getAttribute('stroke-dasharray'));
      value.setAttribute('stroke-dashoffset', running ? circumference * (1 - fraction) : circumference * 0.75);
      const percent = ring.querySelector('.percent');
      if (percent) percent.textContent = running ? Math.round(fraction * 100) + '%' : '';
    });
    const slots = canvas.querySelectorAll('[data-slot]');
    slots.forEach(function (slot) {
      if (slot.dataset.slot === 'step') slot.textContent = stepText;
      if (slot.dataset.slot === 'image') slot.textContent = state && state.label ? 'Image ' + state.label : '';
      if (slot.dataset.slot === 'left') slot.textContent = running && !stopping ? timeLeft() : '';
    });
  }

  function sideChannel(event) {
    const config = event.detail.requestConfig || event.detail.pathInfo || {};
    const path = config.path || config.requestPath || '';
    return path === '/progress' || path === '/cancel';
  }

  // The references are an array, not a form field, so they are attached here.
  // Only the form itself carries them: a chain request already has a token.
  document.body.addEventListener('htmx:configRequest', function (event) {
    if (event.detail.elt !== form) return;
    // Only a one-image edit changes that image in place. An edit from several
    // images composes them, so no single source lines up with the result and
    // a wipe between them would mislead.
    batchSource = editing() && references.length === 1
      ? 'data:image/png;base64,' + references[0].b64 : null;
    event.detail.parameters.references = JSON.stringify(references.map(function (r) {
      return r.b64;
    }));
  });
  document.body.addEventListener('htmx:beforeRequest', function (event) {
    if (sideChannel(event)) return;
    if (event.detail.elt === form) toasts.innerHTML = '';
    startWork(event.detail.elt);
  });
  document.body.addEventListener('htmx:afterSettle', function (event) {
    // A /progress response settles once a second. It is not the end of the run,
    // and treating it as one used to clear the busy state mid-generation.
    if (sideChannel(event)) return;
    if (!document.querySelector('.chain')) stopWork();
  });
  document.body.addEventListener('htmx:responseError', stopWork);
  document.body.addEventListener('htmx:sendError', function () {
    stopWork();
    showToast('error', 'The server did not answer. Check that qwen21 server is still running.');
  });

  // The images live only in this tab, so a reload or a close would lose them.
  // Browsers show their own fixed text here; the page cannot set it.
  window.addEventListener('beforeunload', function (event) {
    if (!gallery.length && !busy()) return;
    event.preventDefault();
    event.returnValue = '';
  });

  buildSizeControls();
  applyMode();
  renderReferences();
  renderStrip();
  renderStage();
</script>
</body>
</html>
