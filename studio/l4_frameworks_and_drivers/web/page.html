<script>
  // The saved theme applies before the first paint, so the page never flashes the default.
  // Kodak is the default. Darkroom saves an empty name, so a pick of it stays.
  try {
    const theme = localStorage.getItem('studio-theme') ?? 'kodak';
    if (theme) document.documentElement.dataset.theme = theme;
  } catch (error) {
    console.warn('The saved theme was not read:', error);
  }
</script>

      <!-- The frames are components/image-strip.js, which draws them from the
           store. The head above them stays the page's: it holds the two buttons

      <image-strip class="strip" id="strip"></image-strip>

    <!-- Server answers land here and move into the gallery. The batch chain
         placeholders wait here too, so the next request stays in the DOM. -->

  <aside>

            <button type="button" class="pill" id="rewrite-toggle" hidden

            </div>
          </div>

        </div>

        <!-- One row per colour marked, in the prompt's own place, because while a
             region is drawn these rows are what the prompt is. -->

          </div>

<script>
  // What the backend offers. The page reads every mode, param, limit, Look,
  // template and estimate from here, and hides or disables what is missing.
  const STUDIO = __STUDIO__;
  const MAX_BATCH = STUDIO.backend.max_batch;
  const MODES = {};
  STUDIO.modes.forEach(function (mode) { MODES[mode.id] = mode; });
  // The film edge prints the model name, the way a film stock prints its own.
  const EDGE_NAME = STUDIO.backend.name.toUpperCase().replace(/-/g, ' ')
    .replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });

  const form = document.getElementById('form');
  const go = document.getElementById('go');
  const goSub = document.getElementById('go-sub');
  const promptInput = document.getElementById('prompt');
  const countInput = document.getElementById('count');
  const sizeSelect = document.getElementById('size');
  const resolutionSelect = document.getElementById('resolution');
  const progressSlot = document.getElementById('progress');
  const incoming = document.getElementById('incoming');

  function icon(name) {
    return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  }

  function editing() {
    return document.getElementById('mode-edit').checked;
  }

  function currentMode() {
    return MODES[editing() ? 'edit' : 'generate'];
  }

  function paramSpec(id) {
    return currentMode().params.find(function (param) { return param.id === id; });
  }

  function maxReferences() {
    return currentMode().max_references;
  }

  // A choice param fills its hidden select, so the request stays a plain form.
  function fillSelect(select, id) {
    const spec = STUDIO.modes.map(function (mode) {
      return mode.params.find(function (param) { return param.id === id; });
    }).find(Boolean);
    if (!spec) return;
    spec.choices.forEach(function (choice) { select.add(new Option(choice.label, choice.value)); });
    select.value = spec.default;
  }
  fillSelect(document.getElementById('size'), 'size');
  fillSelect(document.getElementById('resolution'), 'resolution');

  // A number param takes its range from the spec of the mode in use. The value
  // carries over a mode switch when it still fits the new range. An input takes
  // its default the first time a mode applies it, because a range input never
  // starts empty: it reads as the middle of its range, and the new range clamps
  // that to a value that fits, such as 10 for a guidance of 1 to 10. A
  // choice param takes the mode's default on every switch, because a mode
  // switch starts over: an edit keeps the image's shape, a generate is square.
  function applyParams() {
    form.querySelectorAll('[data-param]').forEach(function (node) {
      node.hidden = !paramSpec(node.dataset.param);
    });
    document.getElementById('size-field').hidden = !paramSpec('size') && !paramSpec('resolution');
    currentMode().params.filter(function (param) { return param.kind === 'number'; }).forEach(function (param) {
      const input = document.getElementById(param.id);
      if (!input) return;
      input.min = param.minimum === null ? '' : param.minimum;
      input.max = param.maximum === null ? '' : param.maximum;
      input.step = param.step === null ? 'any' : param.step;
      const value = Number(input.value);
      const fits = input.value !== '' && (param.minimum === null || value >= param.minimum)
        && (param.maximum === null || value <= param.maximum);
      if (!fits || !input.dataset.applied) input.value = param.default;
      input.dataset.applied = '1';
    });
    currentMode().params.filter(function (param) { return param.kind === 'choice'; }).forEach(function (param) {
      const select = document.getElementById(param.id);
      if (select) select.value = param.default;
    });
  }

  function busy() {
    return document.body.classList.contains('busy');
  }

  // The run button carries the run state as an attribute of its own, so anything
  // that reads the state in the DOM reads this and not the button's name. The
  // labels read the same state off an attribute of their own, because `stopping`
  // is a class on the body and not a store field, and the labels are a component
  // the page cannot reach into. Which label shows is still the DOM's: the
  // component sets `hidden` on the ones it is not using, and no rule in the
  // stylesheet sets `display` on one.
  function syncRunState() {
    if (document.body.classList.contains('stopping')) {
      go.dataset.state = 'stopping';
    } else {
      go.dataset.state = busy() ? 'busy' : 'idle';
    }
    document.getElementById('run-labels').dataset.state = go.dataset.state;
  }

  function spell(seconds) {
    if (seconds < 90) return Math.max(5, Math.round(seconds / 5) * 5) + 's';
    const minutes = Math.floor(seconds / 60);
    const rest = Math.round((seconds % 60) / 15) * 15;
    if (rest && rest < 60) return minutes + ' min ' + rest + 's';
    return (minutes + (rest ? 1 : 0)) + ' min';
  }

  // ---- References ---------------------------------------------------------
  // References live in one array, whatever put them there: the picker, a drop,
  // a paste, or "Use as reference" on a result. Each mode sets how many it
  // takes. When a mode takes one, a new one replaces the old. Files are read here and posted as base64 in a normal
  // form field, which keeps the server off multipart parsing that the standard
  // library no longer ships.
  //
  // The list is drawn by components/reference-list.js from the store, which this
  // mirrors on every change. What stays here is the list itself, the zone that
  // fills it, and the three things the page owns: the form's flag, the file
  // input's `multiple`, and the Remove all button.
  const referenceInput = document.getElementById('reference');
  const refsZone = document.getElementById('refs');
  let references = [];

  function referenceLimit() {
    return maxReferences();
  }

  function lastReference() {
    return references[references.length - 1];
  }

  // The follow-ups a new list needs. The tree itself is the module's: this
  // pushes the array into the store, which is what redraws it.
  function renderReferences() {
    const count = references.length;
    form.classList.toggle('has-ref', count > 0);
    referenceInput.multiple = editing();
    document.getElementById('clear-reference').hidden = count < 2;
    pushReferences();
    refreshForm();
    region.sync();
    // An empty stage says what to do next, and that depends on the references.
    if (view === null) renderStage();
  }

  // The estimate, the "Match" size, the progress card's shape and the region
  // canvas all need the pixel size, so it is read once here. Reading it is
  // asynchronous, which is why the size is checked rather than assumed.
  function probeSize(entry) {
    if (entry.width) return;
    const probe = new Image();
    probe.onload = function () {
      entry.width = probe.naturalWidth;
      entry.height = probe.naturalHeight;
      renderReferences();
    };
    probe.src = 'data:image/png;base64,' + entry.b64;
  }

  // `source` is the id of the frame the image came from; an upload has none.
  function addReference(b64, name, source) {
    if (referenceLimit() === 1) references = [];
    if (references.length >= referenceLimit()) {
      showToast('info', 'Edit takes at most ' + maxReferences() + ' images.');
      return;
    }
    const entry = { b64: b64, name: name, width: 0, height: 0, source: source || null };
    references.push(entry);
    probeSize(entry);
    renderReferences();
  }

  function addFiles(files) {
    Array.from(files).filter(function (file) {
      return file.type.startsWith('image/');
    }).forEach(function (file) {
      const reader = new FileReader();
      reader.onload = function () {
        addReference(reader.result.split(',')[1], file.name);
      };
      reader.readAsDataURL(file);
    });
  }

  // ---- Marking a region -------------------------------------------------------
  // The brush, the overlay on the print, the magnifier, the mask, the tools and
  // the region rows belong to components/region-mark.js. That module owns the
  // drawing and the state it is written in: a stroke has to paint in the task
  // that asked for it, because the magnifier follows the pointer, and a row has
  // to keep the text someone is typing in it. Nothing is published on `window`:
  // the page asks the region real questions through the handle below, and the
  // module asks the page for what it owns and the module cannot see.
  //
  // The module is deferred, so the page's own draws ask the region questions
  // before its handle arrives. These are the five they ask, and the answers are
  // the true ones while nothing is drawn, which is the case until the module is
  // here. The module replaces the whole object on `region-mark-ready`. A question
  // a user action asks is not answered here: the module is deferred, so it is
  // loaded before the page is, the way the menus are.
  let region = {
    sync: function () {},
    preview: function () {},
    dropStale: function () {},
    onPrint: function () { return false; },
    count: function () { return 0; },
  };
  document.addEventListener('region-mark-ready', function (event) {
    region = event.detail.configure({
      // The reference list is the page's, because a run posts it, so the guard
      // asks for it rather than keeping a second copy that could drift.
      references: function () { return references; },
      view: function () { return view; },
      editing: editing,
      // The mode in force declares whether it takes a region at all.
      regionMarking: function () { return Boolean(currentMode().region_marking); },
      prompt: function () { return promptInput.value; },
      // The stage and the sidebar are the page's. The module asks for their
      // redraws and never sequences a render it does not own.
      redraw: renderStage,
      refresh: refreshForm,
      notify: showToast,
      iconButton: iconButton,
    });
  });


  referenceInput.addEventListener('change', function () {
    addFiles(referenceInput.files);
    referenceInput.value = '';
  });
  refsZone.addEventListener('click', function () { referenceInput.click(); });
  refsZone.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    referenceInput.click();
  });
  refsZone.addEventListener('dragover', function (event) {
    event.preventDefault();
    refsZone.classList.add('over');
  });
  refsZone.addEventListener('dragleave', function () { refsZone.classList.remove('over'); });
  refsZone.addEventListener('drop', function (event) {
    event.preventDefault();
    refsZone.classList.remove('over');
    addFiles(event.dataTransfer.files);
  });
  document.addEventListener('paste', function (event) {
    const files = event.clipboardData ? event.clipboardData.files : [];
    if (!files.length) return;  // a text paste goes to the field as usual
    event.preventDefault();
    addFiles(files);
  });
  document.getElementById('clear-reference').addEventListener('click', function () {
    references = [];
    renderReferences();
  });

  // ---- Size -----------------------------------------------------------------
  // The hidden selects stay the form fields, filled by the server as before.
  // The chips only drive them, so the request is exactly what it was.
  const sizeOptions = Array.from(sizeSelect.options).filter(function (option) {
    return option.value !== 'match';
  }).map(function (option) {
    const parts = option.value.split('x').map(Number);
    const named = option.textContent.match(/\((\d+:\d+)\)/);
    return { value: option.value, width: parts[0], height: parts[1],
             ratio: parts[0] === parts[1] ? '1:1' : (named ? named[1] : parts[0] + ':' + parts[1]) };
  });
  const ratios = [];
  sizeOptions.forEach(function (option) {
    if (ratios.indexOf(option.ratio) < 0) ratios.push(option.ratio);
  });

  function currentOption() {
    return sizeOptions.find(function (option) { return option.value === sizeSelect.value; });
  }

  function setSelect(select, value) {
    select.value = value;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }

  // A resolution param sets pixels only, and the shape follows the reference.
  // A size param sets both. Which one a mode has decides the size, not the mode.
  function followsReference() {
    return Boolean(paramSpec('resolution'));
  }

  function editResolution() {
    const chosen = resolutionSelect.value;
    if (chosen !== 'match') return Number(chosen);
    const reference = lastReference();
    if (!reference || !reference.width) return 1024;
    const side = Math.round(Math.sqrt(reference.width * reference.height));
    const cap = currentMode().estimate && currentMode().estimate.match_cap;
    return cap ? Math.min(side, cap) : side;
  }

  // The shape the next image will have, for the progress card and its frame.
  function targetRatio() {
    const reference = lastReference();
    const referenceRatio = reference && reference.width ? reference.width / reference.height : 1;
    if (followsReference()) return referenceRatio;
    const current = currentOption();
    return current ? current.width / current.height : referenceRatio;
  }

  // ---- Count, steps, seed ------------------------------------------------------
  const countToggle = document.getElementById('count-toggle');
  const countMenu = document.getElementById('count-menu');

  function clampCount() {
    const value = Math.min(MAX_BATCH, Math.max(1, parseInt(countInput.value, 10) || 1));
    countInput.value = value;
    document.getElementById('count-shown').textContent = '×' + value;
    countToggle.setAttribute('aria-label', value + (value === 1 ? ' image' : ' images') + ', change the count');
    return value;
  }

  // The count is part of the run button, so it reads as "Generate ×2". The menu
  // opens on the current count, marked with a check.
  function openCount() {
    const current = clampCount();
    countMenu.replaceChildren();
    for (let count = 1; count <= MAX_BATCH; count++) {
      const option = menus.menuItem('check', count + (count === 1 ? ' image' : ' images'), function () {
        countInput.value = count;
        clampCount();
        refreshForm();
        countToggle.focus();
      });
      option.setAttribute('role', 'menuitemradio');
      option.setAttribute('aria-checked', String(count === current));
      countMenu.append(option);
    }
    menus.toggleMenu(countMenu);
    if (!countMenu.hidden) countMenu.querySelector('[aria-checked=true]').focus();
  }
  countToggle.addEventListener('click', openCount);

  document.getElementById('clear-seed').addEventListener('click', function () {
    document.getElementById('seed').value = '';
    refreshForm();
  });

  // The advanced panel's own readouts belong to components/advanced-panel.js,
  // which draws them from the store. Two things stay here. The reference
  // strength is not part of that panel. And Clear is a real button, so it stays
  // in the page's markup, where a screen reader and the keyboard reach it.
  function renderStrength() {
    const steps = document.getElementById('steps').value;
    document.getElementById('strength-value').textContent =
      Number(document.getElementById('strength').value).toFixed(2);
    document.getElementById('strength-hint').textContent = 'Runs ' + stepsToRun() + ' of ' + steps +
      ' steps. Higher stays closer to the starting image.';
  }

  function renderClearSeed() {
    document.getElementById('clear-seed').hidden = !document.getElementById('seed').value.trim();
  }

  // mflux skips the start of the schedule for a starting image:
  // init_time_step = max(1, int(steps * strength)). Only the rest runs.
  function stepsToRun() {
    const steps = Number(document.getElementById('steps').value) || 0;
    const strength = Number(document.getElementById('strength').value) || 0;
    return steps - Math.max(1, Math.floor(steps * strength));
  }

  // ---- Estimate and the run button -----------------------------------------
  // Cost, before you spend it. The backend gives seconds per step at one
  // megapixel and how that grows with size; its adapter holds the measurements.
  // A mode without an estimate shows no time.

  // The backend's constants fit one machine. Once a run shows its real step
  // rate, that rate, brought back to one megapixel, replaces the constant for
  // the next estimate on this device. It comes from the live steps, not from
  // the time an image took, which also holds one-off loads. Guidance above 1
  // runs two passes per step, so those runs learn apart. Tab memory only.
  const learnedCost = {};
  let runKey = null;
  let runPixels = 0;
  let runEstimate = null;   // the estimate model of the mode in flight
  let runStepSeconds = 0;   // the pre-run guess per step, until real steps arrive
  let runRatio = 1;         // the shape of the image in flight, whatever the form says now

  // The mode's guidance scale, whichever of the two names it declares.
  function scaleParam() {
    return paramSpec('cfg') ? 'cfg' : paramSpec('guidance') ? 'guidance' : '';
  }

  // A backend with a negative prompt runs the second pass only for a set
  // negative: qwen21 at guidance 2.5 and a blank negative takes the time of
  // guidance 1. A backend without one runs it for any guidance above 1.
  function twoPass() {
    const id = scaleParam();
    if (!id || Number(document.getElementById(id).value) <= 1) return false;
    return !paramSpec('negative') || Boolean(negativeText());
  }

  function costKey() {
    return STUDIO.backend.id + ' ' + currentMode().id + ' ' + sentReferences() + ' images'
      + (twoPass() ? ' two-pass' : '');
  }

  // The images a run will carry: the references, and the mask when one is drawn.
  // Each one is encoded and attended to, so the count is part of the cost.
  function sentReferences() {
    return references.length + (region.count() ? 1 : 0);
  }

  // One more image costs more per step, by the factor the backend measured. It
  // scales the constants only: a rate this device has shown already has the shape
  // it was shown for, because the key carries the count.
  function referenceFactor(model) {
    if (!model.per_reference) return 1;
    return 1 + model.per_reference * Math.max(0, sentReferences() - 1);
  }

  function targetPixels() {
    if (followsReference()) return Math.pow(editResolution(), 2);
    const current = currentOption();
    return current ? current.width * current.height : 1024 * 1024;
  }

  // Seconds per step for the form as it stands, from what this device has
  // shown so far or else from the backend's constants.
  function stepSeconds() {
    const model = currentMode().estimate;
    if (!model) return 0;
    // The constant holds the passes it was measured with, so rescale it to the
    // passes the form asks for. A learned rate is already per pass count.
    const passes = (twoPass() ? 2 : 1) / (model.two_pass ? 2 : 1);
    const learned = learnedCost[costKey()];
    const cost = learned === undefined
      ? model.step_cost * passes * referenceFactor(model) : learned;
    return cost * Math.pow(targetPixels() / 1e6, model.exponent);
  }

  function estimate() {
    const count = clampCount();
    const images = count > 1 ? count + ' images' : '';
    const model = currentMode().estimate;
    if (!model || !paramSpec('steps')) return images;
    const steps = Number(document.getElementById('steps').value) || 0;
    const perStep = stepSeconds();
    const overhead = model.overhead_per_image ? count * model.overhead : model.overhead;
    const time = 'about ' + spell(count * steps * perStep + overhead);
    return images ? images + ', ' + time : time;
  }

  // What stops a run, said on the button itself rather than as an error after.
  function blocker() {
    if (editing() && !references.length) return 'Add an image to edit';
    // With a region marked, the per area rows are the prompt, so the field is not
    // asked for one.
    const regions = region.count();
    if (!regions && !promptInput.value.trim()) return editing() ? 'Describe the change' : 'Write a prompt';
    // The region token is not the user's to fill: the page replaces it with the
    // number of the image carrying the mask. Without a drawn region there is no
    // such image, so the run waits for one. With the tool off, the wait would never
    // end, so that case names the way out instead.
    if (region.mentions(promptInput.value) && !regions) {
      return region.markable() ? 'Draw the region this prompt names' : 'Remove all but one image, to draw a region';
    }
    const typed = region.withoutMarker(promptInput.value);
    if (PLACEHOLDER.test(typed)) return 'Fill in the [brackets]';
    if (regions) {
      // The prompt may name the region itself, from the template, and then a row is a
      // second way to say the same thing rather than the only way. The page writes
      // whichever the user filled, and asks for a row only when nothing else says what
      // changes.
      const named = region.mentions(promptInput.value);
      const silent = region.colours().filter(function (colour) { return !region.text(colour).trim(); });
      if (!named && silent.length) return 'Say what changes in the ' + region.name(silent[0]) + ' area';
      // The page writes a sentence around the row, so a bare phrase is a fragment:
      // "to green" would read as "to green in the orange area of <image2>". A comma
      // means the row carries its own clause, and an instruction may open with a
      // preposition: "in the corner, add a lamp" is a whole one.
      const fragment = region.colours().filter(function (colour) {
        const typed = region.text(colour).trim();
        return /^(to|for|in|with|as)\b/i.test(typed) && typed.indexOf(',') < 0;
      });
      if (fragment.length) {
        return 'Write a whole instruction for the ' + region.name(fragment[0])
          + ' area, for example: change the cloth to green';
      }
    }
    return '';
  }

  function renderRunButton() {
    if (busy()) return;
    const reason = blocker();
    go.disabled = Boolean(reason);
    goSub.textContent = reason || estimate();
  }

  // A negative prompt works only through a guidance above 1, and the spec
  // names the value it needs in `with_negative`. So when a negative prompt
  // appears, the page raises the scale to that value. When it goes, the page
  // puts the old value back, unless the scale was moved by hand in between.
  // A scale moved below 1 by hand stays there, with a note.
  let hadNegative = false;
  let raisedFrom = null;    // the scale's value before the page raised it

  // The negative the model gets: the typed one, then the avoid parts of the
  // picked Looks. Only the typed one is the user's own text.
  function typedNegative() {
    return paramSpec('negative') ? document.getElementById('negative').value.trim() : '';
  }

  function negativeText() {
    return [typedNegative(), lookAvoids()].filter(Boolean).join(', ');
  }

  function followNegative() {
    const id = scaleParam();
    const spec = id ? paramSpec(id) : null;
    const note = document.getElementById('negative-note');
    const wanted = Boolean(negativeText());
    if (!spec || spec.with_negative === null) {
      note.hidden = true;
      hadNegative = wanted;
      return;
    }
    const input = document.getElementById(id);
    if (wanted && !hadNegative && Number(input.value) < spec.with_negative) {
      raisedFrom = input.value;
      input.value = spec.with_negative;
    }
    if (!wanted && hadNegative && raisedFrom !== null && Number(input.value) === spec.with_negative) {
      input.value = raisedFrom;
    }
    if (!wanted) raisedFrom = null;
    hadNegative = wanted;
    note.hidden = !wanted;
    note.textContent = Number(input.value) > 1
      ? 'Guidance is ' + input.value + ' for the negative prompt. Each image takes about twice as long.'
      : 'A negative prompt works only with guidance above 1. Each image then takes about twice as long.';
  }

  // The field keeps the user's own text, as the prompt field does. What the
  // Look adds shows under it, so the field never looks empty while a
  // negative prompt is sent.
  function renderNegativeLook() {
    const line = document.getElementById('negative-look');
    const avoids = lookAvoids();
    line.hidden = !avoids;
    line.textContent = avoids ? 'Look adds: ' + avoids : '';
  }

  function refreshForm() {
    region.preview();
    renderNegativeLook();
    // The negative raises the scale, so it runs before the fields are mirrored
    // and the panel draws the value the run will use.
    followNegative();
    renderStrength();
    renderClearSeed();
    pushForm();
    renderRunButton();
    renderRewriteButton();
  }

  // Every field the drawn components read is mirrored into the store here, in
  // one place, so a component redraws when a field of its own changes and
  // nothing draws itself because something else happened to run first. The page
  // still reads the fields straight from the DOM for its own work; the store is
  // the components' copy. `negative` is the prompt the model will get, so a Look
  // that adds an avoid part moves it.
  function pushForm() {
    if (!formState) return;
    formState.set('mode', editing() ? 'edit' : 'generate');
    formState.set('size', sizeSelect.value);
    formState.set('resolution', resolutionSelect.value);
    formState.set('steps', document.getElementById('steps').value);
    formState.set('guidance', document.getElementById('guidance').value);
    formState.set('cfg', document.getElementById('cfg').value);
    formState.set('seed', document.getElementById('seed').value);
    formState.set('negative', negativeText());
  }

  // The references are an array the page mutates in place, so the store gets a
  // copy: the store compares by identity, and a push that does not change it
  // would leave the caption and the panel reading a stale list.
  function pushReferences() {
    if (!formState) return;
    formState.set('references', references.slice());
  }

  // The picks are an object the page mutates in place, so the store gets a copy
  // for the same reason the references do. The Look trees redraw on it.
  function pushLook() {
    if (!formState) return;
    formState.set('looks', Object.assign({}, look));
  }

  // The gallery is an array the page mutates in place too, and the strip draws
  // from the store, so it reaches the store as a copy for the same reason. The
  // shown frame and the run state travel with it: a frame's waiting card and the
  // frame in front of it are the same redraw.
  function pushGallery() {
    if (!formState) return;
    formState.set('gallery', gallery.slice());
    formState.set('view', view);
    formState.set('busy', busy());
  }

  function growPrompt() {
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.min(promptInput.scrollHeight + 2, 320) + 'px';
  }
  promptInput.addEventListener('input', growPrompt);

  // Templates come from the backend, tuned on its model.
  const PLACEHOLDER = /\[[^\]\n]+\]/;
  const templatesToggle = document.getElementById('templates-toggle');
  const templatesMenu = document.getElementById('templates');

  // The list is rebuilt on each open, because it follows the current mode. The
  // header and the hint are not items, so arrow keys and Tab skip them.
  function openTemplates() {
    templatesMenu.replaceChildren();
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = editing() ? 'Start an edit from a template' : 'Start from a template';
    templatesMenu.append(head);
    currentMode().templates.forEach(function (template) {
      // A template that names the region token needs the draw tool, so it is not
      // offered where the tool is off. With more than one reference there is no
      // print to draw on, and the run would wait for a region that cannot exist.
      if (region.mentions(template.text) && !region.markable()) return;
      const option = menus.menuItem('', template.name, function () { useTemplate(template.text); });
      const note = document.createElement('span');
      note.className = 'item-note';
      note.textContent = template.hint;
      option.querySelector('.item-text').append(note);
      templatesMenu.append(option);
    });
    const foot = document.createElement('div');
    foot.className = 'menu-foot';
    foot.textContent = 'Press Tab to jump to the next [bracket].';
    templatesMenu.append(foot);
    menus.toggleMenu(templatesMenu);
  }

  function useTemplate(text) {
    promptInput.value = text;
    growPrompt();
    refreshForm();
    promptInput.focus();
    selectPlaceholder(0);
  }

  // Selects the next [placeholder] at or after a position, so typing replaces
  // it. Returns false when none is left, and Tab then moves focus as usual.
  function selectPlaceholder(from) {
    const found = PLACEHOLDER.exec(promptInput.value.slice(from));
    if (!found) return false;
    promptInput.setSelectionRange(from + found.index, from + found.index + found[0].length);
    return true;
  }

  templatesToggle.addEventListener('click', function () {
    if (templatesMenu.hidden) openTemplates(); else menus.closeMenus();
  });
  promptInput.addEventListener('keydown', function (event) {
    if (event.key !== 'Tab' || event.shiftKey) return;
    if (selectPlaceholder(promptInput.selectionEnd)) event.preventDefault();
  });
  form.addEventListener('input', refreshForm);
  form.addEventListener('change', refreshForm);

  // The mode only changes what the form looks like. The route stays /generate,
  // which dispatches on the mode field. Swapping hx-post here does not work:
  // htmx resolves the route when it first processes the element, so a later
  // setAttribute is ignored and every edit went to the generate engine.
  // The references are cleared, because the two modes read them differently:
  // a list built for an edit would silently shrink to its first image. The
  // prompt is cleared too: a scene description is not an edit instruction.
  // ---- Look -------------------------------------------------------------------
  // Each choice adds one sentence after the prompt, at run time only, so the
  // prompt field keeps the user's own text and a pick stays one click to undo.
  // The sentence shows under the field, and the caption shows it muted. The
  // rows and their wording come from the backend, tuned on its model.
  //
  // The rows, the summary's read-back and the chips under the prompt are
  // components/look-rows.js. The picks stay here, because the run posts them
  // inside the prompt; the page mirrors them into the store, which is what
  // redraws those trees. The door below hands over the rows and the pick.
  let look = {};            // row name to the labels picked in it

  function lookRows() {
    return currentMode().looks;
  }

  function lookText() {
    return lookRows().map(function (row) {
      const picked = row.options.find(function (option) { return (look[row.name] || []).includes(option[0]); });
      return picked ? picked[1] : '';
    }).filter(Boolean).join(' ');
  }

  function lookAvoids() {
    if (!paramSpec('negative')) return '';
    return lookRows().map(function (row) {
      const picked = (row.avoids || []).find(function (avoid) { return (look[row.name] || []).includes(avoid[0]); });
      return picked ? picked[1] : '';
    }).filter(Boolean).join(', ');
  }

  function lookLabels() {
    return lookRows().flatMap(function (row) { return look[row.name] || []; });
  }

  // A pick replaces the row's pick, so a second click on the chip in force
  // takes it back off. The trees read it back through the store.
  function pickLook(row, label) {
    const had = (look[row.name] || []).includes(label);
    look[row.name] = had ? [] : [label];
    pushLook();
    refreshForm();
  }

  // A copy of the picks if this mode offers every one of them, else null.
  // Rows differ by mode, so a pick is matched by its row and label.
  function picksHere(picks) {
    const fits = Object.keys(picks).filter(function (name) { return picks[name].length; })
      .every(function (name) {
        const row = lookRows().find(function (candidate) { return candidate.name === name; });
        return row && picks[name].every(function (label) {
          return row.options.some(function (option) { return option[0] === label; });
        });
      });
    return fits ? JSON.parse(JSON.stringify(picks)) : null;
  }

  // The prompt as the model gets it: the user's text, closed as a sentence,
  // then the look.
  function withLook(prompt) {
    const added = lookText();
    if (!added) return prompt;
    return (/[.!?。！？]$/.test(prompt) ? prompt : prompt + '.') + ' ' + added;
  }

  function applyMode() {
    form.classList.toggle('mode-edit', editing());
    form.classList.toggle('mode-generate', !editing());
    promptInput.placeholder = currentMode().prompt_hint;
    document.getElementById('templates-toggle').hidden = !currentMode().templates.length;
    document.getElementById('look').hidden = !currentMode().looks.length;
    applyParams();
    // The verb on the run button follows the mode. The store carries the mode to
    // the button's labels; `refreshForm`, a few lines below in every switch,
    // mirrors it.
    hadNegative = false;
    raisedFrom = null;
  }
  form.querySelectorAll('input[name=mode]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      applyMode();
      menus.closeMenus();
      references = [];
      promptInput.value = '';
      look = {};
      pushLook();
      growPrompt();
      renderReferences();
      // The run in flight is not this form's, so its frame stays as it is.
      if (view !== 'progress') renderStage();
    });
  });

  // ---- Gallery ----------------------------------------------------------------
  // The server keeps no image after it answers. The browser keeps them, with
  // their facts, until Clear all, unless "Keep in this browser" is off: then
  // they live in this tab's memory only, and a reload clears them.
  const canvas = document.getElementById('canvas');
  const stageBar = document.getElementById('stage-bar');
  let gallery = [];
  let view = null;          // an image id, or 'progress' while a run is shown
  let arrivedId = null;     // the image to fade in once, on arrival
  let nextId = 1;
  let batchSource = null;   // the source of a one-image edit, for before and after
  let runLook = null;       // the run's own prompt, look and negative, apart from what the model got
  let runSources = [];      // per reference of the run: the frame it came from, or null for an upload

  // The strip's frames, the wipe and the ways out of the gallery belong to
  // components/image-strip.js. The gallery array stays here, because a run's
  // answer and a kept image both land in it, and the page mirrors it into the
  // store, which is what redraws the strip.
  //
  // The page asks the module nothing before its handle arrives. The module is
  // deferred and the page's startup runs first, but every question the page has
  // for the strip is about a frame, and a frame only exists once a run has
  // answered, which is long after the module is here. The one handoff that is
  // not a question is the arrival, and that waits for an arrival to carry.
  let strip = null;
  document.addEventListener('image-strip-ready', function (event) {
    strip = event.detail.configure({
      // The array is the page's to hold, so it is asked for rather than copied.
      gallery: function () { return gallery; },
      view: function () { return view; },
      setView: function (id) { view = id; },
      // The waiting frame takes its number and its shape from the run in flight.
      pending: function () { return { number: nextId, ratio: runRatio }; },
      frameNumber: frameNumber,
      fileName: fileName,
      show: show,
      // The strip's own chrome, and the stage, are the page's. The module asks
      // for their redraws and never sequences a render it does not own.
      redraw: renderStrip,
      renderStage: renderStage,
      release: release,
      forget: forget,
      notify: showToast,
      keptFields: function () { return KEPT_FIELDS; },
      keeping: function () { return keeping; },
    });
  });

  // Each image is shown by a blob URL. As a data URL, every img that showed it
  // made the browser parse megabytes of base64 text again. The base64 stays on
  // the entry for the moment the image goes back to the server as a reference.
  function blobUrl(dataUrl) {
    const comma = dataUrl.indexOf(',');
    const binary = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
    const type = dataUrl.slice(5, dataUrl.indexOf(';'));
    return URL.createObjectURL(new Blob([bytes], { type: type }));
  }

  // A batch of edits shares one source, so it is freed with the last of them.
  function release(entry) {
    URL.revokeObjectURL(entry.src);
    const shared = entry.before === batchSource || gallery.some(function (other) {
      return other.before === entry.before;
    });
    if (entry.before && !shared) URL.revokeObjectURL(entry.before);
  }

  function harvest() {
    incoming.querySelectorAll('.item').forEach(function (node) {
      const data = node.dataset;
      const source = node.querySelector('img').src;
      const entry = {
        id: nextId++, src: blobUrl(source), b64: source.split(',')[1], seed: data.seed,
        width: data.width, height: data.height, steps: data.steps, elapsed: data.elapsed,
        position: data.position, mode: data.mode, prompt: data.prompt, look: null, negative: '',
        sources: runSources,
        before: data.mode === 'edit' ? batchSource : null,
      };
      if (runLook && data.prompt === runLook.sent) {
        // The user's own words, so the card does not read back the sentence the
        // page composed around the region rows. A run that is rows only has no words
        // of its own, and there the composed sentence is the only record of what the
        // run asked for, so it stands in, written for a reader.
        entry.prompt = runLook.prompt || runLook.reader || data.prompt;
        // The user's own words, kept apart so Reuse prompt has them and not the
        // sentence the page composed. A run that is rows only has none, and an empty
        // box is the honest thing to hand back.
        entry.typed = runLook.typed || runLook.prompt;
        entry.negative = runLook.negative;
        if (runLook.labels.length) entry.look = runLook;
      }
      gallery.unshift(entry);
      keepEntry(entry);
      arrivedId = entry.id;
      if (view !== 'progress') view = entry.id;
      node.remove();
    });
    incoming.querySelectorAll(':scope > .err, :scope > .hint').forEach(function (node) {
      showToast(node.classList.contains('err') ? 'error' : 'info', node.textContent);
      node.remove();
    });
    // The last image of a batch arrives by a chain placeholder, and removing it
    // here detaches the node htmx then fires afterSettle on, so that event never
    // reaches the body. The run ends here instead, once no link is left.
    // stopWork renders, and a second render would restart the arrival fade.
    if (busy() && !incoming.querySelector('.chain')) return stopWork();
    renderStrip();
    renderStage();
  }

  // Answers arrive by several routes: the form's own request, and each chain
  // placeholder replacing itself. Watching the container catches all of them.
  new MutationObserver(function (records) {
    if (records.some(function (record) { return record.addedNodes.length; })) harvest();
  }).observe(incoming, { childList: true, subtree: true });

  function selected() {
    return gallery.find(function (entry) { return entry.id === view; });
  }

  // A frame's number, as printed on the film's edge.
  function frameNumber(id) {
    return String(id).padStart(2, '0');
  }

  // The pencil loop, the frame's own markup and which frame is shown belong to
  // components/image-strip.js, which draws them from the store. The page keeps
  // the id counter, the arrival and the shown frame, because a run's card, the
  // stage bar's edge print and the strip all read them.

  function show(id) {
    view = id;
    renderStrip();
    renderStage();
  }

  const statusText = document.getElementById('status-text');

  function renderTopPlate() {
    // The readout is for a run: it says what the engine is doing and how long it has
    // been doing it. "Ready" said nothing, so the line waits for a run and goes with it.
    const status = document.getElementById('status');
    status.hidden = !busy();
    if (!busy()) {
      statusText.textContent = '';
    } else if (!progressState) {
      statusText.textContent = 'Starting';
    }
  }

  function renderStrip() {
    const wrap = document.getElementById('strip-wrap');
    wrap.hidden = !gallery.length && !busy();
    const count = gallery.length;
    const images = count + (count === 1 ? ' image' : ' images');
    document.getElementById('strip-note').innerHTML = keeping
      ? (count ? images + ', kept in this browser.' : 'Images are kept in this browser.')
      : (count ? images + ' in this tab.<span class="wide-only"> Download the ones you want to keep.</span>'
        : 'Images stay in this tab only.');
    document.getElementById('clear-gallery').hidden = !count;
    document.getElementById('download-gallery').hidden = !count;
    // The arrival is handed over here, before the stage clears it: the strip
    // reads it while it still holds it and adds the frame's entrance once.
    if (arrivedId !== null) strip.arrived(arrivedId);
    pushGallery();
    renderProgress();
  }

  function renderStage() {
    renderTopPlate();
    // A mark belongs to the picture it was drawn on: another frame, another
    // reference, or a mode that does not take a region drops it. A run moves the
    // stage to its progress card and takes the mark with it, which is the one case
    // that is not the user's doing, so that one is dropped without a word.
    region.dropStale(busy() || view === 'progress' ? '' : 'The mark went with its picture.');
    canvas.innerHTML = '';
    stageBar.hidden = true;
    stageBar.classList.remove('reserved');
    if (view === 'progress' && busy()) {
      // The caption's room is kept through the run, so the frame does not
      // move when the plate turns into the print.
      stageBar.innerHTML = '';
      stageBar.hidden = false;
      stageBar.classList.add('reserved');
      const card = document.createElement('div');
      card.className = 'card';
      const now = progressNow();
      paintPlate(card, now.running, now.percent);
      card.innerHTML = '<div class="plate"><div class="exposure"></div><span class="percent num"></span></div>'
        + '<div class="edge"><span>' + EDGE_NAME + '</span><span>' + frameNumber(nextId) + '</span></div>';
      canvas.append(card);
      fitStage();
      renderProgress();
      return;
    }
    const entry = selected();
    if (!entry) return renderEmpty();
    const shot = document.createElement('div');
    shot.className = 'shot' + (entry.id === arrivedId ? ' arrive' : '');
    const pic = document.createElement('div');
    pic.className = 'pic';
    pic.dataset.ratio = entry.width / entry.height;
    const image = document.createElement('img');
    image.src = entry.src;
    image.alt = entry.prompt;
    pic.append(image);
    if (entry.before && strip.comparing()) strip.compare(pic, entry);
    if (region.onPrint()) region.mount(pic);
    const edge = document.createElement('div');
    edge.className = 'edge';
    edge.innerHTML = '<span>' + EDGE_NAME + '</span><span>' + frameNumber(entry.id) + '</span>';
    shot.append(pic, edge);
    if (region.onPrint()) shot.classList.add('marking');
    // A brush on the print takes the drag that the divided view's divider would
    // take, since the divider covers the whole print. The divided view goes while
    // the brush is here, and it is off the print rather than shown dead.
    canvas.append(shot);
    arrivedId = null;
    // The bar takes its height from the stage, so the shot is fitted after it.
    renderStageBar(entry);
    fitStage();
    region.sync();
  }

  // An empty stage names the next step and offers it as a button.
  function renderEmpty() {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const title = document.createElement('strong');
    const line = document.createElement('p');
    const start = document.createElement('button');
    start.type = 'button';
    start.className = 'btn';
    if (editing() && references.length) {
      title.textContent = 'Ready to edit';
      line.textContent = 'Say what to change, then press Edit.';
      empty.append(title, line);
      canvas.append(empty);
      return;
    }
    if (editing()) {
      title.textContent = 'Edit an image';
      line.textContent = 'Add the image, then say what to change.';
      start.innerHTML = icon('image-in') + 'Choose an image';
      start.addEventListener('click', function () { referenceInput.click(); });
    } else if (!currentMode().templates.length) {
      title.textContent = 'Nothing here yet';
      line.textContent = 'Write a prompt and press Generate.';
      empty.append(title, line);
      canvas.append(empty);
      return;
    } else {
      title.textContent = 'Nothing here yet';
      line.textContent = 'Write a prompt and press Generate, or start from a template.';
      start.innerHTML = icon('layout') + 'Browse templates';
      start.addEventListener('click', function (event) {
        event.stopPropagation();  // the click would reach the document and close the menu
        openTemplates();
      });
    }
    empty.append(title, line, start);
    canvas.append(empty);
  }

  // The wipe itself belongs to components/image-strip.js, which draws it and
  // owns whether it is on. The stage bar asks for the switch and places it.

  function renderStageBar(entry) {
    stageBar.hidden = false;
    stageBar.innerHTML = '';
    const about = document.createElement('div');
    about.className = 'about';
    const facts = document.createElement('div');
    facts.className = 'facts num';
    facts.append(madeBadge(entry));
    if (entry.before) facts.append(strip.toggle());
    // Two groups: which image, then how it was made. A phone puts each on its own line.
    [[entry.position === '1 image' ? '' : 'Image ' + entry.position, 'Seed ' + entry.seed],
     [entry.width + ' × ' + entry.height, entry.steps + ' steps', 'Took ' + entry.elapsed + ' s']
    ].forEach(function (group, index) {
      if (index) {
        const lineBreak = document.createElement('span');
        lineBreak.className = 'break';
        facts.append(lineBreak);
      }
      group.forEach(function (text) {
        if (!text) return;
        const fact = document.createElement('span');
        fact.textContent = text;
        facts.append(fact);
      });
    });
    // The prompt leads, as the frame's caption; the facts sit quietly under it.
    // The Look shows as the muted end of the caption, so the facts leave it out.
    const prompt = document.createElement('p');
    prompt.className = 'prompt-line';
    if (entry.look) {
      const said = document.createElement('span');
      said.className = 'look-said';
      said.textContent = entry.look.adds;
      prompt.append(entry.look.sent.slice(0, -entry.look.adds.length), said);
    } else {
      prompt.textContent = entry.prompt;
    }
    prompt.addEventListener('click', function () { toggleSheet(prompt, entry); });
    prompt.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      toggleSheet(prompt, entry);
    });
    about.append(prompt, facts);

    // Every action is page state only; nothing is sent until the next run.
    const actions = document.createElement('div');
    actions.className = 'actions';
    // Edit this and Download are the two next steps people take; the reuse
    // actions are rarer, so they wait behind More to keep the row short.
    const more = document.createElement('div');
    more.className = 'menu-anchor';
    const moreToggle = iconButton('more', 'More actions', function () { menus.toggleMenu(moreMenu); });
    moreToggle.setAttribute('aria-controls', 'more-menu');
    moreToggle.setAttribute('aria-expanded', 'false');
    const moreMenu = document.createElement('div');
    moreMenu.className = 'menu up';
    moreMenu.id = 'more-menu';
    moreMenu.setAttribute('role', 'menu');
    moreMenu.hidden = true;
    moreMenu.append(
      menus.menuItem('image-in', 'Use as reference', function () {
        referFrom(entry);
      }),
      menus.menuItem('hash', 'Reuse seed ' + entry.seed, function () {
        document.getElementById('seed').value = entry.seed;
        document.getElementById('advanced').open = true;
        refreshForm();
      }),
      menus.menuItem('text', 'Reuse prompt', function () {
        // A Look this mode cannot show comes back as text, so the prompt still says what
        // the model got. Otherwise the user's own words come back, which a region run may
        // have none of: its instruction is the rows, and handing back the composed
        // sentence would put words in the box the user never wrote. An image kept before
        // this field existed has no `typed`, so its prompt stands in.
        const picks = entry.look ? picksHere(entry.look.picks) : {};
        promptInput.value = picks
          ? (entry.typed !== undefined ? entry.typed : entry.prompt)
          : entry.look.sent;
        look = picks || {};
        pushLook();
        if (paramSpec('negative')) document.getElementById('negative').value = entry.negative;
        growPrompt();
        refreshForm();
        promptInput.focus();
      })
    );
    more.append(moreToggle, moreMenu);
    const download = document.createElement('a');
    download.className = 'icon-btn';
    download.href = entry.src;
    download.download = fileName(entry);
    download.title = 'Download';
    download.setAttribute('aria-label', 'Download');
    download.innerHTML = icon('download');
    const rule = document.createElement('span');
    rule.className = 'rule';
    actions.append(textButton('brush', 'Edit this', function () { editThis(entry); }), more,
      rule, download,
      iconButton('trash', 'Remove', function () { strip.remove(entry.id); }, 'danger'));
    if (document.fullscreenEnabled) {
      actions.append(document.fullscreenElement
        ? iconButton('shrink', 'Exit full screen (F)', toggleFullscreen)
        : iconButton('expand', 'Full screen (F)', toggleFullscreen));
    }
    if (region.onPrint()) region.tools(stageBar);
    stageBar.append(about, actions);
    captionWatch.disconnect();
    captionWatch.observe(prompt);
  }

  // A label is a toggle only while it is cut, or its sheet is open. The watch
  // marks it again when a resize cuts it or gives it room.
  const captionWatch = new ResizeObserver(function (entries) {
    entries.forEach(function (entry) { markCaption(entry.target); });
  });

  function markCaption(prompt) {
    const open = Boolean(canvas.querySelector('.sheet'));
    if (open || prompt.scrollHeight > prompt.clientHeight + 1) {
      prompt.setAttribute('role', 'button');
      prompt.tabIndex = 0;
      prompt.setAttribute('aria-expanded', String(open));
    } else {
      prompt.removeAttribute('role');
      prompt.removeAttribute('tabindex');
      prompt.removeAttribute('aria-expanded');
    }
  }

  // The typed prompt, the Look's sentence and the negative, each named, as the
  // model got them. Focus goes to Close, and back to the label after.
  // "Generated", "Edited from 01", "Generated from your image". Kept images
  // from before the sources were recorded name only the mode.
  function madeBadge(entry) {
    const badge = document.createElement('span');
    badge.className = 'made';
    badge.append(entry.mode === 'edit' ? 'Edited' : 'Generated');
    const sources = entry.sources || [];
    if (!sources.length) return badge;
    const frameIds = [...new Set(sources.filter(Boolean))];
    const uploads = sources.filter(function (source) { return !source; }).length;
    const parts = frameIds.map(function (id) {
      if (!gallery.some(function (other) { return other.id === id; })) return frameNumber(id);
      const link = document.createElement('button');
      link.type = 'button';
      link.textContent = frameNumber(id);
      link.setAttribute('aria-label', 'Show frame ' + frameNumber(id));
      link.addEventListener('click', function () { show(id); });
      return link;
    });
    if (uploads) parts.push(uploads === 1 ? 'your image' : uploads + ' of your images');
    badge.append(' from ');
    parts.forEach(function (part, index) {
      if (index) badge.append(index === parts.length - 1 ? ' and ' : ', ');
      badge.append(part);
    });
    return badge;
  }

  function toggleSheet(prompt, entry) {
    if (!prompt.hasAttribute('role')) return;
    if (canvas.querySelector('.sheet')) return closeSheet();
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.id = 'prompt-sheet';
    sheet.setAttribute('role', 'region');
    sheet.setAttribute('aria-label', 'The whole prompt');
    const list = document.createElement('dl');
    [['Prompt', entry.prompt], ['Look', entry.look ? entry.look.adds : ''], ['Negative', entry.negative]]
      .forEach(function ([term, text]) {
        if (!text) return;
        const name = document.createElement('dt');
        const value = document.createElement('dd');
        name.textContent = term;
        value.textContent = text;
        list.append(name, value);
      });
    const close = iconButton('x', 'Close', closeSheet, 'close');
    sheet.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      event.stopPropagation();
      closeSheet();
    });
    sheet.append(list, close);
    canvas.append(sheet);
    prompt.setAttribute('aria-controls', sheet.id);
    markCaption(prompt);
    close.focus();
  }

  function closeSheet() {
    const sheet = canvas.querySelector('.sheet');
    if (!sheet) return;
    sheet.remove();
    const prompt = stageBar.querySelector('.prompt-line');
    if (!prompt) return;
    markCaption(prompt);
    prompt.focus();
  }

  // The studio had no manual, so this is it: short, and about what the page does rather
  // than about what the model can do. It is the same sheet the prompt opens in, because
  // that is the shape this page already has for reading something over the print.
  const GUIDE = [
    ['Generate, or Edit', 'Generate writes a picture from a prompt. Edit changes one you already have, and needs an image from the strip: click a frame, then Edit this.'],
    ['Mark a region', "Fill the area you want changed. Do not circle it: the mark's own shape is the shape that comes back repainted."],
    ['What changes there', 'One row per marked colour says what changes in that area. Or pick the Mark a region template and leave the rows empty.'],
    ['The brush', 'Three widths, and a loupe follows the brush while you draw. The area you mark is the area that changes, so keep the mark close to what should change.'],
    ['The wait', 'An edit reads your prompt and images for about a minute before its first step. The line in the top bar counts that time.'],
    ['Run and Cancel', 'Run empties the form it sent. Cancel puts all of it back, the marked region included.'],
    ['The strip', 'Images stay in the strip. Download the ones you want before you clear it.'],
  ];

  function closeGuide() {
    const sheet = document.getElementById('guide-sheet');
    if (!sheet) return;
    sheet.remove();
    const toggle = document.getElementById('guide-toggle');
    toggle.setAttribute('aria-expanded', 'false');
    toggle.focus();
  }

  function openGuide() {
    if (document.getElementById('guide-sheet')) return closeGuide();
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.id = 'guide-sheet';
    sheet.setAttribute('role', 'region');
    sheet.setAttribute('aria-label', 'How to use this studio');
    const list = document.createElement('dl');
    GUIDE.forEach(function (pair) {
      const term = document.createElement('dt');
      const text = document.createElement('dd');
      term.textContent = pair[0];
      text.textContent = pair[1];
      list.append(term, text);
    });
    const close = iconButton('x', 'Close', closeGuide, 'close');
    sheet.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      event.stopPropagation();
      closeGuide();
    });
    sheet.append(list, close);
    canvas.append(sheet);
    document.getElementById('guide-toggle').setAttribute('aria-expanded', 'true');
    close.focus();
  }

  document.getElementById('guide-toggle').addEventListener('click', openGuide);

  // ---- Menus -----------------------------------------------------------------
  // The mechanics belong to components/popup-menu.js: one menu open at most, and
  // a pick, a click outside or Escape closes it. The page keeps what its menus
  // say and what a pick does, so this holds their sections and nothing else.
  //
  // That module is deferred and this script is not, so the manager arrives on
  // the event below. The listener is registered while the markup is parsed, and
  // the module evaluates after that, so the manager is always here before the
  // first click. The sections are built in the handler, which is the same slot
  // in the load they took before.
  let menus = null;
  document.addEventListener('popup-menus-ready', function (event) {
    menus = event.detail;
    setupBackends();
    setupKeep();
  });

  // ---- The store, and the components the form is drawn from ------------------
  // Same door, same reason: each module is deferred and this script is not, so
  // each arrives on an event of its own, and the listeners below are registered
  // while the markup is parsed. The store's own handler seeds it from the form,
  // and each component's handler hands over what the page owns and the component
  // cannot see: the option lists, the two form selects, and the derivations the
  // size field shares with the run estimate.
  //
  // The run button's labels take no handle. Their verb comes from the store's
  // `mode` and their state from an attribute the page mirrors onto them, so
  // there is nothing to pass.
  let formState = null;
  document.addEventListener('state-ready', function (event) {
    formState = event.detail;
    pushForm();
    pushReferences();
    pushLook();
    pushGallery();
  });
  document.addEventListener('size-chips-ready', function (event) {
    event.detail.configure({
      sizes: sizeOptions,
      ratios: ratios,
      resolutions: Array.from(resolutionSelect.options).map(function (option) { return option.value; }),
      setSelect: setSelect,
      sizeSelect: sizeSelect,
      resolutionSelect: resolutionSelect,
      currentOption: currentOption,
      editResolution: editResolution,
      followsReference: followsReference,
      lastReference: lastReference,
    });
  });
  document.addEventListener('advanced-panel-ready', function (event) {
    event.detail.configure({ scaleParam: scaleParam });
  });
  // The Look trees take the rows for the mode in force, the picks themselves,
  // the three derivations they share with the page, and the pick. The pick is
  // the page's because it also mirrors the picks and refreshes the form.
  document.addEventListener('look-rows-ready', function (event) {
    event.detail.configure({
      rows: lookRows,
      picks: function () { return look; },
      text: lookText,
      avoids: lookAvoids,
      labels: lookLabels,
      pick: pickLook,
    });
  });
  // The reference list takes the two things it cannot read for itself: how many
  // images the mode takes, and what a remove does. The remove is the page's,
  // because the page owns the array a run posts.
  document.addEventListener('reference-list-ready', function (event) {
    event.detail.configure({
      limit: maxReferences,
      remove: function (index) {
        references.splice(index, 1);
        renderReferences();
      },
    });
  });

  // Edit mode with this image as the only reference, an empty prompt, and the
  // image's own seed, so a rerun of the same edit gives the same result.
  // An image made in this tab carries its base64. A kept one reads it from its
  // blob only when it is used, so a long strip does not hold every image twice.
  function referFrom(entry) {
    const ready = entry.b64 ? Promise.resolve(entry.b64) : blobOf(entry.src).then(function (blob) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result.split(',')[1]); };
        reader.onerror = function () { reject(reader.error); };
        reader.readAsDataURL(blob);
      });
    });
    ready.then(function (b64) {
      addReference(b64, 'Seed ' + entry.seed, entry.id);
    }).catch(function (error) {
      showToast('error', 'The image did not load as a reference: ' + error.message);
    });
  }

  function editThis(entry) {
    const editRadio = document.getElementById('mode-edit');
    if (!editRadio.checked) {
      editRadio.checked = true;
      editRadio.dispatchEvent(new Event('change', { bubbles: true }));
    }
    references = [];
    promptInput.value = '';
    growPrompt();
    look = (entry.look && picksHere(entry.look.picks)) || {};
    pushLook();
    document.getElementById('seed').value = entry.seed;
    referFrom(entry);
    view = entry.id;
    renderStage();
    promptInput.focus();
  }

  function textButton(name, label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn quiet';
    button.innerHTML = icon(name) + label;
    button.addEventListener('click', handler);
    return button;
  }

  function iconButton(name, label, handler, extra) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon-btn' + (extra ? ' ' + extra : '');
    button.title = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = icon(name);
    button.addEventListener('click', handler);
    return button;
  }

  // The card takes the shape of the coming image, fitted inside the stage the
  // way the image itself will be.
  const REBATE_WIDTH = 20;   // the film's left and right rebate together
  const REBATE_HEIGHT = 34;  // top and bottom, the bottom holding the edge print

  function fitBox(box, ratio, share) {
    const width = Math.min((canvas.clientWidth - 48 - REBATE_WIDTH) * share,
      (canvas.clientHeight - 48 - REBATE_HEIGHT) * share * ratio);
    box.style.width = Math.round(width) + 'px';
    box.style.height = Math.round(width / ratio) + 'px';
  }

  function fitStage() {
    const plate = canvas.querySelector('.card .plate');
    if (plate) fitBox(plate, runRatio, 1);
    const pic = canvas.querySelector('.pic');
    if (pic) fitBox(pic, Number(pic.dataset.ratio), 1);
  }
  window.addEventListener('resize', fitStage);

  function fileName(entry) {
    return STUDIO.backend.id + '-' + entry.mode + '-' + entry.seed + '.png';
  }

  // Every way out of the strip is components/image-strip.js's: a removal, a
  // clear and a download all move the gallery array the page holds. The two
  // buttons stay in the page's markup, so their listeners stay here and call it.
  document.getElementById('download-gallery').addEventListener('click', function () { strip.download(); });
  document.getElementById('clear-gallery').addEventListener('click', function () { strip.clear(); });

  // ---- Kept images --------------------------------------------------------------
  // Each image and its facts go to IndexedDB, so a reload or a new tab brings
  // them back; localStorage holds about 5 MB, a few images. The store belongs to
  // this address and port. Every change goes out on a channel, so each open tab
  // shows the same strip. The server allows one run at a time, so two tabs
  // never number two new images at once.
  const KEEP_KEY = 'studio-keep';
  const KEPT_FIELDS = ['id', 'seed', 'width', 'height', 'steps', 'elapsed', 'position', 'mode', 'prompt',
    'typed', 'look', 'negative', 'sources'];
  const channel = new BroadcastChannel('studio-gallery');
  let keeping = readKeep();
  let store = null;

  function readKeep() {
    try {
      return localStorage.getItem(KEEP_KEY) !== 'off';
    } catch (error) {
      console.warn('The keep setting was not read:', error);
      return true;
    }
  }

  function openStore() {
    if (!store) {
      store = new Promise(function (resolve, reject) {
        const request = indexedDB.open('studio', 1);
        request.onupgradeneeded = function () { request.result.createObjectStore('images', { keyPath: 'id' }); };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error); };
      });
    }
    return store;
  }

  // Run one request on the images store. It settles when the transaction ends,
  // so a write has landed before any other tab hears of it.
  function inStore(access, work) {
    return openStore().then(function (database) {
      return new Promise(function (resolve, reject) {
        const transaction = database.transaction('images', access);
        const request = work(transaction.objectStore('images'));
        transaction.oncomplete = function () { resolve(request ? request.result : undefined); };
        transaction.onabort = function () { reject(transaction.error); };
      });
    });
  }

  function blobOf(url) {
    return fetch(url).then(function (response) { return response.blob(); });
  }

  function keepEntry(entry) {
    if (!keeping) return;
    Promise.all([blobOf(entry.src), entry.before ? blobOf(entry.before) : null]).then(function ([png, before]) {
      const record = { png: png, before: before };
      KEPT_FIELDS.forEach(function (field) { record[field] = entry[field]; });
      return inStore('readwrite', function (images) { return images.add(record); });
    }).then(function () {
      channel.postMessage({ kind: 'add', id: entry.id });
    }).catch(function (error) {
      showToast('error', 'The browser did not keep image ' + frameNumber(entry.id) + ': ' + error.message
        + ' It stays in this tab until a reload. Download it to keep it.');
    });
  }

  // Delete from the store, then tell the other tabs. With keeping off there is
  // nothing stored, and each tab's strip is its own.
  function forget(work, message) {
    if (!keeping) return;
    inStore('readwrite', work).then(function () {
      channel.postMessage(message);
    }).catch(function (error) {
      showToast('error', 'The browser did not remove the image: ' + error.message);
    });
  }

  // A kept image joins the strip in order, newest first, and moves the frame
  // numbers past it.
  function addKept(record) {
    if (gallery.some(function (entry) { return entry.id === record.id; })) return;
    const entry = { src: URL.createObjectURL(record.png), before: record.before && URL.createObjectURL(record.before) };
    KEPT_FIELDS.forEach(function (field) { entry[field] = record[field]; });
    const later = gallery.findIndex(function (other) { return other.id < entry.id; });
    gallery.splice(later < 0 ? gallery.length : later, 0, entry);
    nextId = Math.max(nextId, entry.id + 1);
  }

  // With nothing on the stage, the newest image takes it.
  function showNewest() {
    if (view === null && gallery.length) view = gallery[0].id;
    renderStrip();
    renderStage();
  }

  function loadKept() {
    if (!keeping) return;
    inStore('readonly', function (images) { return images.getAll(); }).then(function (records) {
      records.forEach(addKept);
      showNewest();
    }).catch(function (error) {
      showToast('error', 'The kept images did not load: ' + error.message);
    });
  }

  channel.addEventListener('message', function (event) {
    const message = event.data;
    if (message.kind === 'remove') strip.drop(message.id);
    if (message.kind === 'clear') strip.dropAll();
    if (message.kind === 'keep') {
      keeping = message.on;
      markKeep();
      renderStrip();
    }
    if (message.kind !== 'add' || !keeping) return;
    inStore('readonly', function (images) { return images.get(message.id); }).then(function (record) {
      if (!record) return;
      addKept(record);
      showNewest();
    }).catch(function (error) {
      showToast('error', 'An image from another tab did not load: ' + error.message);
    });
  });

  // Off empties the store at once; the images stay in the open tabs until a
  // reload. On keeps what this tab shows now, oldest first.
  function setKeep(on) {
    if (!on && gallery.length
      && !confirm('Stop keeping images? The kept images leave this browser. Open tabs show them until a reload.')) {
      return;
    }
    keeping = on;
    try {
      localStorage.setItem(KEEP_KEY, on ? 'on' : 'off');
    } catch (error) {
      showToast('error', 'The keep setting applies to this tab only: ' + error.message);
    }
    channel.postMessage({ kind: 'keep', on: on });
    markKeep();
    renderStrip();
    if (!on) {
      inStore('readwrite', function (images) { images.clear(); }).catch(function (error) {
        showToast('error', 'The kept images were not removed: ' + error.message);
      });
      return;
    }
    gallery.slice().reverse().forEach(keepEntry);
  }

  function markKeep() {
    const item = document.getElementById('keep-toggle');
    if (item) item.setAttribute('aria-checked', String(keeping));
  }

  // ---- Toasts -----------------------------------------------------------------
  // Errors stay until closed, because they say what to fix. Anything else
  // clears itself.
  const toasts = document.getElementById('toasts');
  function showToast(kind, text) {
    const toast = document.createElement('div');
    toast.className = 'toast ' + kind;
    toast.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    const message = document.createElement('p');
    message.textContent = text;
    toast.innerHTML = icon(kind === 'error' ? 'alert' : 'info');
    toast.append(message, iconButton('x', 'Dismiss', function () { toast.remove(); }));
    toasts.append(toast);
    if (kind !== 'error') setTimeout(function () { toast.remove(); }, 4000);
  }

  // ---- Run, progress, cancel --------------------------------------------------
  // The poller clocks itself off its own response, and stops when the server
  // says nothing is running. That gap happens between two images of a batch, so
  // every request the page sends plants a fresh poller.
  const POLLER = '<div hx-get="/progress" hx-trigger="load"'
    + ' hx-target="#progress" hx-swap="innerHTML"></div>';
  let progressState = null;
  let pace = null;          // how fast this run's steps arrive, for the time left

  let runStartedAt = 0;

  // While a run goes, the run button is Cancel. A click in the first half
  // second is the second half of a double click on Generate, so it waits.
  // Enter in a text field also clicks this button (an implicit submit), with
  // no click count and the focus left in the field; that is not a cancel.
  go.addEventListener('click', function (event) {
    if (!busy()) return;
    event.preventDefault();
    const implicit = event.detail === 0 && document.activeElement !== go;
    if (implicit || Date.now() - runStartedAt < 500) return;
    requestCancel();
  });

  // ---- Emptying the form on Run, and putting it back on Cancel ---------------
  // A run takes everything the form holds, so pressing Run empties the form and
  // the next run starts from a blank one. One copy of what was there is kept, and
  // Cancel puts it back: a run the user stops should leave the studio as it found
  // it, prompt, images, region and settings included.
  let cleared = null;          // what Run emptied, kept for Cancel
  let cancelRestore = null;    // the copy Cancel asked for, applied once the run ends

  function snapshotInputs() {
    const params = {};
    currentMode().params.forEach(function (param) {
      const node = document.getElementById(param.id);
      if (node) params[param.id] = node.value;
    });
    return {
      view: view,
      prompt: promptInput.value,
      negative: document.getElementById('negative').value,
      seed: document.getElementById('seed').value,
      count: countInput.value,
      params: params,
      look: JSON.parse(JSON.stringify(look)),
      references: references.slice(),
      region: region.snapshot(),
    };
  }

  // The defaults come from the mode, through the same call a mode switch makes,
  // rather than from a value named here that could drift away from the backend.
  function clearInputs() {
    promptInput.value = '';
    document.getElementById('negative').value = '';
    document.getElementById('seed').value = '';
    countInput.value = '1';
    look = {};
    region.clearText();
    references = [];
    region.putDown();
    currentMode().params.forEach(function (param) {
      const node = document.getElementById(param.id);
      if (node) delete node.dataset.applied;
    });
    applyParams();
    clampCount();
    growPrompt();
    pushLook();
    renderReferences();
    refreshForm();
  }

  function restoreInputs(snapshot) {
    if (!snapshot) return;
    // The stage the region was drawn on comes back first: a mark only survives on
    // the frame it was drawn on, so the frame has to be there before the strokes.
    view = snapshot.view;
    promptInput.value = snapshot.prompt;
    document.getElementById('negative').value = snapshot.negative;
    document.getElementById('seed').value = snapshot.seed;
    countInput.value = snapshot.count;
    look = snapshot.look;
    // The rows read their text from here, so it goes back before they are built.
    region.setText(snapshot.region.text);
    references = snapshot.references.slice();
    region.putDown();
    applyParams();  // this marks every input as applied, so the values below stick
    Object.keys(snapshot.params).forEach(function (id) {
      const node = document.getElementById(id);
      if (node) node.value = snapshot.params[id];
    });
    clampCount();
    growPrompt();
    pushLook();
    references.forEach(probeSize);
    // This arms the brush again, because a mark belongs to one reference on the
    // stage. Its stroke list starts empty, so the strokes go back after it.
    renderReferences();
    region.setStrokes(snapshot.region.strokes);
    renderStrip();
    renderStage();
    refreshForm();
  }

  function startWork(element) {
    const fresh = element === form;
    document.body.classList.add('busy');
    syncRunState();
    go.disabled = false;
    goSub.textContent = '';
    countToggle.disabled = true;
    progressSlot.innerHTML = POLLER;
    htmx.process(progressSlot);
    if (fresh) {
      runStartedAt = Date.now();
      runKey = costKey();
      runPixels = targetPixels();
      runEstimate = currentMode().estimate;
      runRatio = targetRatio();
      runStepSeconds = stepSeconds();
      view = 'progress';
      progressState = null;
      pace = null;
      renderStrip();
      renderStage();
    }
  }

  // The tab title shows the progress, so a run can be watched from another tab.
  // A run that ends in the background leaves "Done" until the tab is seen.
  const BASE_TITLE = document.title;
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !busy()) document.title = BASE_TITLE;
  });

  function stopWork() {
    if (!busy()) return;
    document.title = (document.hidden ? '(Done) ' : '') + BASE_TITLE;
    document.body.classList.remove('busy', 'stopping');
    syncRunState();
    progressSlot.innerHTML = '';
    progressState = null;
    countToggle.disabled = false;
    if (view === 'progress') view = gallery.length ? gallery[0].id : null;
    renderStrip();
    renderStage();
    renderRunButton();
    // A cancelled run puts back what Run emptied, after the stage has settled.
    if (cancelRestore) {
      const snapshot = cancelRestore;
      cancelRestore = null;
      restoreInputs(snapshot);
    }
  }

  function requestCancel() {
    if (document.body.classList.contains('stopping')) return;
    document.body.classList.add('stopping');
    syncRunState();
    go.disabled = true;
    renderProgress();
    htmx.ajax('POST', '/cancel', { swap: 'none' });
    // The form comes back once the run has really stopped, not now: the progress
    // card lives on the stage, and moving the stage mid-run would take it away
    // from the poller that is still streaming into it.
    cancelRestore = cleared;
    cleared = null;
  }

  // ---- Full screen ------------------------------------------------------------
  // The stage and the sheet fill the screen. F toggles it, and Escape leaves by
  // the browser's own rule. The arrow keys walk the sheet in and out of it.
  const work = document.querySelector('.work');

  function toggleFullscreen() {
    const change = document.fullscreenElement ? document.exitFullscreen() : work.requestFullscreen();
    change.catch(function (error) { showToast('error', 'Full screen failed: ' + error.message); });
  }
  document.addEventListener('fullscreenchange', renderStage);

  // The arrow keys walk the strip, which is the strip's own move: the module
  // keeps the shown frame's box across its own redraw, so the correction lives
  // where the redraw does. The key is the page's, because full screen shares it.
  document.addEventListener('keydown', function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (document.querySelector('.menu:not([hidden])')) return;
    if (event.key === 'f' && document.fullscreenEnabled && (gallery.length || busy())) {
      event.preventDefault();
