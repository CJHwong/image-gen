      toggleFullscreen();
    }
    if (event.key === 'ArrowRight') strip.step(1);
    if (event.key === 'ArrowLeft') strip.step(-1);
  });

  // Cmd+Enter (Ctrl+Enter off a Mac) runs from anywhere on the page. It obeys
  // the same rule as a click: nothing happens while the button is disabled.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || !(event.metaKey || event.ctrlKey)) return;
    event.preventDefault();
    if (!go.disabled && !busy()) form.requestSubmit(go);
  });

  new MutationObserver(function () {
    const node = progressSlot.querySelector('.progress-state');
    progressState = node ? {
      stage: node.dataset.stage, step: Number(node.dataset.step), total: Number(node.dataset.total),
      label: node.dataset.label, stopping: node.dataset.stopping === '1',
    } : null;
    trackPace();
    renderProgress();
  }).observe(progressSlot, { childList: true, subtree: true });

  // Time left comes from when steps arrive, never from the clock between them:
  // dividing by "now" made the number climb during every step and drop at the
  // next. The rate carries across the images of a batch. Until two steps have
  // arrived, the pre-run guess stands in. An image also needs time after its
  // last step, to decode and reach the page. That tail is measured on each
  // finished image; before the first, the backend's overhead stands in.
  function trackPace() {
    const state = progressState;
    if (!state) return;
    const now = Date.now();
    if (!pace) pace = { label: null, stepTime: 0, stepsTimed: 0, tail: null };
    if (state.label !== pace.label) {
      if (pace.label !== null && pace.lastStepAt) pace.tail = (now - pace.lastStepAt) / 1000;
      pace.label = state.label;
      pace.lastStep = 0;
      pace.lastStepAt = 0;
    }
    if (state.stage !== 'running' || state.step <= pace.lastStep) return;
    if (pace.lastStepAt) {
      pace.stepTime += (now - pace.lastStepAt) / 1000;
      pace.stepsTimed += state.step - pace.lastStep;
    }
    pace.lastStep = state.step;
    pace.lastStepAt = now;
    if (pace.stepsTimed >= 2 && runEstimate) {
      learnedCost[runKey] = paceRate() / Math.pow(runPixels / 1e6, runEstimate.exponent);
    }
  }

  function paceRate() {
    return pace && pace.stepsTimed >= 2 ? pace.stepTime / pace.stepsTimed : runStepSeconds;
  }

  function timeLeft() {
    const state = progressState;
    const perStep = paceRate();
    if (!state || !perStep) return '';
    const tail = pace && pace.tail !== null ? pace.tail : (runEstimate ? runEstimate.overhead : 0);
    const batch = (state.label || '').match(/(\d+) of (\d+)/);
    const imagesAfter = batch ? Number(batch[2]) - Number(batch[1]) : 0;
    const step = state.stage === 'running' ? state.step : 0;
    const sinceStep = pace && pace.lastStepAt ? (Date.now() - pace.lastStepAt) / 1000 : 0;
    const thisImage = Math.max(0, perStep * (state.total - step) + tail - sinceStep);
    const seconds = thisImage + imagesAfter * (perStep * state.total + tail);
    return seconds < 3 ? 'Almost done' : 'About ' + spell(seconds) + ' left';
  }

  function progressNow() {
    const state = progressState;
    const running = Boolean(state && state.stage === 'running' && state.total);
    return { running: running, percent: running ? Math.round(state.step / state.total * 100) : 0 };
  }

  // Exposure only grows with a sweep. A drop, at the next image of a batch or a
  // new run, jumps back to the left edge at once.
  function paintPlate(plate, running, percent) {
    const rewind = percent < (parseFloat(plate.style.getPropertyValue('--exposed')) || 0);
    plate.classList.toggle('rewind', rewind);
    plate.classList.toggle('waiting', !running);
    plate.style.setProperty('--exposed', percent + '%');
    if (!rewind) return;
    void plate.offsetWidth;   // apply the drop while the sweep is off
    plate.classList.remove('rewind');
  }

  function renderProgress() {
    if (!busy()) return;
    const state = progressState;
    const stopping = document.body.classList.contains('stopping') || (state && state.stopping);
    const now = progressNow();
    const running = now.running;
    let stepText = 'Starting';
    // Before step 0 the backend sets up its model: a rebuild, a switch between
    // generate and edit, or the edit engine's first load. Step 0 is its notice
    // that the engine started, which first encodes the prompt and images. The
    // engine may then run fewer steps (a starting image skips part of the
    // schedule), so the count shows from the first real step.
    if (state && state.stage === 'preparing') stepText = 'Loading the model';
    if (running && state.stage === 'running' && state.step === 0) {
      stepText = runSources.length ? 'Reading the prompt and images' : 'Reading the prompt';
    }
    if (running && state.step > 0) stepText = 'Step ' + state.step + ' of ' + state.total;
    if (stopping) {
      // An engine inside this process can only stop where it looks, which is a step, and
      // before the first step there is nothing to look at. So the label says when, not
      // that it has happened. A child engine is killed outright and this flashes past.
      stepText = state && state.step > 0
        ? 'Stopping at the end of this step' : 'Stopping when the first step arrives';
    }

    // Before the first step the estimate is the only number the page has, and it does
    // not move: the same sentence, redrawn every second, is what a frozen run looks
    // like. The elapsed time does move, so the reading phase says how long it has been
    // reading and a slow engine is visibly still working.
    const reading = running && state && state.step === 0;
    const soFar = runStartedAt ? spell(Math.max(0, (Date.now() - runStartedAt) / 1000)) + ' so far' : '';
    const left = running && !stopping ? (reading ? soFar : timeLeft()) : '';
    // While stopping, the phase text says when the stop lands. It used to be a bare
    // "Stopping", and the sentence built for this case was written and never shown.
    statusText.textContent = stopping ? stepText : running
      ? [stepText, state.label ? 'image ' + state.label : '',
        left.charAt(0).toLowerCase() + left.slice(1)].filter(Boolean).join(', ')
      : stepText;
    document.title = (running ? '(' + now.percent + '%) ' : '') + BASE_TITLE;
    document.querySelectorAll('.card, .frame.pending .still').forEach(function (plate) {
      paintPlate(plate, running, now.percent);
      const percent = plate.querySelector('.percent');
      if (percent) percent.textContent = running ? now.percent + '%' : '';
    });
  }

  function sideChannel(event) {
    const config = event.detail.requestConfig || event.detail.pathInfo || {};
    const path = config.path || config.requestPath || '';
    return path === '/progress' || path === '/cancel';
  }

  // The references are an array, not a form field, so they are attached here.
  // Only the form itself carries them: a chain request already has a token.
  document.body.addEventListener('htmx:configRequest', function (event) {
    if (event.detail.elt !== form) return;
    // Only a one-image edit changes that image in place. An edit from several
    // images composes them, so no single source lines up with the result and
    // a wipe between them would mislead.
    batchSource = editing() && references.length === 1
      ? blobUrl('data:image/png;base64,' + references[0].b64) : null;
    runSources = references.map(function (reference) { return reference.source; });
    const own = promptInput.value.trim();
    runLook = {
      prompt: own, typed: rewrittenFrom || own, sent: withLook(own), adds: lookText(), labels: lookLabels(),
      picks: JSON.parse(JSON.stringify(look)), negative: typedNegative(),
    };
    event.detail.parameters.prompt = runLook.sent;
    if (paramSpec('negative')) event.detail.parameters.negative = negativeText();
    // A marked region rides as the last image, and the prompt names that image,
    // so the model is told which one carries the mask.
    const mask = region.mask();
    if (mask) {
      // Measured 2026-09-26: one clause per region, each naming the colour the mask
      // carries, then one line pinning the rest of the picture.
      event.detail.parameters.prompt = region.composed();
      // The card's copy, taken while the rows are still here to read.
      runLook.reader = region.composed(true);
    }
    // `sent` is what the model got, so it is recorded after every override. A
    // masked run sends the composed sentence, and the match in harvest() looked
    // for the pre-composition prompt, so the card lost the user's own words.
    runLook.sent = event.detail.parameters.prompt;
    event.detail.parameters.references = JSON.stringify(references.map(function (r) {
      return r.b64;
    }).concat(mask ? [mask.split(',')[1]] : []));
  });
  document.body.addEventListener('htmx:beforeRequest', function (event) {
    if (sideChannel(event)) return;
    const fresh = event.detail.elt === form;
    if (fresh) {
      toasts.innerHTML = '';
      // The copy comes first: startWork moves the stage to the progress card, and
      // the frame the region was drawn on is part of what Cancel has to put back.
      cleared = snapshotInputs();
    }
    startWork(event.detail.elt);
    // The form empties after startWork, which reads it for the run's cost, shape
    // and step time. A chain request carries its own token and never reads the
    // form, so only the form's own request clears.
    if (fresh) clearInputs();
  });
  document.body.addEventListener('htmx:afterSettle', function (event) {
    // A /progress response settles once a second. It is not the end of the run,
    // and treating it as one used to clear the busy state mid-generation.
    if (sideChannel(event)) return;
    if (!document.querySelector('.chain')) stopWork();
  });
  document.body.addEventListener('htmx:responseError', stopWork);
  document.body.addEventListener('htmx:sendError', function () {
    stopWork();
    showToast('error', 'The server did not answer. Check that the studio server is still running.');
  });

  // A run, or images kept only in this tab, would be lost to a reload or a close.
  // Browsers show their own fixed text here; the page cannot set it.
  window.addEventListener('beforeunload', function (event) {
    if (!busy() && (keeping || !gallery.length)) return;
    event.preventDefault();
    event.returnValue = '';
  });

  // A mode the backend lacks stays in view, disabled, so the page keeps its shape.
  function setupModes() {
    form.querySelectorAll('input[name=mode]').forEach(function (radio) {
      const spec = MODES[radio.value];
      const label = form.querySelector('label[for=' + radio.id + ']');
      radio.disabled = !spec;
      if (spec) label.lastChild.textContent = spec.label;
      else label.title = STUDIO.backend.name + ' has no ' + label.textContent.trim().toLowerCase() + ' mode';
    });
    const first = form.querySelector('input[name=mode]:not(:disabled)');
    if (form.querySelector('input[name=mode]:checked').disabled) first.checked = true;
  }

  // The title is the switch, and only when there is a choice. A switch frees
  // the old backend and loads the new one, then the page reloads with its
  // capabilities.
  function setupBackends() {
    const toggle = document.getElementById('backend-toggle');
    const menu = document.getElementById('backend-menu');
    if (STUDIO.backends.length < 2) return;
    toggle.disabled = false;
    toggle.title = 'Switch the model';
    toggle.addEventListener('click', function () { menus.toggleMenu(menu); });
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = 'Model';
    menu.append(head);
    STUDIO.backends.forEach(function ([id, name]) {
      const item = menus.menuItem('check', name, function () { switchBackend(id, name); });
      item.setAttribute('role', 'menuitemradio');
      item.setAttribute('aria-checked', String(id === STUDIO.backend.id));
      menu.append(item);
    });
  }

  function switchBackend(id, name) {
    const toggle = document.getElementById('backend-toggle');
    if (id === STUDIO.backend.id) return;
    if (busy()) return showToast('info', 'Wait for the run to finish, then switch.');
    if (gallery.length && !confirm('Switching the model reloads the page and clears the gallery.')) return;
    toggle.disabled = true;
    showToast('info', 'Loading ' + name + '. This can take a minute.');
    fetch('/backend', { method: 'POST', body: new URLSearchParams({ backend: id }) })
      .then(function (answer) { return answer.text(); })
      .then(function (text) {
        if (!text) { gallery.length = 0; location.reload(); return; }
        toggle.disabled = false;
        showToast('error', new DOMParser().parseFromString(text, 'text/html').body.textContent);
      })
      .catch(function (error) {
        toggle.disabled = false;
        showToast('error', 'The switch failed: ' + error.message);
      });
  }

  // The Images section of the theme menu. The Theme section above it belongs to
  // lib/theme.js, which draws it once this script has built the menu.
  function setupKeep() {
    const menu = document.getElementById('theme-menu');
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = 'Images';
    const keep = menus.menuItem('check', 'Keep in this browser', function () { setKeep(!keeping); });
    keep.setAttribute('role', 'menuitemcheckbox');
    keep.id = 'keep-toggle';
    menu.append(head, keep);
    markKeep();
  }

  setupModes();
  // The menus, the size controls, the advanced readouts and the run button's
  // labels are drawn by their own modules, on the doors above.
  // Whether a rewrite is in flight. Declared up here, above the first call into
  // refreshForm: the form draws itself during startup and renderRewriteButton
  // reads this as it draws, so a declaration further down is in its dead zone.
  let rewriting = false;

  // The text you typed before a rewrite replaced the box. Held apart so the card
  // keeps your own words, which the rewritten paragraph otherwise overwrites.
  let rewrittenFrom = null;

  applyMode();
  pushLook();
  renderReferences();
  renderStrip();
  renderStage();
  // Rewrite the prompt into a longer instruction.
  //
  // The rewriter is a second model in the backend and it costs about 30s, so it
  // is a button rather than something a run does on its own: the rewritten text
  // lands in the box, where it can be read and edited before any image time is
  // spent. It is offered only where the backend declares a rewriter for the mode
  // on screen, and it sends the prompt WITH the Look sentences, because the Look
  // is part of what the user asked for and the rewriter's job is to write all of
  // it out at length.
  //
  // A toggle that rewrote each run was tried first. It cannot be built this way:
  // htmx handles the submit from a listener of its own, and a listener added
  // later never gets to hold the request.
  function rewriteOffered() {
    return (STUDIO.rewrite_modes || []).indexOf(currentMode().id) >= 0;
  }

  // A run and a rewrite both hold the panel still: the inputs carry the values the
  // job is using, so changing one mid-flight would leave the card disagreeing with
  // what was actually sent. Each locked control says which job holds it. The locks
  // nest, because a rewrite can finish while a run is starting.
  //
  // The Run button is never locked: during a run it is Cancel, and locking it would
  // trap the user with no way out.
  const holds = new Set();
  let held = [];

  function holdPanel(reason, on) {
    if (on) holds.add(reason);
    else holds.delete(reason);
    if (holds.size && !held.length) applyHold();
    else if (!holds.size && held.length) releaseHold();
  }

  // `disabled` is the obvious way to hold a field and it is the wrong one: the
  // browser leaves a disabled field out of the form it submits, so a panel locked
  // that way once arrived at the server with no prompt, no mode and no size.
  // `readonly` keeps the value in the request, and a pointer-events block covers
  // the controls readonly cannot reach, which is the selects and the buttons.
  function applyHold() {
    const reason = Array.from(holds).join(' ');
    held = [];
    form.querySelectorAll('input, textarea, select, button').forEach(function (control) {
      // The Run button is Cancel while a run is going, so holding it would trap
      // the user with no way out.
      if (control.id === 'go') return;
      const text = control.tagName === 'TEXTAREA' || (control.tagName === 'INPUT' && control.type === 'text');
      if (text) {
        if (control.readOnly) return;
        control.readOnly = true;
        held.push([control, 'readOnly']);
      } else {
        control.style.pointerEvents = 'none';
        held.push([control, 'pointer']);
      }
      control.dataset.heldTitle = control.getAttribute('title') || '';
      control.title = reason;
    });
  }

  function releaseHold() {
    held.forEach(function (entry) {
      const control = entry[0];
      if (entry[1] === 'readOnly') control.readOnly = false;
      else control.style.pointerEvents = '';
      if (control.dataset.heldTitle) control.title = control.dataset.heldTitle;
      else control.removeAttribute('title');
      delete control.dataset.heldTitle;
    });
    held = [];
    // The page's own rules decide which controls stay disabled, so they are asked
    // again rather than trusting the state this put back.
    refreshForm();
  }

  // Watching the class the page already sets for a run keeps this out of the run's
  // own start and stop paths, which are easy to get wrong.
  new MutationObserver(function () {
    holdPanel('Locked while the image is being made.', busy());
  }).observe(document.body, { attributes: true, attributeFilter: ['class'] });

  function renderRewriteButton() {
    const button = document.getElementById('rewrite-toggle');
    if (!button) return;
    button.hidden = !rewriteOffered();
    const empty = !promptInput.value.trim();
    button.disabled = rewriting || busy() || empty;
    button.title = rewriting
      ? 'Locked while the prompt is being rewritten.'
      : empty
        ? 'Write a prompt to rewrite first. A marked run takes its instruction in the region rows.'
        : 'Rewrite the prompt into a longer instruction before generating';
    // The readout belongs to a run while one is going, so a rewrite only borrows
    // it when nothing else is. Without this a press looks like nothing happened
    // for half a minute, and the button stays live for a second press.
    if (busy()) return;
    const status = document.getElementById('status');
    status.hidden = !rewriting;
    if (rewriting) statusText.textContent = 'Rewriting the prompt, about 30s';
  }

  async function rewritePrompt() {
    const typed = promptInput.value.trim();
    const body = new URLSearchParams();
    body.set('mode', currentMode().id);
    body.set('prompt', withLook(promptInput.value));
    // The pictures the run carries, and not the mask: the mask is a technical
    // picture, and the rewriter is asked about the scene.
    body.set('references', JSON.stringify(references.map(function (reference) { return reference.b64; })));
    const answer = await fetch('/rewrite', { method: 'POST', body: body });
    const text = await answer.text();
    let result;
    try {
      result = JSON.parse(text);
    } catch (error) {
      throw new Error(text || answer.statusText);
    }
    if (result.error) throw new Error(result.error);
    rewrittenFrom = typed;
    promptInput.value = result.prompt;
    growPrompt();
    // A shape the rewriter suggested is applied, so the run renders what it
    // described. It arrives as one of this mode's own sizes, or as nothing.
    if (result.size) setSelect(sizeSelect, result.size);
    refreshForm();
    return result;
  }

  document.getElementById('rewrite-toggle').addEventListener('click', function () {
    if (rewriting || busy() || !promptInput.value.trim()) return;
    rewriting = true;
    holdPanel('Locked while the prompt is being rewritten.', true);
    renderRewriteButton();
    rewritePrompt()
      .catch(function (error) { showToast('error', 'The rewrite failed: ' + error.message); })
      .then(function () {
        rewriting = false;
        holdPanel('Locked while the prompt is being rewritten.', false);
        renderRewriteButton();
      });
  });

  // The prompt box carries an instruction the button depends on, so its state is
  // refreshed as it is typed. refreshForm already runs on input for other reasons.
  promptInput.addEventListener('input', function () {
    rewrittenFrom = null;   // typing again is your own words, not the rewrite's
    renderRewriteButton();
  });

  renderRewriteButton();

  loadKept();
</script>
</body>
</html>
