    const rowTop = function () {
      const toggle = document.querySelector('.look-row-toggle[data-row="' + CSS.escape(row.name) + '"]');
      return toggle.getBoundingClientRect().top;
    };
    const before = rowTop();
    pickLook(row, label);
    const target = controls.scrollTop + rowTop() - before;
    // The sidebar fills the window, so its content can end well above its
    // foot. The slack makes the content reach target + the visible height.
    const box = controls.getBoundingClientRect();
    const contentEnd = Math.max.apply(null, Array.from(controls.children).map(function (child) {
      return child.getBoundingClientRect().bottom;
    })) - box.top + controls.scrollTop + 28;
    controls.style.setProperty('--slack', Math.max(0, target + controls.clientHeight - contentEnd) + 'px');
    controls.scrollTop = target;
  }

  // One line per row, with the row's pick. A row shows its options only
  // while it is open, and one row is open at a time.
  function renderLook() {
    const rows = document.getElementById('look-rows');
    rows.replaceChildren();
    lookRows().forEach(function (row) {
      const line = document.createElement('div');
      line.className = 'look-row';
      const picked = (look[row.name] || [])[0];
      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'look-row-toggle';
      toggle.dataset.row = row.name;
      toggle.setAttribute('aria-expanded', String(openLookRow === row.name));
      const name = document.createElement('span');
      name.className = 'label';
      name.textContent = row.name;
      const pick = document.createElement('span');
      pick.className = 'look-pick' + (picked ? ' picked' : '');
      pick.textContent = picked || 'none';
      toggle.append(name, pick);
      toggle.addEventListener('click', function () {
        openLookRow = openLookRow === row.name ? null : row.name;
        renderLook();
      });
      const chips = document.createElement('div');
      chips.className = 'look-chips';
      chips.hidden = openLookRow !== row.name;
      row.options.forEach(function ([label]) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = label;
        chip.setAttribute('aria-pressed', String((look[row.name] || []).includes(label)));
        chip.addEventListener('click', function () { pickLookInPlace(row, label); });
        chips.append(chip);
      });
      line.append(toggle, chips);
      rows.append(line);
    });
    const labels = lookLabels();
    document.getElementById('look-values').textContent = labels.length ? labels.join(', ') : 'none';
    renderLookTail();
  }

  // Under the prompt: one chip per pick, which unpicks it, then the sentence
  // the run adds.
  function renderLookTail() {
    const tail = document.getElementById('look-adds');
    const added = lookText();
    tail.hidden = !added;
    tail.replaceChildren();
    if (!added) return;
    lookRows().forEach(function (row) {
      (look[row.name] || []).forEach(function (label) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = label + ' \u00d7';
        chip.setAttribute('aria-label', 'Remove ' + label);
        chip.addEventListener('click', function () { pickLook(row, label); });
        tail.append(chip);
      });
    });
    const quote = document.createElement('q');
    quote.textContent = added;
    tail.append(quote);
    const avoids = lookAvoids();
    if (!avoids) return;
    const note = document.createElement('p');
    note.className = 'look-avoids';
    note.textContent = 'Negative prompt adds: ' + avoids + '. Each image takes about twice as long.';
    tail.append(note);
  }

  // A copy of the picks if this mode offers every one of them, else null.
  // Rows differ by mode, so a pick is matched by its row and label.
  function picksHere(picks) {
    const fits = Object.keys(picks).filter(function (name) { return picks[name].length; })
      .every(function (name) {
        const row = lookRows().find(function (candidate) { return candidate.name === name; });
        return row && picks[name].every(function (label) {
          return row.options.some(function (option) { return option[0] === label; });
        });
      });
    return fits ? JSON.parse(JSON.stringify(picks)) : null;
  }

  // The prompt as the model gets it: the user's text, closed as a sentence,
  // then the look.
  function withLook(prompt) {
    const added = lookText();
    if (!added) return prompt;
    return (/[.!?。！？]$/.test(prompt) ? prompt : prompt + '.') + ' ' + added;
  }

  function applyMode() {
    form.classList.toggle('mode-edit', editing());
    form.classList.toggle('mode-generate', !editing());
    promptInput.placeholder = currentMode().prompt_hint;
    document.getElementById('templates-toggle').hidden = !currentMode().templates.length;
    document.getElementById('look').hidden = !currentMode().looks.length;
    applyParams();
    hadNegative = false;
    raisedFrom = null;
  }
  form.querySelectorAll('input[name=mode]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      applyMode();
      closeMenus();
      references = [];
      promptInput.value = '';
      look = {};
      openLookRow = null;
      renderLook();
      growPrompt();
      renderReferences();
      // The run in flight is not this form's, so its frame stays as it is.
      if (view !== 'progress') renderStage();
    });
  });

  // ---- Gallery ----------------------------------------------------------------
  // The server keeps no image after it answers. The browser keeps them, with
  // their facts, until Clear all, unless "Keep in this browser" is off: then
  // they live in this tab's memory only, and a reload clears them.
  const canvas = document.getElementById('canvas');
  const stageBar = document.getElementById('stage-bar');
  const strip = document.getElementById('strip');
  let gallery = [];
  let view = null;          // an image id, or 'progress' while a run is shown
  let arrivedId = null;     // the image to fade in once, on arrival
  let nextId = 1;
  let batchSource = null;   // the source of a one-image edit, for before and after
  let runLook = null;       // the run's own prompt, look and negative, apart from what the model got
  let runSources = [];      // per reference of the run: the frame it came from, or null for an upload

  // Each image is shown by a blob URL. As a data URL, every img that showed it
  // made the browser parse megabytes of base64 text again. The base64 stays on
  // the entry for the moment the image goes back to the server as a reference.
  function blobUrl(dataUrl) {
    const comma = dataUrl.indexOf(',');
    const binary = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
    const type = dataUrl.slice(5, dataUrl.indexOf(';'));
    return URL.createObjectURL(new Blob([bytes], { type: type }));
  }

  // A batch of edits shares one source, so it is freed with the last of them.
  function release(entry) {
    URL.revokeObjectURL(entry.src);
    const shared = entry.before === batchSource || gallery.some(function (other) {
      return other.before === entry.before;
    });
    if (entry.before && !shared) URL.revokeObjectURL(entry.before);
  }

  function harvest() {
    incoming.querySelectorAll('.item').forEach(function (node) {
      const data = node.dataset;
      const source = node.querySelector('img').src;
      const entry = {
        id: nextId++, src: blobUrl(source), b64: source.split(',')[1], seed: data.seed,
        width: data.width, height: data.height, steps: data.steps, elapsed: data.elapsed,
        position: data.position, mode: data.mode, prompt: data.prompt, look: null, negative: '',
        sources: runSources,
        before: data.mode === 'edit' ? batchSource : null,
      };
      if (runLook && data.prompt === runLook.sent) {
        entry.prompt = runLook.prompt;
        entry.negative = runLook.negative;
        if (runLook.labels.length) entry.look = runLook;
      }
      gallery.unshift(entry);
      keepEntry(entry);
      arrivedId = entry.id;
      if (view !== 'progress') view = entry.id;
      node.remove();
    });
    incoming.querySelectorAll(':scope > .err, :scope > .hint').forEach(function (node) {
      showToast(node.classList.contains('err') ? 'error' : 'info', node.textContent);
      node.remove();
    });
    // The last image of a batch arrives by a chain placeholder, and removing it
    // here detaches the node htmx then fires afterSettle on, so that event never
    // reaches the body. The run ends here instead, once no link is left.
    // stopWork renders, and a second render would restart the arrival fade.
    if (busy() && !incoming.querySelector('.chain')) return stopWork();
    renderStrip();
    renderStage();
  }

  // Answers arrive by several routes: the form's own request, and each chain
  // placeholder replacing itself. Watching the container catches all of them.
  new MutationObserver(function (records) {
    if (records.some(function (record) { return record.addedNodes.length; })) harvest();
  }).observe(incoming, { childList: true, subtree: true });

  function selected() {
    return gallery.find(function (entry) { return entry.id === view; });
  }

  // A frame's number, as printed on the film's edge.
  function frameNumber(id) {
    return String(id).padStart(2, '0');
  }

  // The pencil loop, one hand-drawn stroke that overlaps where it closes.
  const MARK = '<svg class="mark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
    + '<path pathLength="1" d="M58 5 C80 5 97 16 98 44 C99 74 84 95 52 96 C20 97 3 80 2 52'
    + ' C1 24 18 7 44 4 C52 3 62 4 70 7"/></svg>';
  let markedId = null;      // the frame the loop was last drawn on, so it draws once
  const frames = new Map(); // image id to its frame, built once so no redraw reloads an image
  let pendingFrame = null;

  function show(id) {
    view = id;
    renderStrip();
    renderStage();
  }

  const statusText = document.getElementById('status-text');

  function renderTopPlate() {
    if (!busy()) statusText.textContent = 'Ready';
    else if (!progressState) statusText.textContent = 'Starting';
  }

  function pendingNode() {
    if (!pendingFrame) {
      pendingFrame = document.createElement('button');
      pendingFrame.type = 'button';
      pendingFrame.className = 'frame pending';
      pendingFrame.setAttribute('aria-label', 'Show the image in progress');
      pendingFrame.innerHTML = '<span class="still waiting"><span class="exposure"></span></span><span class="no"></span>';
      pendingFrame.addEventListener('click', function () { show('progress'); });
    }
    pendingFrame.querySelector('.still').style.width = Math.round(64 * Math.min(2, Math.max(0.5, runRatio))) + 'px';
    pendingFrame.querySelector('.no').textContent = frameNumber(nextId);
    return pendingFrame;
  }

  function frameNode(entry) {
    if (frames.has(entry.id)) return frames.get(entry.id);
    const frame = document.createElement('button');
    frame.type = 'button';
    frame.className = 'frame' + (entry.id === arrivedId ? ' arrive' : '');
    frame.title = 'Seed ' + entry.seed;
    frame.setAttribute('aria-label', entry.mode + ', seed ' + entry.seed);
    frame.innerHTML = '<span class="still"><img alt="" src="' + entry.src + '">'
      + (entry.mode === 'edit' ? '<span class="corner">' + icon('brush') + '</span>' : '')
      + '</span><span class="no">' + frameNumber(entry.id) + '</span>';
    frame.addEventListener('click', function () { show(entry.id); });
    frames.set(entry.id, frame);
    return frame;
  }

  // Frames never change order, so the ones kept are already in place. Only a
  // gone frame comes out and only a new one goes in. A moved node would restart
  // its entrance and reload its image.
  function placeFrames(wanted) {
    Array.from(strip.children).forEach(function (frame) {
      if (!wanted.includes(frame)) frame.remove();
    });
    let cursor = strip.firstElementChild;
    wanted.forEach(function (frame) {
      if (frame === cursor) cursor = cursor.nextElementSibling;
      else strip.insertBefore(frame, cursor);
    });
  }

  function markSelected() {
    strip.querySelectorAll('.mark').forEach(function (mark) { mark.remove(); });
    strip.querySelectorAll('.selected').forEach(function (frame) { frame.classList.remove('selected'); });
    const chosen = view === 'progress' ? pendingFrame : frames.get(view);
    if (chosen && chosen.isConnected) {
      chosen.classList.add('selected');
      chosen.insertAdjacentHTML('beforeend', MARK);
      chosen.querySelector('.mark').classList.toggle('draw', view !== 'progress' && markedId !== view);
    }
    markedId = view;
  }

  function renderStrip() {
    const wrap = document.getElementById('strip-wrap');
    wrap.hidden = !gallery.length && !busy();
    const wanted = gallery.map(frameNode);
    if (busy()) wanted.unshift(pendingNode());
    placeFrames(wanted);
    frames.forEach(function (frame, id) {
      if (!frame.isConnected) frames.delete(id);
    });
    markSelected();
    const count = gallery.length;
    const images = count + (count === 1 ? ' image' : ' images');
    document.getElementById('strip-note').innerHTML = keeping
      ? (count ? images + ', kept in this browser.' : 'Images are kept in this browser.')
      : (count ? images + ' in this tab.<span class="wide-only"> Download the ones you want to keep.</span>'
        : 'Images stay in this tab only.');
    document.getElementById('clear-gallery').hidden = !count;
    renderProgress();
  }

  function renderStage() {
    renderTopPlate();
    canvas.innerHTML = '';
    stageBar.hidden = true;
    stageBar.classList.remove('reserved');
    if (view === 'progress' && busy()) {
      // The caption's room is kept through the run, so the frame does not
      // move when the plate turns into the print.
      stageBar.innerHTML = '';
      stageBar.hidden = false;
      stageBar.classList.add('reserved');
      const card = document.createElement('div');
      card.className = 'card';
      const now = progressNow();
      paintPlate(card, now.running, now.percent);
      card.innerHTML = '<div class="plate"><div class="exposure"></div><span class="percent num"></span></div>'
        + '<div class="edge"><span>' + EDGE_NAME + '</span><span>' + frameNumber(nextId) + '</span></div>';
      canvas.append(card);
      fitStage();
      renderProgress();
      return;
    }
    const entry = selected();
    if (!entry) return renderEmpty();
    const shot = document.createElement('div');
    shot.className = 'shot' + (entry.id === arrivedId ? ' arrive' : '');
    const pic = document.createElement('div');
    pic.className = 'pic';
    pic.dataset.ratio = entry.width / entry.height;
    const image = document.createElement('img');
    image.src = entry.src;
    image.alt = entry.prompt;
    pic.append(image);
    if (entry.before) renderCompare(pic, entry);
    const edge = document.createElement('div');
    edge.className = 'edge';
    edge.innerHTML = '<span>' + EDGE_NAME + '</span><span>' + frameNumber(entry.id) + '</span>';
    shot.append(pic, edge);
    canvas.append(shot);
    arrivedId = null;
    // The bar takes its height from the stage, so the shot is fitted after it.
    renderStageBar(entry);
    fitStage();
  }

  // An empty stage names the next step and offers it as a button.
  function renderEmpty() {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const title = document.createElement('strong');
    const line = document.createElement('p');
    const start = document.createElement('button');
    start.type = 'button';
    start.className = 'btn';
    if (editing() && references.length) {
      title.textContent = 'Ready to edit';
      line.textContent = 'Say what to change, then press Edit.';
      empty.append(title, line);
      canvas.append(empty);
      return;
    }
    if (editing()) {
      title.textContent = 'Edit an image';
      line.textContent = 'Add the image, then say what to change.';
      start.innerHTML = icon('image-in') + 'Choose an image';
      start.addEventListener('click', function () { referenceInput.click(); });
    } else if (!currentMode().templates.length) {
      title.textContent = 'Nothing here yet';
      line.textContent = 'Write a prompt and press Generate.';
      empty.append(title, line);
      canvas.append(empty);
      return;
    } else {
      title.textContent = 'Nothing here yet';
      line.textContent = 'Write a prompt and press Generate, or start from a template.';
      start.innerHTML = icon('layout') + 'Browse templates';
      start.addEventListener('click', function (event) {
        event.stopPropagation();  // the click would reach the document and close the menu
        openTemplates();
      });
    }
    empty.append(title, line, start);
    canvas.append(empty);
  }

  // The first time an edit shows, the divider sweeps in from the left edge,
  // which shows it can be dragged. After that it opens at the middle.
  function renderCompare(pic, entry) {
    const before = document.createElement('img');
    before.className = 'before';
    before.src = entry.before;
    before.alt = 'The image before the edit';
    const range = document.createElement('input');
    range.type = 'range';
    range.className = 'compare-range';
    range.min = '0';
    range.max = '100';
    range.setAttribute('aria-label', 'Compare before and after');
    const divider = document.createElement('div');
    divider.className = 'divider';
    divider.innerHTML = icon('grip');
    const left = document.createElement('span');
    left.className = 'compare-tag left';
    left.textContent = 'Before';
    const right = document.createElement('span');
    right.className = 'compare-tag right';
    right.textContent = 'After';
    function split() { pic.style.setProperty('--split', range.value + '%'); }
    range.addEventListener('input', split);
    pic.append(before, range, divider, left, right);
    range.value = '50';
    split();
    if (entry.swept || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    entry.swept = true;
    sweep(range, split);
  }

  function sweep(range, split) {
    const delay = 650;      // once the print is in focus, while its grain still settles
    const length = 650;
    let start = null;
    range.value = '0';
    split();
    requestAnimationFrame(function frame(now) {
      if (!range.isConnected || range.dataset.touched) return;
      if (start === null) start = now + delay;
      const progress = Math.min(1, Math.max(0, (now - start) / length));
      range.value = String(Math.round(50 * (1 - Math.pow(1 - progress, 3))));
      split();
      if (progress < 1) requestAnimationFrame(frame);
    });
    range.addEventListener('pointerdown', function () { range.dataset.touched = '1'; }, { once: true });
    range.addEventListener('keydown', function () { range.dataset.touched = '1'; }, { once: true });
  }

  function renderStageBar(entry) {
    stageBar.hidden = false;
    stageBar.innerHTML = '';
    const about = document.createElement('div');
    about.className = 'about';
    const facts = document.createElement('div');
    facts.className = 'facts num';
    facts.append(madeBadge(entry));
    // Two groups: which image, then how it was made. A phone puts each on its own line.
    [[entry.position === '1 image' ? '' : 'Image ' + entry.position, 'Seed ' + entry.seed],
     [entry.width + ' × ' + entry.height, entry.steps + ' steps', 'Took ' + entry.elapsed + ' s']
    ].forEach(function (group, index) {
      if (index) {
        const lineBreak = document.createElement('span');
        lineBreak.className = 'break';
        facts.append(lineBreak);
      }
      group.forEach(function (text) {
        if (!text) return;
        const fact = document.createElement('span');
        fact.textContent = text;
        facts.append(fact);
      });
    });
    // The prompt leads, as the frame's caption; the facts sit quietly under it.
    // The Look shows as the muted end of the caption, so the facts leave it out.
    const prompt = document.createElement('p');
    prompt.className = 'prompt-line';
    if (entry.look) {
      const said = document.createElement('span');
      said.className = 'look-said';
      said.textContent = entry.look.adds;
      prompt.append(entry.look.sent.slice(0, -entry.look.adds.length), said);
    } else {
      prompt.textContent = entry.prompt;
    }
    prompt.addEventListener('click', function () { toggleSheet(prompt, entry); });
    prompt.addEventListener('keydown', function (event) {
      if (event.key !== 'Enter' && event.key !== ' ') return;
      event.preventDefault();
      toggleSheet(prompt, entry);
    });
    about.append(prompt, facts);

    // Every action is page state only; nothing is sent until the next run.
    const actions = document.createElement('div');
    actions.className = 'actions';
    // Edit this and Download are the two next steps people take; the reuse
    // actions are rarer, so they wait behind More to keep the row short.
    const more = document.createElement('div');
    more.className = 'menu-anchor';
    const moreToggle = iconButton('more', 'More actions', function () { toggleMenu(moreMenu); });
    moreToggle.setAttribute('aria-controls', 'more-menu');
    moreToggle.setAttribute('aria-expanded', 'false');
    const moreMenu = document.createElement('div');
    moreMenu.className = 'menu up';
    moreMenu.id = 'more-menu';
    moreMenu.setAttribute('role', 'menu');
    moreMenu.hidden = true;
    moreMenu.append(
      menuItem('image-in', 'Use as reference', function () {
        referFrom(entry);
      }),
      menuItem('hash', 'Reuse seed ' + entry.seed, function () {
        document.getElementById('seed').value = entry.seed;
        document.getElementById('advanced').open = true;
        refreshForm();
      }),
      menuItem('text', 'Reuse prompt', function () {
        // A Look this mode does not offer comes back as text, so the prompt
        // still says what the model got.
        const picks = entry.look ? picksHere(entry.look.picks) : {};
        promptInput.value = picks ? entry.prompt : entry.look.sent;
        look = picks || {};
        renderLook();
        if (paramSpec('negative')) document.getElementById('negative').value = entry.negative;
        growPrompt();
        refreshForm();
        promptInput.focus();
      })
    );
    more.append(moreToggle, moreMenu);
    const download = document.createElement('a');
    download.className = 'icon-btn';
    download.href = entry.src;
    download.download = STUDIO.backend.id + '-' + entry.mode + '-' + entry.seed + '.png';
    download.title = 'Download';
    download.setAttribute('aria-label', 'Download');
    download.innerHTML = icon('download');
    const rule = document.createElement('span');
    rule.className = 'rule';
    actions.append(textButton('brush', 'Edit this', function () { editThis(entry); }), more,
      rule, download,
      iconButton('trash', 'Remove', function () { removeEntry(entry.id); }, 'danger'));
    if (document.fullscreenEnabled) {
      actions.append(document.fullscreenElement
        ? iconButton('shrink', 'Exit full screen (F)', toggleFullscreen)
        : iconButton('expand', 'Full screen (F)', toggleFullscreen));
    }
    stageBar.append(about, actions);
    captionWatch.disconnect();
    captionWatch.observe(prompt);
  }

  // A label is a toggle only while it is cut, or its sheet is open. The watch
  // marks it again when a resize cuts it or gives it room.
  const captionWatch = new ResizeObserver(function (entries) {
    entries.forEach(function (entry) { markCaption(entry.target); });
  });

  function markCaption(prompt) {
    const open = Boolean(canvas.querySelector('.sheet'));
    if (open || prompt.scrollHeight > prompt.clientHeight + 1) {
      prompt.setAttribute('role', 'button');
      prompt.tabIndex = 0;
      prompt.setAttribute('aria-expanded', String(open));
    } else {
      prompt.removeAttribute('role');
      prompt.removeAttribute('tabindex');
      prompt.removeAttribute('aria-expanded');
    }
  }

  // The typed prompt, the Look's sentence and the negative, each named, as the
  // model got them. Focus goes to Close, and back to the label after.
  // "Generated", "Edited from 01", "Generated from your image". Kept images
  // from before the sources were recorded name only the mode.
  function madeBadge(entry) {
    const badge = document.createElement('span');
    badge.className = 'made';
    badge.append(entry.mode === 'edit' ? 'Edited' : 'Generated');
    const sources = entry.sources || [];
    if (!sources.length) return badge;
    const frameIds = [...new Set(sources.filter(Boolean))];
    const uploads = sources.filter(function (source) { return !source; }).length;
    const parts = frameIds.map(function (id) {
      if (!gallery.some(function (other) { return other.id === id; })) return frameNumber(id);
      const link = document.createElement('button');
      link.type = 'button';
      link.textContent = frameNumber(id);
      link.setAttribute('aria-label', 'Show frame ' + frameNumber(id));
      link.addEventListener('click', function () { show(id); });
      return link;
    });
    if (uploads) parts.push(uploads === 1 ? 'your image' : uploads + ' of your images');
    badge.append(' from ');
    parts.forEach(function (part, index) {
      if (index) badge.append(index === parts.length - 1 ? ' and ' : ', ');
      badge.append(part);
    });
    return badge;
  }

  function toggleSheet(prompt, entry) {
    if (!prompt.hasAttribute('role')) return;
    if (canvas.querySelector('.sheet')) return closeSheet();
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.id = 'prompt-sheet';
    sheet.setAttribute('role', 'region');
    sheet.setAttribute('aria-label', 'The whole prompt');
    const list = document.createElement('dl');
    [['Prompt', entry.prompt], ['Look', entry.look ? entry.look.adds : ''], ['Negative', entry.negative]]
      .forEach(function ([term, text]) {
        if (!text) return;
        const name = document.createElement('dt');
        const value = document.createElement('dd');
        name.textContent = term;
        value.textContent = text;
        list.append(name, value);
      });
    const close = iconButton('x', 'Close', closeSheet, 'close');
    sheet.addEventListener('keydown', function (event) {
      if (event.key !== 'Escape') return;
      event.stopPropagation();
      closeSheet();
    });
    sheet.append(list, close);
    canvas.append(sheet);
    prompt.setAttribute('aria-controls', sheet.id);
    markCaption(prompt);
    close.focus();
  }

  function closeSheet() {
    const sheet = canvas.querySelector('.sheet');
    if (!sheet) return;
    sheet.remove();
    const prompt = stageBar.querySelector('.prompt-line');
    if (!prompt) return;
    markCaption(prompt);
    prompt.focus();
  }

  // ---- Menus -----------------------------------------------------------------
  // One menu is open at most. A click outside or Escape closes it, and Escape
  // returns focus to the button that opened it.
  function toggleMenu(menu) {
    const opening = menu.hidden;
    closeMenus();
    if (!opening) return;
    menu.hidden = false;
    menuToggle(menu).setAttribute('aria-expanded', 'true');
    menu.querySelector('button').focus();
  }

  function menuToggle(menu) {
    return document.querySelector('[aria-controls="' + menu.id + '"]');
  }

  function closeMenus() {
    document.querySelectorAll('.menu:not([hidden])').forEach(function (menu) {
      menu.hidden = true;
      const toggle = menuToggle(menu);
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  function menuItem(name, label, handler) {
    const item = document.createElement('button');
    item.type = 'button';
    item.setAttribute('role', 'menuitem');
    item.innerHTML = (name ? icon(name) : '') + '<span class="item-text"></span>';
    item.querySelector('.item-text').textContent = label;
    item.addEventListener('click', function () {
      closeMenus();
      handler();
    });
    return item;
  }

  document.addEventListener('click', function (event) {
    if (event.target.closest('.menu, [aria-controls]')) return;
    closeMenus();
  });
  document.addEventListener('keydown', function (event) {
    const open = document.querySelector('.menu:not([hidden])');
    if (!open) return;
    if (event.key === 'Escape') {
      closeMenus();
      menuToggle(open).focus();
      return;
    }
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    event.preventDefault();
    const items = Array.from(open.querySelectorAll('button'));
    const step = event.key === 'ArrowDown' ? 1 : -1;
    const index = items.indexOf(document.activeElement);
    items[(index + step + items.length) % items.length].focus();
  });

  // Edit mode with this image as the only reference, an empty prompt, and the
  // image's own seed, so a rerun of the same edit gives the same result.
  // An image made in this tab carries its base64. A kept one reads it from its
  // blob only when it is used, so a long strip does not hold every image twice.
  function referFrom(entry) {
    const ready = entry.b64 ? Promise.resolve(entry.b64) : blobOf(entry.src).then(function (blob) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result.split(',')[1]); };
        reader.onerror = function () { reject(reader.error); };
        reader.readAsDataURL(blob);
      });
    });
    ready.then(function (b64) {
      addReference(b64, 'Seed ' + entry.seed, entry.id);
    }).catch(function (error) {
      showToast('error', 'The image did not load as a reference: ' + error.message);
    });
  }

  function editThis(entry) {
    const editRadio = document.getElementById('mode-edit');
    if (!editRadio.checked) {
      editRadio.checked = true;
      editRadio.dispatchEvent(new Event('change', { bubbles: true }));
    }
    references = [];
    promptInput.value = '';
    growPrompt();
    look = (entry.look && picksHere(entry.look.picks)) || {};
    renderLook();
    document.getElementById('seed').value = entry.seed;
    referFrom(entry);
    view = entry.id;
    renderStage();
    promptInput.focus();
  }

  function textButton(name, label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn quiet';
    button.innerHTML = icon(name) + label;
    button.addEventListener('click', handler);
    return button;
  }

  function iconButton(name, label, handler, extra) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon-btn' + (extra ? ' ' + extra : '');
    button.title = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = icon(name);
    button.addEventListener('click', handler);
    return button;
  }

  // The card takes the shape of the coming image, fitted inside the stage the
  // way the image itself will be.
  const REBATE_WIDTH = 20;   // the film's left and right rebate together
  const REBATE_HEIGHT = 34;  // top and bottom, the bottom holding the edge print

  function fitBox(box, ratio, share) {
    const width = Math.min((canvas.clientWidth - 48 - REBATE_WIDTH) * share,
      (canvas.clientHeight - 48 - REBATE_HEIGHT) * share * ratio);
    box.style.width = Math.round(width) + 'px';
    box.style.height = Math.round(width / ratio) + 'px';
  }

  function fitStage() {
    const plate = canvas.querySelector('.card .plate');
    if (plate) fitBox(plate, runRatio, 1);
    const pic = canvas.querySelector('.pic');
    if (pic) fitBox(pic, Number(pic.dataset.ratio), 1);
  }
  window.addEventListener('resize', fitStage);

  function removeEntry(id) {
    dropEntry(id);
    forget(function (images) { images.delete(id); }, { kind: 'remove', id: id });
  }

  // The shown image gives way to its neighbour. Another tab's removal leaves
  // this tab's view alone unless it shows that image.
  function dropEntry(id) {
    const index = gallery.findIndex(function (entry) { return entry.id === id; });
    if (index < 0) return;
    release(gallery.splice(index, 1)[0]);
    if (view === id) {
      const neighbour = gallery[Math.min(index, gallery.length - 1)];
      view = neighbour ? neighbour.id : null;
    }
    renderStrip();
    renderStage();
  }

  function dropAll() {
    const cleared = gallery;
    gallery = [];
    cleared.forEach(release);
    view = busy() ? 'progress' : null;
    renderStrip();
    renderStage();
  }

  document.getElementById('clear-gallery').addEventListener('click', function () {
    const question = keeping
      ? 'Remove all ' + gallery.length + ' images from this browser? Every open tab clears too.'
      : 'Remove all ' + gallery.length + ' images from this tab?';
    if (!confirm(question)) return;
    dropAll();
    forget(function (images) { images.clear(); }, { kind: 'clear' });
  });

  // ---- Kept images --------------------------------------------------------------
  // Each image and its facts go to IndexedDB, so a reload or a new tab brings
  // them back; localStorage holds about 5 MB, a few images. The store belongs to
  // this address and port. Every change goes out on a channel, so each open tab
  // shows the same strip. The server allows one run at a time, so two tabs
  // never number two new images at once.
  const KEEP_KEY = 'studio-keep';
  const KEPT_FIELDS = ['id', 'seed', 'width', 'height', 'steps', 'elapsed', 'position', 'mode', 'prompt',
    'look', 'negative', 'sources'];
  const channel = new BroadcastChannel('studio-gallery');
  let keeping = readKeep();
  let store = null;

  function readKeep() {
    try {
      return localStorage.getItem(KEEP_KEY) !== 'off';
    } catch (error) {
      console.warn('The keep setting was not read:', error);
      return true;
    }
  }

  function openStore() {
    if (!store) {
      store = new Promise(function (resolve, reject) {
        const request = indexedDB.open('studio', 1);
        request.onupgradeneeded = function () { request.result.createObjectStore('images', { keyPath: 'id' }); };
        request.onsuccess = function () { resolve(request.result); };
        request.onerror = function () { reject(request.error); };
      });
    }
    return store;
  }

  // Run one request on the images store. It settles when the transaction ends,
  // so a write has landed before any other tab hears of it.
  function inStore(access, work) {
    return openStore().then(function (database) {
      return new Promise(function (resolve, reject) {
        const transaction = database.transaction('images', access);
        const request = work(transaction.objectStore('images'));
        transaction.oncomplete = function () { resolve(request ? request.result : undefined); };
        transaction.onabort = function () { reject(transaction.error); };
      });
    });
  }

  function blobOf(url) {
    return fetch(url).then(function (response) { return response.blob(); });
  }

  function keepEntry(entry) {
    if (!keeping) return;
    Promise.all([blobOf(entry.src), entry.before ? blobOf(entry.before) : null]).then(function ([png, before]) {
      const record = { png: png, before: before };
      KEPT_FIELDS.forEach(function (field) { record[field] = entry[field]; });
      return inStore('readwrite', function (images) { return images.add(record); });
    }).then(function () {
      channel.postMessage({ kind: 'add', id: entry.id });
    }).catch(function (error) {
      showToast('error', 'The browser did not keep image ' + frameNumber(entry.id) + ': ' + error.message
        + ' It stays in this tab until a reload. Download it to keep it.');
    });
  }

  // Delete from the store, then tell the other tabs. With keeping off there is
  // nothing stored, and each tab's strip is its own.
  function forget(work, message) {
    if (!keeping) return;
    inStore('readwrite', work).then(function () {
      channel.postMessage(message);
    }).catch(function (error) {
      showToast('error', 'The browser did not remove the image: ' + error.message);
    });
  }

  // A kept image joins the strip in order, newest first, and moves the frame
  // numbers past it.
  function addKept(record) {
    if (gallery.some(function (entry) { return entry.id === record.id; })) return;
    const entry = { src: URL.createObjectURL(record.png), before: record.before && URL.createObjectURL(record.before) };
    KEPT_FIELDS.forEach(function (field) { entry[field] = record[field]; });
    const later = gallery.findIndex(function (other) { return other.id < entry.id; });
    gallery.splice(later < 0 ? gallery.length : later, 0, entry);
    nextId = Math.max(nextId, entry.id + 1);
  }

  // With nothing on the stage, the newest image takes it.
  function showNewest() {
    if (view === null && gallery.length) view = gallery[0].id;
    renderStrip();
    renderStage();
  }

  function loadKept() {
    if (!keeping) return;
    inStore('readonly', function (images) { return images.getAll(); }).then(function (records) {
      records.forEach(addKept);
      showNewest();
    }).catch(function (error) {
      showToast('error', 'The kept images did not load: ' + error.message);
    });
  }

  channel.addEventListener('message', function (event) {
    const message = event.data;
    if (message.kind === 'remove') dropEntry(message.id);
    if (message.kind === 'clear') dropAll();
    if (message.kind === 'keep') {
      keeping = message.on;
      markKeep();
      renderStrip();
    }
    if (message.kind !== 'add' || !keeping) return;
    inStore('readonly', function (images) { return images.get(message.id); }).then(function (record) {
      if (!record) return;
      addKept(record);
      showNewest();
    }).catch(function (error) {
      showToast('error', 'An image from another tab did not load: ' + error.message);
    });
  });

  // Off empties the store at once; the images stay in the open tabs until a
  // reload. On keeps what this tab shows now, oldest first.
  function setKeep(on) {
    if (!on && gallery.length
      && !confirm('Stop keeping images? The kept images leave this browser. Open tabs show them until a reload.')) {
      return;
    }
    keeping = on;
    try {
      localStorage.setItem(KEEP_KEY, on ? 'on' : 'off');
    } catch (error) {
      showToast('error', 'The keep setting applies to this tab only: ' + error.message);
    }
    channel.postMessage({ kind: 'keep', on: on });
    markKeep();
    renderStrip();
    if (!on) {
      inStore('readwrite', function (images) { images.clear(); }).catch(function (error) {
        showToast('error', 'The kept images were not removed: ' + error.message);
      });
      return;
    }
    gallery.slice().reverse().forEach(keepEntry);
  }

  function markKeep() {
    const item = document.getElementById('keep-toggle');
    if (item) item.setAttribute('aria-checked', String(keeping));
  }

  // ---- Toasts -----------------------------------------------------------------
  // Errors stay until closed, because they say what to fix. Anything else
  // clears itself.
  const toasts = document.getElementById('toasts');
  function showToast(kind, text) {
    const toast = document.createElement('div');
    toast.className = 'toast ' + kind;
    toast.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    const message = document.createElement('p');
    message.textContent = text;
    toast.innerHTML = icon(kind === 'error' ? 'alert' : 'info');
    toast.append(message, iconButton('x', 'Dismiss', function () { toast.remove(); }));
    toasts.append(toast);
    if (kind !== 'error') setTimeout(function () { toast.remove(); }, 4000);
  }

  // ---- Run, progress, cancel --------------------------------------------------
  // The poller clocks itself off its own response, and stops when the server
  // says nothing is running. That gap happens between two images of a batch, so
  // every request the page sends plants a fresh poller.
  const POLLER = '<div hx-get="/progress" hx-trigger="load"'
    + ' hx-target="#progress" hx-swap="innerHTML"></div>';
  let progressState = null;
  let pace = null;          // how fast this run's steps arrive, for the time left

  let runStartedAt = 0;

  // While a run goes, the run button is Cancel. A click in the first half
  // second is the second half of a double click on Generate, so it waits.
  // Enter in a text field also clicks this button (an implicit submit), with
  // no click count and the focus left in the field; that is not a cancel.
  go.addEventListener('click', function (event) {
    if (!busy()) return;
    event.preventDefault();
    const implicit = event.detail === 0 && document.activeElement !== go;
    if (implicit || Date.now() - runStartedAt < 500) return;
    requestCancel();
  });

  function startWork(element) {
    const fresh = element === form;
    document.body.classList.add('busy');
    go.disabled = false;
    goSub.textContent = '';
    countToggle.disabled = true;
    progressSlot.innerHTML = POLLER;
    htmx.process(progressSlot);
    if (fresh) {
      runStartedAt = Date.now();
      runKey = costKey();
      runPixels = targetPixels();
      runEstimate = currentMode().estimate;
      runRatio = targetRatio();
      runStepSeconds = stepSeconds();
      view = 'progress';
      progressState = null;
      pace = null;
      renderStrip();
      renderStage();
    }
  }

  // The tab title shows the progress, so a run can be watched from another tab.
  // A run that ends in the background leaves "Done" until the tab is seen.
  const BASE_TITLE = document.title;
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !busy()) document.title = BASE_TITLE;
  });

  function stopWork() {
    if (!busy()) return;
    document.title = (document.hidden ? '(Done) ' : '') + BASE_TITLE;
    document.body.classList.remove('busy', 'stopping');
    progressSlot.innerHTML = '';
    progressState = null;
    countToggle.disabled = false;
    if (view === 'progress') view = gallery.length ? gallery[0].id : null;
    renderStrip();
    renderStage();
    renderRunButton();
  }

  function requestCancel() {
    if (document.body.classList.contains('stopping')) return;
    document.body.classList.add('stopping');
    go.disabled = true;
    renderProgress();
    htmx.ajax('POST', '/cancel', { swap: 'none' });
  }

  // ---- Full screen ------------------------------------------------------------
  // The stage and the sheet fill the screen. F toggles it, and Escape leaves by
  // the browser's own rule. The arrow keys walk the sheet in and out of it.
  const work = document.querySelector('.work');

  function toggleFullscreen() {
    const change = document.fullscreenElement ? document.exitFullscreen() : work.requestFullscreen();
    change.catch(function (error) { showToast('error', 'Full screen failed: ' + error.message); });
  }
  document.addEventListener('fullscreenchange', renderStage);

  function stepFrame(delta) {
    const order = (busy() ? ['progress'] : []).concat(gallery.map(function (entry) { return entry.id; }));
    const index = order.indexOf(view);
    const next = order[index + delta];
    if (next === undefined) return;
    const stripHadFocus = strip.contains(document.activeElement);
    show(next);
    const selected = strip.querySelector('.selected');
    selected.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    if (stripHadFocus) selected.focus();
  }

  document.addEventListener('keydown', function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (document.querySelector('.menu:not([hidden])')) return;
    if (event.key === 'f' && document.fullscreenEnabled && (gallery.length || busy())) {
      event.preventDefault();
      toggleFullscreen();
    }
    if (event.key === 'ArrowRight') stepFrame(1);
    if (event.key === 'ArrowLeft') stepFrame(-1);
  });

  // Cmd+Enter (Ctrl+Enter off a Mac) runs from anywhere on the page. It obeys
  // the same rule as a click: nothing happens while the button is disabled.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || !(event.metaKey || event.ctrlKey)) return;
    event.preventDefault();
    if (!go.disabled && !busy()) form.requestSubmit(go);
  });

  new MutationObserver(function () {
    const node = progressSlot.querySelector('.progress-state');
    progressState = node ? {
      stage: node.dataset.stage, step: Number(node.dataset.step), total: Number(node.dataset.total),
      label: node.dataset.label, stopping: node.dataset.stopping === '1',
    } : null;
    trackPace();
    renderProgress();
  }).observe(progressSlot, { childList: true, subtree: true });

  // Time left comes from when steps arrive, never from the clock between them:
  // dividing by "now" made the number climb during every step and drop at the
  // next. The rate carries across the images of a batch. Until two steps have
  // arrived, the pre-run guess stands in. An image also needs time after its
  // last step, to decode and reach the page. That tail is measured on each
  // finished image; before the first, the backend's overhead stands in.
  function trackPace() {
    const state = progressState;
    if (!state) return;
    const now = Date.now();
    if (!pace) pace = { label: null, stepTime: 0, stepsTimed: 0, tail: null };
    if (state.label !== pace.label) {
      if (pace.label !== null && pace.lastStepAt) pace.tail = (now - pace.lastStepAt) / 1000;
      pace.label = state.label;
      pace.lastStep = 0;
      pace.lastStepAt = 0;
    }
    if (state.stage !== 'running' || state.step <= pace.lastStep) return;
    if (pace.lastStepAt) {
      pace.stepTime += (now - pace.lastStepAt) / 1000;
      pace.stepsTimed += state.step - pace.lastStep;
    }
    pace.lastStep = state.step;
    pace.lastStepAt = now;
    if (pace.stepsTimed >= 2 && runEstimate) {
      learnedCost[runKey] = paceRate() / Math.pow(runPixels / 1e6, runEstimate.exponent);
    }
  }

  function paceRate() {
    return pace && pace.stepsTimed >= 2 ? pace.stepTime / pace.stepsTimed : runStepSeconds;
  }

  function timeLeft() {
    const state = progressState;
    const perStep = paceRate();
    if (!state || !perStep) return '';
    const tail = pace && pace.tail !== null ? pace.tail : (runEstimate ? runEstimate.overhead : 0);
    const batch = (state.label || '').match(/(\d+) of (\d+)/);
    const imagesAfter = batch ? Number(batch[2]) - Number(batch[1]) : 0;
    const step = state.stage === 'running' ? state.step : 0;
    const sinceStep = pace && pace.lastStepAt ? (Date.now() - pace.lastStepAt) / 1000 : 0;
    const thisImage = Math.max(0, perStep * (state.total - step) + tail - sinceStep);
    const seconds = thisImage + imagesAfter * (perStep * state.total + tail);
    return seconds < 3 ? 'Almost done' : 'About ' + spell(seconds) + ' left';
  }

  function progressNow() {
    const state = progressState;
    const running = Boolean(state && state.stage === 'running' && state.total);
    return { running: running, percent: running ? Math.round(state.step / state.total * 100) : 0 };
  }

  // Exposure only grows with a sweep. A drop, at the next image of a batch or a
  // new run, jumps back to the left edge at once.
  function paintPlate(plate, running, percent) {
    const rewind = percent < (parseFloat(plate.style.getPropertyValue('--exposed')) || 0);
    plate.classList.toggle('rewind', rewind);
    plate.classList.toggle('waiting', !running);
    plate.style.setProperty('--exposed', percent + '%');
    if (!rewind) return;
    void plate.offsetWidth;   // apply the drop while the sweep is off
    plate.classList.remove('rewind');
  }

  function renderProgress() {
    if (!busy()) return;
    const state = progressState;
    const stopping = document.body.classList.contains('stopping') || (state && state.stopping);
    const now = progressNow();
    const running = now.running;
    let stepText = 'Starting';
    // Before step 0 the backend sets up its model: a rebuild, a switch between
    // generate and edit, or the edit engine's first load. Step 0 is its notice
    // that the engine started, which first encodes the prompt and images. The
    // engine may then run fewer steps (a starting image skips part of the
    // schedule), so the count shows from the first real step.
    if (state && state.stage === 'preparing') stepText = 'Loading the model';
    if (running && state.stage === 'running' && state.step === 0) {
      stepText = runSources.length ? 'Reading the prompt and images' : 'Reading the prompt';
    }
    if (running && state.step > 0) stepText = 'Step ' + state.step + ' of ' + state.total;
    if (stopping) stepText = 'Stopping at the end of this step';

    const left = running && !stopping ? timeLeft() : '';
    statusText.textContent = stopping ? 'Stopping' : running
      ? [stepText, state.label ? 'image ' + state.label : '',
        left.charAt(0).toLowerCase() + left.slice(1)].filter(Boolean).join(', ')
      : stepText;
    document.title = (running ? '(' + now.percent + '%) ' : '') + BASE_TITLE;
    document.querySelectorAll('.card, .frame.pending .still').forEach(function (plate) {
      paintPlate(plate, running, now.percent);
      const percent = plate.querySelector('.percent');
      if (percent) percent.textContent = running ? now.percent + '%' : '';
    });
  }

  function sideChannel(event) {
    const config = event.detail.requestConfig || event.detail.pathInfo || {};
    const path = config.path || config.requestPath || '';
    return path === '/progress' || path === '/cancel';
  }

  // The references are an array, not a form field, so they are attached here.
  // Only the form itself carries them: a chain request already has a token.
  document.body.addEventListener('htmx:configRequest', function (event) {
    if (event.detail.elt !== form) return;
    // Only a one-image edit changes that image in place. An edit from several
    // images composes them, so no single source lines up with the result and
    // a wipe between them would mislead.
    batchSource = editing() && references.length === 1
      ? blobUrl('data:image/png;base64,' + references[0].b64) : null;
    runSources = references.map(function (reference) { return reference.source; });
    const own = promptInput.value.trim();
    runLook = {
      prompt: own, sent: withLook(own), adds: lookText(), labels: lookLabels(),
      picks: JSON.parse(JSON.stringify(look)), negative: typedNegative(),
    };
    event.detail.parameters.prompt = runLook.sent;
    if (paramSpec('negative')) event.detail.parameters.negative = negativeText();
    event.detail.parameters.references = JSON.stringify(references.map(function (r) {
      return r.b64;
    }));
  });
  document.body.addEventListener('htmx:beforeRequest', function (event) {
    if (sideChannel(event)) return;
    if (event.detail.elt === form) toasts.innerHTML = '';
    startWork(event.detail.elt);
  });
  document.body.addEventListener('htmx:afterSettle', function (event) {
    // A /progress response settles once a second. It is not the end of the run,
    // and treating it as one used to clear the busy state mid-generation.
    if (sideChannel(event)) return;
    if (!document.querySelector('.chain')) stopWork();
  });
  document.body.addEventListener('htmx:responseError', stopWork);
  document.body.addEventListener('htmx:sendError', function () {
    stopWork();
    showToast('error', 'The server did not answer. Check that the studio server is still running.');
  });

  // A run, or images kept only in this tab, would be lost to a reload or a close.
  // Browsers show their own fixed text here; the page cannot set it.
  window.addEventListener('beforeunload', function (event) {
    if (!busy() && (keeping || !gallery.length)) return;
    event.preventDefault();
    event.returnValue = '';
  });

  // A mode the backend lacks stays in view, disabled, so the page keeps its shape.
  function setupModes() {
    form.querySelectorAll('input[name=mode]').forEach(function (radio) {
      const spec = MODES[radio.value];
      const label = form.querySelector('label[for=' + radio.id + ']');
      radio.disabled = !spec;
      if (spec) label.lastChild.textContent = spec.label;
      else label.title = STUDIO.backend.name + ' has no ' + label.textContent.trim().toLowerCase() + ' mode';
    });
    const first = form.querySelector('input[name=mode]:not(:disabled)');
    if (form.querySelector('input[name=mode]:checked').disabled) first.checked = true;
  }

  // The title is the switch, and only when there is a choice. A switch frees
  // the old backend and loads the new one, then the page reloads with its
  // capabilities.
  function setupBackends() {
    const toggle = document.getElementById('backend-toggle');
    const menu = document.getElementById('backend-menu');
    if (STUDIO.backends.length < 2) return;
    toggle.disabled = false;
    toggle.title = 'Switch the model';
    toggle.addEventListener('click', function () { toggleMenu(menu); });
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = 'Model';
    menu.append(head);
    STUDIO.backends.forEach(function ([id, name]) {
      const item = menuItem('check', name, function () { switchBackend(id, name); });
      item.setAttribute('role', 'menuitemradio');
      item.setAttribute('aria-checked', String(id === STUDIO.backend.id));
      menu.append(item);
    });
  }

  function switchBackend(id, name) {
    const toggle = document.getElementById('backend-toggle');
    if (id === STUDIO.backend.id) return;
    if (busy()) return showToast('info', 'Wait for the run to finish, then switch.');
    if (gallery.length && !confirm('Switching the model reloads the page and clears the gallery.')) return;
    toggle.disabled = true;
    showToast('info', 'Loading ' + name + '. This can take a minute.');
    fetch('/backend', { method: 'POST', body: new URLSearchParams({ backend: id }) })
      .then(function (answer) { return answer.text(); })
      .then(function (text) {
        if (!text) { gallery.length = 0; location.reload(); return; }
        toggle.disabled = false;
        showToast('error', new DOMParser().parseFromString(text, 'text/html').body.textContent);
      })
      .catch(function (error) {
        toggle.disabled = false;
        showToast('error', 'The switch failed: ' + error.message);
      });
  }

  // The theme is the one thing the page keeps: its name, in this browser.
  const THEMES = [['', 'Darkroom'], ['leica', 'Leica M'], ['kodak', 'Kodak Instamatic'], ['polaroid', 'Polaroid SX-70']];

  function setupThemes() {
    const toggle = document.getElementById('theme-toggle');
    const menu = document.getElementById('theme-menu');
    toggle.addEventListener('click', function () { toggleMenu(menu); });
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = 'Theme';
    menu.append(head);
    THEMES.forEach(function ([id, name]) {
      const item = menuItem('check', name, function () { applyTheme(id); });
      item.setAttribute('role', 'menuitemradio');
      item.dataset.theme = id;
      menu.append(item);
    });
    const imagesHead = document.createElement('div');
    imagesHead.className = 'menu-head';
    imagesHead.textContent = 'Images';
    const keep = menuItem('check', 'Keep in this browser', function () { setKeep(!keeping); });
    keep.setAttribute('role', 'menuitemcheckbox');
    keep.id = 'keep-toggle';
    menu.append(imagesHead, keep);
    markTheme();
    markKeep();
  }

  function applyTheme(id) {
    if (id) document.documentElement.dataset.theme = id;
    else delete document.documentElement.dataset.theme;
    markTheme();
    try {
      localStorage.setItem('studio-theme', id);
    } catch (error) {
      showToast('info', 'The theme applies to this tab only: ' + error.message);
    }
  }

  function markTheme() {
    const current = document.documentElement.dataset.theme || '';
    document.querySelectorAll('#theme-menu [role=menuitemradio]').forEach(function (item) {
      item.setAttribute('aria-checked', String(item.dataset.theme === current));
    });
  }

  setupModes();
  setupBackends();
  setupThemes();
  buildSizeControls();
  applyMode();
  renderLook();
  renderReferences();
  renderStrip();
  renderStage();
  loadKept();
</script>
</body>
</html>
