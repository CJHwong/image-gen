<script>
  // The saved theme applies before the first paint, so the page never flashes the default.
  // Kodak is the default. Darkroom saves an empty name, so a pick of it stays.
  try {
    const theme = localStorage.getItem('studio-theme') ?? 'kodak';
    if (theme) document.documentElement.dataset.theme = theme;
  } catch (error) {
    console.warn('The saved theme was not read:', error);
  }
</script>

     hold the early read above without letting the default theme flash. -->

<div class="app">
  <div class="work">
    <header class="topbar">
      <div class="dial">
        <div class="menu-anchor">
          <h1><button type="button" id="backend-toggle" aria-haspopup="menu" aria-expanded="false"

          <div class="menu" id="backend-menu" role="menu" hidden></div>
        </div>
        <span class="badge" title="The weights loaded">__BADGE__</span>
      </div>
      <div class="readout">
        <span class="status" id="status" role="status" aria-live="polite" hidden><span class="dot"></span><span id="status-text"></span></span>
        <button type="button" id="guide-toggle" class="icon-btn" aria-expanded="false"
          title="How to use this studio" aria-label="How to use this studio"><svg class="icon"><use href="#i-info"/></svg></button>
        <div class="menu-anchor">
        <button type="button" id="theme-toggle" class="icon-btn" aria-haspopup="menu" aria-expanded="false"

          <div class="menu" id="theme-menu" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <section class="stage">

      <div class="stage-bar" id="stage-bar" hidden></div>
      <!-- The messages are components/toast-host.js, which draws them from its
           own list. The host stays `#toasts`, with the role a query reaches it
           by and the polite live region it already had. -->
      <toast-host class="toasts" id="toasts" role="status" aria-live="polite"></toast-host>
    </section>

    <section class="strip-wrap" id="strip-wrap" hidden>
      <div class="strip-head">
        <span id="strip-note"></span>
        <span class="strip-actions">
          <button type="button" class="text-btn" id="download-gallery">Download all</button>
          <button type="button" class="text-btn" id="clear-gallery">Clear all</button>
        </span>
      </div>
      <!-- The frames are components/image-strip.js, which draws them from the
           store. The head above them stays the page's: it holds the two buttons
           and hangs their listeners while the markup is parsed. -->
      <image-strip class="strip" id="strip"></image-strip>
    </section>

    <!-- Server answers land here and move into the gallery. The batch chain
         placeholders wait here too, so the next request stays in the DOM. -->

    <div id="progress"></div>
  </div>

  <aside>
    <form id="form" class="mode-generate" hx-post="/generate" hx-target="#incoming" hx-swap="beforeend">

      <div class="controls">
        <div class="modes" role="radiogroup" aria-label="Mode">

          <label for="mode-generate"><svg class="icon"><use href="#i-sparkle"/></svg>Generate</label>
          <input type="radio" name="mode" id="mode-edit" value="edit">
          <label for="mode-edit"><svg class="icon"><use href="#i-brush"/></svg>Edit</label>
        </div>

        <div class="field prompt-field">
          <div class="field-head">
            <label for="prompt"><span class="generate-only">Prompt</span><span class="edit-only">What to change</span></label>
            <div class="head-actions">
            <button type="button" class="pill" id="templates-toggle" aria-expanded="false"
              aria-controls="templates"><svg class="icon"><use href="#i-layout"/></svg>Templates</button>
            <button type="button" class="pill" id="rewrite-toggle" hidden
              title="Rewrite the prompt into a longer instruction before generating"><svg class="icon"><use href="#i-sparkle"/></svg>Rewrite</button>
            </div>
          </div>
          <div class="menu" id="templates" role="menu" hidden></div>
          <textarea id="prompt" name="prompt" autofocus rows="4"></textarea>
          <look-adds class="look-tail" id="look-adds" hidden></look-adds>
        </div>

        <!-- One row per colour marked, in the prompt's own place, because while a
             region is drawn these rows are what the prompt is. -->

          </div>

        <div class="field">

            <button type="button" class="text-btn" id="clear-reference" hidden>Remove all</button>
          </div>

            <div class="field" data-param="guidance">

                <label for="guidance">Guidance</label>
                <guidance-value class="caption num" id="guidance-value"></guidance-value>
              </div>
              <input id="guidance" name="guidance" type="range">
            </div>
            <div class="field" data-param="cfg">
              <div class="field-head">

                <cfg-value class="caption num" id="cfg-value"></cfg-value>

            <div class="field" data-param="negative">

              <input id="negative" name="negative" type="text" placeholder="Optional">

      <div class="footer">

        </button>
        <div class="menu up" id="count-menu" role="menu" hidden></div>
        </div>
        <input type="hidden" id="count" name="count" value="1">
      </div>
    </form>
  </aside>
</div>

<script>
  // What the backend offers. The page reads every mode, param, limit, Look,
  // template and estimate from here, and hides or disables what is missing.
  const STUDIO = __STUDIO__;
  const MAX_BATCH = STUDIO.backend.max_batch;
  const MODES = {};
  STUDIO.modes.forEach(function (mode) { MODES[mode.id] = mode; });
  // The film edge prints the model name, the way a film stock prints its own.
  const EDGE_NAME = STUDIO.backend.name.toUpperCase().replace(/-/g, ' ')
    .replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });

  const form = document.getElementById('form');
  const go = document.getElementById('go');
  const goSub = document.getElementById('go-sub');
  const promptInput = document.getElementById('prompt');
  const countInput = document.getElementById('count');
  const sizeSelect = document.getElementById('size');
  const resolutionSelect = document.getElementById('resolution');
  const progressSlot = document.getElementById('progress');
  const incoming = document.getElementById('incoming');
  const countToggle = document.getElementById('count-toggle');
  const countMenu = document.getElementById('count-menu');
  const templatesToggle = document.getElementById('templates-toggle');
  const templatesMenu = document.getElementById('templates');

  function busy() {
    return document.body.classList.contains('busy');
  }

  // The run button carries the run state as an attribute of its own, so anything
  // that reads the state in the DOM reads this and not the button's name. The
  // labels read the same state off an attribute of their own, because `stopping`
  // is a class on the body and not a store field, and the labels are a component
  // the page cannot reach into. Which label shows is still the DOM's: the
  // component sets `hidden` on the ones it is not using, and no rule in the
  // stylesheet sets `display` on one.
  function syncRunState() {
    if (document.body.classList.contains('stopping')) {
      go.dataset.state = 'stopping';
    } else {
      go.dataset.state = busy() ? 'busy' : 'idle';
    }
    document.getElementById('run-labels').dataset.state = go.dataset.state;
  }

  // ---- The form ---------------------------------------------------------------
  // The mode in force, the params, the size derivations, the Look picks, the
  // negative, the cost of a run and the sentence on the run button all belong to
  // lib/form.js. It is declared first of the modules, because every later door is
  // handed on to it: the components the form is drawn from take what they cannot
  // read for themselves from there.
  //
  // What the page keeps is the state a run and the stage share: the references,
  // the gallery array, the shown frame, the arrival, the frame counter and the
  // shape in flight. The form asks for each through the getters on its door.
  const referenceInput = document.getElementById('reference');
  const refsZone = document.getElementById('refs');

  // The references are the page's array, not the form's, because a run posts it
  // and `verify_capabilities.py` reads it by name out of the page's global
  // scope. The form asks for it and reassigns through the two helpers below.
  let references = [];

  let formApi = null;
  document.addEventListener('form-ready', function (event) {
    formApi = event.detail.configure({
      studio: STUDIO,
      modes: MODES,
      maxBatch: MAX_BATCH,
      learnedCost: learnedCost,
      el: {
        form: form,
        go: go,
        goSub: goSub,
        promptInput: promptInput,
        countInput: countInput,
        sizeSelect: sizeSelect,
        resolutionSelect: resolutionSelect,
        referenceInput: referenceInput,
        refsZone: refsZone,
        countToggle: countToggle,
        countMenu: countMenu,
        templatesToggle: templatesToggle,
        templatesMenu: templatesMenu,
        statusText: statusText,
      },
      notify: showToast,
      busy: busy,
      region: function () { return region; },
      menus: function () { return menus; },
      store: function () { return formState; },
      gallery: function () { return gallery; },
      view: function () { return view; },
      references: function () { return references; },
      setReferences: function (next) { references = next; },
      renderStage: renderStage,
      renderStrip: renderStrip,
    });
  });

  // Three names verify_page.py reads straight out of the page's global scope:
  // `learnedCost` below, and these two. That check is frozen, and the exact step
  // rate is what it asserts, so they stay the page's own names and answer with
  // the form's own numbers.
  function costKey() { return formApi.costKey(); }
  function stepSeconds() { return formApi.stepSeconds(); }

  // ---- Marking a region -------------------------------------------------------
  // The brush, the overlay on the print, the magnifier, the mask, the tools and
  // the region rows belong to components/region-mark.js. That module owns the
  // drawing and the state it is written in: a stroke has to paint in the task
  // that asked for it, because the magnifier follows the pointer, and a row has
  // to keep the text someone is typing in it. Nothing is published on `window`:
  // the page asks the region real questions through the handle below, and the
  // module asks the page for what it owns and the module cannot see.
  //
  // The module is deferred, so the page's own draws ask the region questions
  // before its handle arrives. These are the five they ask, and the answers are
  // the true ones while nothing is drawn, which is the case until the module is
  // here. The module replaces the whole object on `region-mark-ready`. A question
  // a user action asks is not answered here: the module is deferred, so it is
  // loaded before the page is, the way the menus are.
  let region = {
    sync: function () {},
    preview: function () {},
    dropStale: function () {},
    onPrint: function () { return false; },
    count: function () { return 0; },
  };
  document.addEventListener('region-mark-ready', function (event) {
    region = event.detail.configure({
      // The reference list is the page's, because a run posts it, so the guard
      // asks for it rather than keeping a second copy that could drift.
      references: function () { return references; },
      view: function () { return view; },
      editing: formApi.editing,
      // The mode in force declares whether it takes a region at all.
      regionMarking: function () { return Boolean(formApi.currentMode().region_marking); },
      prompt: function () { return promptInput.value; },
      // The stage and the sidebar are the page's. The module asks for their
      // redraws and never sequences a render it does not own.
      redraw: renderStage,
      refresh: function () { return formApi.refreshForm(); },
      notify: showToast,
      iconButton: stage.iconButton,
    });
  });

  // ---- What the cost is learned from -------------------------------------------
  // The backend's constants fit one machine. Once a run shows its real step
  // rate, that rate, brought back to one megapixel, replaces the constant for
  // the next estimate on this device. It comes from the live steps, not from
  // the time an image took, which also holds one-off loads. Guidance above 1
  // runs two passes per step, so those runs learn apart. Tab memory only.
  //
  // The object is the page's because verify_page.py clears it and reads it back
  // by name. The form reads it for its estimate, and lib/htmx.js writes what a
  // run learned into it.
  const learnedCost = {};
  // The run's own step rate, pixels, estimate model and start time belong to
  // lib/htmx.js, with the run. This one stays: the stage fits a plate to it and
  // the strip draws its waiting frame from it, so it is read across the page.
  let runRatio = 1;         // the shape of the image in flight, whatever the form says now

  // ---- Gallery ----------------------------------------------------------------
  // The server keeps no image after it answers. The browser keeps them, with
  // their facts, until Clear all, unless "Keep in this browser" is off: then
  // they live in this tab's memory only, and a reload clears them.
  const canvas = document.getElementById('canvas');
  const stageBar = document.getElementById('stage-bar');
  let gallery = [];
  let view = null;          // an image id, or 'progress' while a run is shown
  let arrivedId = null;     // the image to fade in once, on arrival
  let nextId = 1;

  // The strip's frames, the wipe and the ways out of the gallery belong to
  // components/image-strip.js. The gallery array stays here, because a run's
  // answer and a kept image both land in it, and the page mirrors it into the
  // store, which is what redraws the strip.
  //
  // The page asks the module nothing before its handle arrives. The module is
  // deferred and the page's startup runs first, but every question the page has
  // for the strip is about a frame, and a frame only exists once a run has
  // answered, which is long after the module is here. The one handoff that is
  // not a question is the arrival, and that waits for an arrival to carry.
  let strip = null;
  document.addEventListener('image-strip-ready', function (event) {
    strip = event.detail.configure({
      // The array is the page's to hold, so it is asked for rather than copied.
      gallery: function () { return gallery; },
      view: function () { return view; },
      setView: function (id) { view = id; },
      // The waiting frame takes its number and its shape from the run in flight.
      pending: function () { return { number: nextId, ratio: runRatio }; },
      frameNumber: stage.frameNumber,
      fileName: stage.fileName,
      show: show,
      // The strip's own chrome, and the stage, are the page's. The module asks
      // for their redraws and never sequences a render it does not own.
      redraw: renderStrip,
      renderStage: renderStage,
      release: run.release,
      // The ways out of the gallery ask the store to forget the image. The
      // store's handle is not here yet when the strip's is: two modules, two
      // doors, and no order between them, so this asks through the page.
      forget: function (work, message) { kept.forget(work, message); },
      notify: showToast,
      keptFields: function () { return kept.fields(); },
      keeping: function () { return keeping; },
    });
  });

  // The blob URLs, the arrival's harvest and the free of a batch's source belong
  // to lib/htmx.js, with the run that makes them. What the module cannot read for
  // itself is the gallery array below and the frame counter, and both go over on
  // its door.

  // The pencil loop, the frame's own markup and which frame is shown belong to
  // components/image-strip.js, which draws them from the store. The page keeps
  // the id counter, the arrival and the shown frame, because a run's card, the
  // stage bar's edge print and the strip all read them.

  function show(id) {
    view = id;
    renderStrip();
    renderStage();
  }

  const statusText = document.getElementById('status-text');

  function renderStrip() {
    const wrap = document.getElementById('strip-wrap');
    wrap.hidden = !gallery.length && !busy();
    const count = gallery.length;
    const images = count + (count === 1 ? ' image' : ' images');
    document.getElementById('strip-note').innerHTML = keeping
      ? (count ? images + ', kept in this browser.' : 'Images are kept in this browser.')
      : (count ? images + ' in this tab.<span class="wide-only"> Download the ones you want to keep.</span>'
        : 'Images stay in this tab only.');
    document.getElementById('clear-gallery').hidden = !count;
    document.getElementById('download-gallery').hidden = !count;
    // The arrival is handed over here, before the stage clears it: the strip
    // reads it while it still holds it and adds the frame's entrance once.
    if (arrivedId !== null) strip.arrived(arrivedId);
    // The first draw runs inside the form module's own configure, before its
    // handle is assigned, and the store is seeded again on its door.
    if (formApi) formApi.pushGallery();
    renderProgress();
  }

  // The wipe itself belongs to components/image-strip.js, which draws it and
  // owns whether it is on. The stage bar asks for the switch and places it.

  document.getElementById('guide-toggle').addEventListener('click', function () { stage.openGuide(); });

  // ---- Menus -----------------------------------------------------------------
  // The mechanics belong to components/popup-menu.js: one menu open at most, and
  // a pick, a click outside or Escape closes it. The page keeps what its menus
  // say and what a pick does, so this holds their sections and nothing else.
  //
  // That module is deferred and this script is not, so the manager arrives on
  // the event below. The listener is registered while the markup is parsed, and
  // the module evaluates after that, so the manager is always here before the
  // first click. The sections are built in the handler, which is the same slot
  // in the load they took before.
  let menus = null;
  document.addEventListener('popup-menus-ready', function (event) {
    menus = event.detail;
    setupBackends();
    setupKeep();
  });

  // ---- The stage, and full screen ---------------------------------------------
  // The print, the bar under it, the two sheets and full screen belong to
  // components/stage.js. Same door, same reason: that module is deferred and this
  // script is not. The form's startup draws the empty stage while its own module
  // is evaluated, and that module is written before this one, so the page's
  // redraw request is a no-op by then and the handler below is what draws it.
  //
  // The page keeps the state the stage draws from, because a run writes it: the
  // gallery, the shown frame, the arrival, the frame counter and the shape in
  // flight. The stage asks for each through the getters below.
  let stage = null;
  document.addEventListener('stage-ready', function (event) {
    stage = event.detail.configure({
      canvas: canvas,
      stageBar: stageBar,
      statusText: statusText,
      promptInput: promptInput,
      referenceInput: referenceInput,
      work: document.querySelector('.work'),
      backendId: STUDIO.backend.id,
      edgeName: EDGE_NAME,
      notify: showToast,
      busy: busy,
      editing: formApi.editing,
      currentMode: formApi.currentMode,
      paramSpec: formApi.paramSpec,
      references: function () { return references; },
      gallery: function () { return gallery; },
      view: function () { return view; },
      nextId: function () { return nextId; },
      runRatio: function () { return runRatio; },
      arrivedId: function () { return arrivedId; },
      clearArrived: function () { arrivedId = null; },
      progressState: function () { return run ? run.progressState() : null; },
      region: function () { return region; },
      strip: function () { return strip; },
      menus: function () { return menus; },
      progressCard: function () { return progressCard; },
      picksHere: formApi.picksHere,
      setLook: formApi.setLook,
      referFrom: referFrom,
      editThis: editThis,
      refreshForm: function () { return formApi.refreshForm(); },
      growPrompt: function () { return formApi.growPrompt(); },
      openTemplates: function () { return formApi.openTemplates(); },
      show: show,
      renderProgress: renderProgress,
    });
    renderStage();
  });

  // The page's own redraw request for the stage. The module owns the drawing and
  // this is the page asking for it: the startup's draw is a no-op, and the
  // handler above makes it once the module is here.
  function renderStage() { if (stage) stage.renderStage(); }

  // ---- The store, and the components the form is drawn from ------------------
  // Same door, same reason: each module is deferred and this script is not, so
  // each arrives on an event of its own, and the listeners below are registered
  // while the markup is parsed. The store's own handler seeds it from the form,
  // and each component's handler hands over what the page owns and the component
  // cannot see: the option lists, the two form selects, and the derivations the
  // size field shares with the run estimate.
  //
  // The run button's labels take no handle. Their verb comes from the store's
  // `mode` and their state from an attribute the page mirrors onto them, so
  // there is nothing to pass.
  let formState = null;
  document.addEventListener('state-ready', function (event) {
    formState = event.detail;
    formApi.useStore();
  });
  document.addEventListener('size-chips-ready', function (event) { formApi.useSizeChips(event.detail); });
  document.addEventListener('advanced-panel-ready', function (event) { formApi.useAdvanced(event.detail); });
  document.addEventListener('look-rows-ready', function (event) { formApi.useLookRows(event.detail); });
  document.addEventListener('reference-list-ready', function (event) { formApi.useReferences(event.detail); });

  // Edit mode with this image as the only reference, an empty prompt, and the
  // image's own seed, so a rerun of the same edit gives the same result.
  // An image made in this tab carries its base64. A kept one reads it from its
  // blob only when it is used, so a long strip does not hold every image twice.
  function referFrom(entry) {
    const ready = entry.b64 ? Promise.resolve(entry.b64) : kept.blobOf(entry.src).then(function (blob) {
      return new Promise(function (resolve, reject) {
        const reader = new FileReader();
        reader.onload = function () { resolve(reader.result.split(',')[1]); };
        reader.onerror = function () { reject(reader.error); };
        reader.readAsDataURL(blob);
      });
    });
    ready.then(function (b64) {
      formApi.addReference(b64, 'Seed ' + entry.seed, entry.id);
    }).catch(function (error) {
      showToast('error', 'The image did not load as a reference: ' + error.message);
    });
  }

  function editThis(entry) {
    const editRadio = document.getElementById('mode-edit');
    if (!editRadio.checked) {
      editRadio.checked = true;
      editRadio.dispatchEvent(new Event('change', { bubbles: true }));
    }
    references = [];
    promptInput.value = '';
    formApi.growPrompt();
    formApi.setLook((entry.look && formApi.picksHere(entry.look.picks)) || {});
    document.getElementById('seed').value = entry.seed;
    referFrom(entry);
    view = entry.id;
    renderStage();
    promptInput.focus();
  }

  // Every way out of the strip is components/image-strip.js's: a removal, a
  // clear and a download all move the gallery array the page holds. The two
  // buttons stay in the page's markup, so their listeners stay here and call it.
  document.getElementById('download-gallery').addEventListener('click', function () { strip.download(); });
  document.getElementById('clear-gallery').addEventListener('click', function () { strip.clear(); });

  // ---- Kept images --------------------------------------------------------------
  // The database and the channel belong to lib/store.js. Two things stay here.
  // The keep setting is read from `localStorage` by the page, because the strip
  // note is drawn by lib/form.js and that module is evaluated before lib/store.js
  // is: the note cannot wait for the store's handle to say which of the two is in
  // force. The gallery array is the page's the same way, because a run's answer
  // lands in it and the strip, the stage and the run all read it. The server
  // allows one run at a time, so two tabs never number two new images at once.
  const KEEP_KEY = 'studio-keep';
  let keeping = readKeep();

  function readKeep() {
    try {
      return localStorage.getItem(KEEP_KEY) !== 'off';
    } catch (error) {
      console.warn('The keep setting was not read:', error);
      return true;
    }
  }

  // A kept image joins the strip in order, newest first, and moves the frame
  // numbers past it. The record is lib/store.js's to rebuild and this array is
  // the page's to hold, so the module builds the entry and the page files it.
  function admit(entry) {
    if (gallery.some(function (other) { return other.id === entry.id; })) return;
    const later = gallery.findIndex(function (other) { return other.id < entry.id; });
    gallery.splice(later < 0 ? gallery.length : later, 0, entry);
    nextId = Math.max(nextId, entry.id + 1);
  }

  // With nothing on the stage, the newest image takes it.
  function showNewest() {
    if (view === null && gallery.length) view = gallery[0].id;
    renderStrip();
    renderStage();
  }

  // Off empties the store at once; the images stay in the open tabs until a
  // reload. On keeps what this tab shows now, oldest first.
  function setKeep(on) {
    if (!on && gallery.length
      && !confirm('Stop keeping images? The kept images leave this browser. Open tabs show them until a reload.')) {
      return;
    }
    keeping = on;
    try {
      localStorage.setItem(KEEP_KEY, on ? 'on' : 'off');
    } catch (error) {
      showToast('error', 'The keep setting applies to this tab only: ' + error.message);
    }
    kept.announce(on);
    markKeep();
    renderStrip();
    if (on) gallery.slice().reverse().forEach(kept.keep);
  }

  function markKeep() {
    const item = document.getElementById('keep-toggle');
    if (item) item.setAttribute('aria-checked', String(keeping));
  }

  // The kept images belong to lib/store.js, which owns the database and the
  // channel and takes the page's own helpers on the door below. What it cannot
  // read for itself is named here: the array and the setting it must not keep a
  // second copy of, the page's own draws, and what a message from another tab
  // does to the strip. Nothing is asked of it before it arrives: the kept
  // images of a reload are its own first job, and it is asked for them here.
  let kept = null;
  document.addEventListener('store-ready', function (event) {
    kept = event.detail.configure({
      admit: admit,
      showNewest: showNewest,
      keeping: function () { return keeping; },
      // A message another tab sent about the strip. The three kinds are the
      // removal, the clear and the keep setting, and each one moves something
      // here. An image the other tab made travels by its own path, because the
      // picture is too big for a message.
      heard: function (message) {
        if (message.kind === 'remove') strip.drop(message.id);
        if (message.kind === 'clear') strip.dropAll();
        if (message.kind === 'keep') {
          keeping = message.on;
          markKeep();
          renderStrip();
        }
      },
      frameNumber: stage.frameNumber,
      notify: showToast,
    });
    kept.load();
  });

  // ---- Toasts -----------------------------------------------------------------
  // The messages are components/toast-host.js, which draws them from its own
  // list. The page keeps the one name that toasts through, because its own code
  // calls it and every module that toasts while it works takes it on its door.
  //
  // No message is sent before the host is here, and that is measured rather
  // than assumed. The classic script toasts nothing while it starts, and the
  // one message a startup can raise is lib/store.js's, from a module that is
  // evaluated after this one. Delaying every module by half a second, which is
  // the worst a cold load does, keeps that message and raises no page error.
  let toastHost = null;
  document.addEventListener('toast-ready', function (event) { toastHost = event.detail; });
  function showToast(kind, text) { toastHost.notify(kind, text); }

  // ---- Run, progress, cancel --------------------------------------------------
  // The poll, the run post, the cancel and everything the stage reads while one
  // goes belong to lib/htmx.js. Same door, same reason: that module is deferred.
  // The page keeps the redraws the run asks for and the state it shares with the
  // stage: the gallery array, the shown frame, the arrival, the frame counter and
  // the shape in flight.
  let run = null;
  document.addEventListener('run-ready', function (event) {
    run = event.detail.configure({
      el: {
        form: form,
        go: go,
        goSub: goSub,
        promptInput: promptInput,
        countInput: countInput,
        progressSlot: progressSlot,
        incoming: incoming,
        countToggle: countToggle,
        statusText: statusText,
      },
      notify: showToast,
      busy: busy,
      editing: formApi.editing,
      currentMode: formApi.currentMode,
      paramSpec: formApi.paramSpec,
      withLook: formApi.withLook,
      lookText: formApi.lookText,
      lookLabels: formApi.lookLabels,
      typedNegative: formApi.typedNegative,
      negativeText: formApi.negativeText,
      spell: formApi.spell,
      learnedCost: learnedCost,
      costKey: costKey,
      stepSeconds: stepSeconds,
      targetPixels: formApi.targetPixels,
      targetRatio: formApi.targetRatio,
      applyParams: formApi.applyParams,
      clampCount: formApi.clampCount,
      growPrompt: formApi.growPrompt,
      pushLook: formApi.pushLook,
      probeSize: formApi.probeSize,
      refreshForm: formApi.refreshForm,
      renderReferences: formApi.renderReferences,
      renderStrip: renderStrip,
      renderStage: renderStage,
      renderRunButton: function () { return formApi.renderRunButton(); },
      syncRunState: syncRunState,
      clearToasts: function () { toastHost.clear(); },
      keep: function (entry) { kept.keep(entry); },
      region: function () { return region; },
      progressCard: function () { return progressCard; },
      references: function () { return references; },
      setReferences: function (next) { references = next; },
      gallery: function () { return gallery; },
      view: function () { return view; },
      setView: function (id) { view = id; },
      look: function () { return formApi.look(); },
      setLook: formApi.setLook,
      keeping: function () { return keeping; },
      setRunRatio: function (ratio) { runRatio = ratio; },
      setArrived: function (id) { arrivedId = id; },
      takeFrameId: function () { return nextId++; },
      // The model's name in the form the edge prints it. A frame records this at
      // the moment it arrives, so a frame made before a switch keeps the name of
      // the model that made it. The stage's handle carries a field of the same
      // name for the frame it draws; this one is what the run records, and it was
      // missing, which is why every frame wore the selected model.
      edgeName: EDGE_NAME,
      rewrittenFrom: function () { return formApi.rewrittenFrom(); },
    });
  });

  // The page's own request for the progress readout. The run module draws it and
  // this is the page asking: the stage and the strip both call it.
  function renderProgress() { if (run) run.renderProgress(); }

  // The card belongs to components/progress-card.js, which draws the plate and
  // owns the exposure on it. htmx keeps `#progress`, the element the poll swaps
  // and whose children carry the next `hx-get`, and nothing renders over it. The
  // page keeps the handle, because the run paints it and the stage mounts it.
  let progressCard = null;
  document.addEventListener('progress-card-ready', function (event) {
    progressCard = event.detail;
  });

  // ---- Full screen ------------------------------------------------------------
  // The stage and the sheet fill the screen, and both belong to
  // components/stage.js. F toggles it, and Escape leaves by the browser's own
  // rule. This key is the page's, because full screen and the strip share it.
  //
  // The arrow keys walk the strip, which is the strip's own move: the module
  // keeps the shown frame's box across its own redraw, so the correction lives
  // where the redraw does. The key is the page's, because full screen shares it.
  document.addEventListener('keydown', function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (document.querySelector('.menu:not([hidden])')) return;
    if (event.key === 'f' && document.fullscreenEnabled && (gallery.length || busy())) {
      event.preventDefault();
      stage.toggleFullscreen();
    }
    if (event.key === 'ArrowRight') strip.step(1);
    if (event.key === 'ArrowLeft') strip.step(-1);
  });

  // Cmd+Enter (Ctrl+Enter off a Mac) runs from anywhere on the page. It obeys
  // the same rule as a click: nothing happens while the button is disabled.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || !(event.metaKey || event.ctrlKey)) return;
    event.preventDefault();
    if (!go.disabled && !busy()) form.requestSubmit(go);
  });

  // The title is the switch, and only when there is a choice. A switch frees
  // the old backend and loads the new one, then the page reloads with its
  // capabilities. Nothing is lost by it: the strip is the browser's own store and
  // each frame carries the model that made it, so the rows can sit together. This
  // used to ask first, because it said it would clear the strip. It did not.
  function setupBackends() {
    const toggle = document.getElementById('backend-toggle');
    const menu = document.getElementById('backend-menu');
    if (STUDIO.backends.length < 2) return;
    toggle.disabled = false;
    toggle.title = 'Switch the model';
    toggle.addEventListener('click', function () { menus.toggleMenu(menu); });
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = 'Model';
    menu.append(head);
    STUDIO.backends.forEach(function ([id, name, description]) {
      const item = menus.menuItem('check', name, function () { switchBackend(id, name); });
      item.setAttribute('role', 'menuitemradio');
      item.setAttribute('aria-checked', String(id === STUDIO.backend.id));
      // The accessible name is the model's name alone, pinned here. A row carrying
      // its description in the name would still read correctly to a screen reader,
      // but it would stop matching by name, which is how the checks find these.
      item.setAttribute('aria-label', name);
      if (description) {
        // The same second line the template menu draws, from the same class.
        const note = document.createElement('span');
        note.className = 'item-note';
        note.setAttribute('aria-hidden', 'true');
        note.textContent = description;
        item.querySelector('.item-text').append(note);
      }
      menu.append(item);
    });
  }

  function switchBackend(id, name) {
    const toggle = document.getElementById('backend-toggle');
    if (id === STUDIO.backend.id) return;
    if (busy()) return showToast('info', 'Wait for the run to finish, then switch.');
    toggle.disabled = true;
    showToast('info', 'Loading ' + name + '. This can take a minute.');
    fetch('/backend', { method: 'POST', body: new URLSearchParams({ backend: id }) })
      .then(function (answer) { return answer.text(); })
      .then(function (text) {
        if (!text) { location.reload(); return; }
        toggle.disabled = false;
        showToast('error', new DOMParser().parseFromString(text, 'text/html').body.textContent);
      })
      .catch(function (error) {
        toggle.disabled = false;
        showToast('error', 'The switch failed: ' + error.message);
      });
  }

  // The Images section of the theme menu. The Theme section above it belongs to
  // lib/theme.js, which draws it once this script has built the menu.
  function setupKeep() {
    const menu = document.getElementById('theme-menu');
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = 'Images';
    const keep = menus.menuItem('check', 'Keep in this browser', function () { setKeep(!keeping); });
    keep.setAttribute('role', 'menuitemcheckbox');
    keep.id = 'keep-toggle';
    menu.append(head, keep);
    markKeep();
  }

  // The kept images are asked for on the store's own door: that module owns the
  // database, and reading it back is the first thing it does.
</script>
</body>
</html>
