          <span class="num" id="count-shown">&times;1</span><svg class="icon"><use href="#i-caret"/></svg>
        </button>
        <div class="menu up" id="count-menu" role="menu" hidden></div>
        </div>
        <input type="hidden" id="count" name="count" value="1">
      </div>
    </form>
  </aside>
</div>

<script>
  // What the backend offers. The page reads every mode, param, limit, Look,
  // template and estimate from here, and hides or disables what is missing.
  const STUDIO = __STUDIO__;
  const MAX_BATCH = STUDIO.backend.max_batch;
  const MODES = {};
  STUDIO.modes.forEach(function (mode) { MODES[mode.id] = mode; });
  // The film edge prints the model name, the way a film stock prints its own.
  const EDGE_NAME = STUDIO.backend.name.toUpperCase().replace(/-/g, ' ')
    .replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });

  const form = document.getElementById('form');
  const go = document.getElementById('go');
  const goSub = document.getElementById('go-sub');
  const goFill = document.getElementById('go-fill');
  const promptInput = document.getElementById('prompt');
  const countInput = document.getElementById('count');
  const sizeSelect = document.getElementById('size');
  const resolutionSelect = document.getElementById('resolution');
  const progressSlot = document.getElementById('progress');
  const incoming = document.getElementById('incoming');

  function icon(name) {
    return '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
  }

  function editing() {
    return document.getElementById('mode-edit').checked;
  }

  function currentMode() {
    return MODES[editing() ? 'edit' : 'generate'];
  }

  function paramSpec(id) {
    return currentMode().params.find(function (param) { return param.id === id; });
  }

  function maxReferences() {
    return currentMode().max_references;
  }

  // A choice param fills its hidden select, so the request stays a plain form.
  function fillSelect(select, id) {
    const spec = STUDIO.modes.map(function (mode) {
      return mode.params.find(function (param) { return param.id === id; });
    }).find(Boolean);
    if (!spec) return;
    spec.choices.forEach(function (choice) { select.add(new Option(choice.label, choice.value)); });
    select.value = spec.default;
  }
  fillSelect(document.getElementById('size'), 'size');
  fillSelect(document.getElementById('resolution'), 'resolution');

  // A number param takes its range from the spec of the mode in use. The value
  // carries over a mode switch when it still fits the new range. The first call
  // sets every default, because an empty range input reads as its midpoint. A
  // choice param takes the mode's default on every switch, because a mode
  // switch starts over: an edit keeps the image's shape, a generate is square.
  let paramsSet = false;
  function applyParams() {
    form.querySelectorAll('[data-param]').forEach(function (node) {
      node.hidden = !paramSpec(node.dataset.param);
    });
    document.getElementById('size-field').hidden = !paramSpec('size') && !paramSpec('resolution');
    currentMode().params.filter(function (param) { return param.kind === 'number'; }).forEach(function (param) {
      const input = document.getElementById(param.id);
      if (!input) return;
      input.min = param.minimum === null ? '' : param.minimum;
      input.max = param.maximum === null ? '' : param.maximum;
      input.step = param.step === null ? 'any' : param.step;
      const value = Number(input.value);
      const fits = input.value !== '' && (param.minimum === null || value >= param.minimum)
        && (param.maximum === null || value <= param.maximum);
      if (!fits || !paramsSet) input.value = param.default;
    });
    currentMode().params.filter(function (param) { return param.kind === 'choice'; }).forEach(function (param) {
      const select = document.getElementById(param.id);
      if (select) select.value = param.default;
    });
    paramsSet = true;
  }

  function busy() {
    return document.body.classList.contains('busy');
  }

  function spell(seconds) {
    if (seconds < 90) return Math.max(5, Math.round(seconds / 5) * 5) + 's';
    const minutes = Math.floor(seconds / 60);
    const rest = Math.round((seconds % 60) / 15) * 15;
    if (rest && rest < 60) return minutes + ' min ' + rest + 's';
    return (minutes + (rest ? 1 : 0)) + ' min';
  }

  // ---- References ---------------------------------------------------------
  // References live in one array, whatever put them there: the picker, a drop,
  // a paste, or "Use as reference" on a result. Each mode sets how many it
  // takes. When a mode takes one, a new one replaces the old. Files are read here and posted as base64 in a normal
  // form field, which keeps the server off multipart parsing that the standard
  // library no longer ships.
  const referenceInput = document.getElementById('reference');
  const refsZone = document.getElementById('refs');
  const thumbs = document.getElementById('thumbs');
  let references = [];

  function referenceLimit() {
    return maxReferences();
  }

  function lastReference() {
    return references[references.length - 1];
  }

  function renderReferences() {
    const count = references.length;
    form.classList.toggle('has-ref', count > 0);
    referenceInput.multiple = editing();
    document.getElementById('refs-empty').hidden = count > 0;
    document.getElementById('clear-reference').hidden = count < 2;
    document.getElementById('refs-title').textContent = editing()
      ? 'Add the image to edit' : 'Start from an image';
    document.getElementById('refs-sub').textContent = editing()
      ? 'Drop, paste or choose up to ' + maxReferences() + '.'
      : 'Optional. Drop, paste or choose one.';

    thumbs.innerHTML = '';
    references.forEach(function (reference, index) {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.title = reference.name;
      const image = document.createElement('img');
      image.src = 'data:image/png;base64,' + reference.b64;
      image.alt = reference.name;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'remove';
      remove.innerHTML = icon('x');
      remove.setAttribute('aria-label', 'Remove ' + reference.name);
      remove.addEventListener('click', function (event) {
        event.stopPropagation();  // the zone opens the picker on click
        references.splice(index, 1);
        renderReferences();
      });
      thumb.append(image, remove);
      thumbs.append(thumb);
    });
    if (editing() && count && count < maxReferences()) {
      const add = document.createElement('div');
      add.className = 'add-tile';
      add.innerHTML = icon('plus');
      thumbs.append(add);
    }

    const note = document.getElementById('refs-note');
    note.hidden = count === 0;
    if (editing() && count) {
      const last = lastReference();
      note.textContent = count + ' of ' + maxReferences() + ' images. The result takes the shape of the last one'
        + (last.width ? ', ' + last.width + ' × ' + last.height + '.' : '.');
    } else if (count) {
      note.textContent = 'Drop or paste another image to replace it.';
    }
    refreshForm();
    // An empty stage says what to do next, and that depends on the references.
    if (view === null) renderStage();
  }

  function addReference(b64, name) {
    if (referenceLimit() === 1) references = [];
    if (references.length >= referenceLimit()) {
      showToast('info', 'Edit takes at most ' + maxReferences() + ' images.');
      return;
    }
    const entry = { b64: b64, name: name, width: 0, height: 0 };
    references.push(entry);
    // The estimate, the "Match" size and the progress card's shape all need the
    // pixel size, so it is read once here.
    const probe = new Image();
    probe.onload = function () {
      entry.width = probe.naturalWidth;
      entry.height = probe.naturalHeight;
      renderReferences();
    };
    probe.src = 'data:image/png;base64,' + b64;
    renderReferences();
  }

  function addFiles(files) {
    Array.from(files).filter(function (file) {
      return file.type.startsWith('image/');
    }).forEach(function (file) {
      const reader = new FileReader();
      reader.onload = function () {
        addReference(reader.result.split(',')[1], file.name);
      };
      reader.readAsDataURL(file);
    });
  }

  referenceInput.addEventListener('change', function () {
    addFiles(referenceInput.files);
    referenceInput.value = '';
  });
  refsZone.addEventListener('click', function () { referenceInput.click(); });
  refsZone.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    event.preventDefault();
    referenceInput.click();
  });
  refsZone.addEventListener('dragover', function (event) {
    event.preventDefault();
    refsZone.classList.add('over');
  });
  refsZone.addEventListener('dragleave', function () { refsZone.classList.remove('over'); });
  refsZone.addEventListener('drop', function (event) {
    event.preventDefault();
    refsZone.classList.remove('over');
    addFiles(event.dataTransfer.files);
  });
  document.addEventListener('paste', function (event) {
    const files = event.clipboardData ? event.clipboardData.files : [];
    if (!files.length) return;  // a text paste goes to the field as usual
    event.preventDefault();
    addFiles(files);
  });
  document.getElementById('clear-reference').addEventListener('click', function () {
    references = [];
    renderReferences();
  });

  // ---- Size -----------------------------------------------------------------
  // The hidden selects stay the form fields, filled by the server as before.
  // The chips only drive them, so the request is exactly what it was.
  const sizeOptions = Array.from(sizeSelect.options).filter(function (option) {
    return option.value !== 'match';
  }).map(function (option) {
    const parts = option.value.split('x').map(Number);
    const named = option.textContent.match(/\((\d+:\d+)\)/);
    return { value: option.value, width: parts[0], height: parts[1],
             ratio: parts[0] === parts[1] ? '1:1' : (named ? named[1] : parts[0] + ':' + parts[1]) };
  });
  const ratios = [];
  sizeOptions.forEach(function (option) {
    if (ratios.indexOf(option.ratio) < 0) ratios.push(option.ratio);
  });

  function glyph(ratio) {
    if (ratio === 'match') return '<span class="glyph"><i class="dashed" style="width:13px;height:13px"></i></span>';
    const parts = ratio.split(':').map(Number);
    const wide = parts[0] >= parts[1];
    const width = wide ? 16 : Math.round(16 * parts[0] / parts[1]);
    const height = wide ? Math.round(16 * parts[1] / parts[0]) : 16;
    return '<span class="glyph"><i style="width:' + width + 'px;height:' + height + 'px"></i></span>';
  }

  function currentOption() {
    return sizeOptions.find(function (option) { return option.value === sizeSelect.value; });
  }

  function setSelect(select, value) {
    select.value = value;
    select.dispatchEvent(new Event('change', { bubbles: true }));
  }

  function pickRatio(ratio) {
    if (ratio === 'match') return setSelect(sizeSelect, 'match');
    const current = currentOption();
    if (current && current.ratio === ratio) return;
    // A new shape starts at the tier nearest 1 MP, where the model was trained.
    const group = sizeOptions.filter(function (option) { return option.ratio === ratio; });
    const preferred = group.slice().sort(function (a, b) {
      return Math.abs(a.width * a.height - 1048576) - Math.abs(b.width * b.height - 1048576);
    })[0];
    setSelect(sizeSelect, preferred.value);
  }

  function buildSizeControls() {
    const chips = document.getElementById('size-chips');
    ratios.concat(['match']).forEach(function (ratio) {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.ratio = ratio;
      chip.innerHTML = glyph(ratio) + '<span>' + (ratio === 'match' ? 'Match' : ratio) + '</span>';
      chip.addEventListener('click', function () { pickRatio(ratio); });
      chips.append(chip);
    });
    const edits = document.getElementById('edit-sizes');
    Array.from(resolutionSelect.options).sort(function (a, b) {
      return (a.value === 'match' ? 0 : Number(a.value)) - (b.value === 'match' ? 0 : Number(b.value));
    }).forEach(function (option) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'num';
      button.dataset.value = option.value;
      button.textContent = option.value === 'match' ? 'Match' : option.value;
      button.addEventListener('click', function () { setSelect(resolutionSelect, option.value); });
      edits.append(button);
    });
  }

  // The sizes of the chosen shape, smallest first, labelled by their pixels.
  function renderTiers(ratio) {
    const tiers = document.getElementById('tier-sizes');
    tiers.hidden = ratio === 'match';
    tiers.innerHTML = '';
    sizeOptions.filter(function (option) { return option.ratio === ratio; })
      .sort(function (a, b) { return a.width * a.height - b.width * b.height; })
      .forEach(function (option) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'num';
        button.textContent = option.width + '\u00d7' + option.height;
        button.setAttribute('aria-pressed', String(option.value === sizeSelect.value));
        button.addEventListener('click', function () { setSelect(sizeSelect, option.value); });
        tiers.append(button);
      });
  }

  // A resolution param sets pixels only, and the shape follows the reference.
  // A size param sets both. Which one a mode has decides the size, not the mode.
  function followsReference() {
    return Boolean(paramSpec('resolution'));
  }

  function editResolution() {
    const chosen = resolutionSelect.value;
    if (chosen !== 'match') return Number(chosen);
    const reference = lastReference();
    if (!reference || !reference.width) return 1024;
    const side = Math.round(Math.sqrt(reference.width * reference.height));
    const cap = currentMode().estimate && currentMode().estimate.match_cap;
    return cap ? Math.min(side, cap) : side;
  }

  function renderSize() {
    const current = currentOption();
    const ratio = current ? current.ratio : 'match';
    document.querySelectorAll('#size-chips .chip').forEach(function (chip) {
      chip.setAttribute('aria-pressed', String(chip.dataset.ratio === ratio));
    });
    renderTiers(ratio);
    document.querySelectorAll('#edit-sizes button').forEach(function (button) {
      button.setAttribute('aria-pressed', String(button.dataset.value === resolutionSelect.value));
    });
    const caption = document.getElementById('size-caption');
    const reference = lastReference();
    if (followsReference()) {
      caption.textContent = reference && reference.width
        ? 'about ' + editResolution() + ' px, shape follows the image'
        : 'shape follows the image';
    } else if (current) {
      caption.textContent = current.width + ' × ' + current.height;
    } else {
      caption.textContent = reference ? 'reference shape, about 1 MP' : '1024 × 1024 until you add an image';
    }
  }

  // The shape the next image will have, for the progress card and its frame.
  function targetRatio() {
    const reference = lastReference();
    const referenceRatio = reference && reference.width ? reference.width / reference.height : 1;
    if (followsReference()) return referenceRatio;
    const current = currentOption();
    return current ? current.width / current.height : referenceRatio;
  }

  // ---- Count, steps, seed ------------------------------------------------------
  const countToggle = document.getElementById('count-toggle');
  const countMenu = document.getElementById('count-menu');

  function clampCount() {
    const value = Math.min(MAX_BATCH, Math.max(1, parseInt(countInput.value, 10) || 1));
    countInput.value = value;
    document.getElementById('count-shown').textContent = '×' + value;
    countToggle.setAttribute('aria-label', value + (value === 1 ? ' image' : ' images') + ', change the count');
    return value;
  }

  // The count is part of the run button, so it reads as "Generate ×2". The menu
  // opens on the current count, marked with a check.
  function openCount() {
    const current = clampCount();
    countMenu.replaceChildren();
    for (let count = 1; count <= MAX_BATCH; count++) {
      const option = menuItem('check', count + (count === 1 ? ' image' : ' images'), function () {
        countInput.value = count;
        clampCount();
        refreshForm();
        countToggle.focus();
      });
      option.setAttribute('role', 'menuitemradio');
      option.setAttribute('aria-checked', String(count === current));
      countMenu.append(option);
    }
    toggleMenu(countMenu);
    if (!countMenu.hidden) countMenu.querySelector('[aria-checked=true]').focus();
  }
  countToggle.addEventListener('click', openCount);

  document.getElementById('random-seed').addEventListener('click', function () {
    document.getElementById('seed').value = '';
    refreshForm();
  });

  function renderAdvancedValues() {
    const steps = document.getElementById('steps').value;
    const seed = document.getElementById('seed').value.trim();
    const scale = editing()
      ? 'CFG ' + document.getElementById('cfg').value
      : 'guidance ' + document.getElementById('guidance').value;
    const negative = document.getElementById('negative').value.trim() ? ', negative prompt' : '';
    document.getElementById('advanced-values').textContent =
      steps + ' steps, ' + scale + ', ' + (seed ? 'seed ' + seed : 'random seed') + negative;
    document.getElementById('steps-value').textContent = steps;
    document.getElementById('strength-value').textContent =
      Number(document.getElementById('strength').value).toFixed(2);
  }

  // ---- Estimate and the run button -----------------------------------------
  // Cost, before you spend it. The backend gives seconds per step at one
  // megapixel and how that grows with size; its adapter holds the measurements.
  // A mode without an estimate shows no time.

  // The backend's constants fit one machine. Once a run shows its real step
  // rate, that rate, brought back to one megapixel, replaces the constant for
  // the next estimate on this device. It comes from the live steps, not from
  // the time an image took, which also holds one-off loads. Guidance above 1
  // runs two passes per step, so those runs learn apart. Tab memory only.
  const learnedCost = {};
  let runKey = null;
  let runPixels = 0;
  let runEstimate = null;   // the estimate model of the mode in flight
  let runStepSeconds = 0;   // the pre-run guess per step, until real steps arrive
  let runRatio = 1;         // the shape of the image in flight, whatever the form says now

  function costKey() {
    const scaleParam = paramSpec('cfg') ? 'cfg' : paramSpec('guidance') ? 'guidance' : '';
    const scale = scaleParam ? Number(document.getElementById(scaleParam).value) : 1;
    return STUDIO.backend.id + ' ' + currentMode().id + (scale > 1 ? ' two-pass' : '');
  }

  function targetPixels() {
    if (followsReference()) return Math.pow(editResolution(), 2);
    const current = currentOption();
    return current ? current.width * current.height : 1024 * 1024;
  }

  // Seconds per step for the form as it stands, from what this device has
  // shown so far or else from the backend's constants.
  function stepSeconds() {
    const model = currentMode().estimate;
    if (!model) return 0;
    const cost = learnedCost[costKey()] || model.step_cost;
    return cost * Math.pow(targetPixels() / 1e6, model.exponent);
  }

  function estimate() {
    const count = clampCount();
    const images = count > 1 ? count + ' images' : '';
    const model = currentMode().estimate;
    if (!model || !paramSpec('steps')) return images;
    const steps = Number(document.getElementById('steps').value) || 0;
    const perStep = stepSeconds();
    const overhead = model.overhead_per_image ? count * model.overhead : model.overhead;
    const time = 'about ' + spell(count * steps * perStep + overhead);
    return images ? images + ', ' + time : time;
  }

  // What stops a run, said on the button itself rather than as an error after.
  function blocker() {
    if (editing() && !references.length) return 'Add an image to edit';
    if (!promptInput.value.trim()) return editing() ? 'Describe the change' : 'Write a prompt';
    if (PLACEHOLDER.test(promptInput.value)) return 'Fill in the [brackets]';
    return '';
  }

  function renderRunButton() {
    if (busy()) return;
    const reason = blocker();
    go.disabled = Boolean(reason);
    goSub.textContent = reason || estimate();
  }

  function refreshForm() {
    renderSize();
    renderAdvancedValues();
    renderRunButton();
  }

  function growPrompt() {
    promptInput.style.height = 'auto';
    promptInput.style.height = Math.min(promptInput.scrollHeight + 2, 320) + 'px';
  }
  promptInput.addEventListener('input', growPrompt);

  // Templates come from the backend, tuned on its model.
  const PLACEHOLDER = /\[[^\]\n]+\]/;
  const templatesToggle = document.getElementById('templates-toggle');
  const templatesMenu = document.getElementById('templates');

  // The list is rebuilt on each open, because it follows the current mode. The
  // header and the hint are not items, so arrow keys and Tab skip them.
  function openTemplates() {
    templatesMenu.replaceChildren();
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = editing() ? 'Start an edit from a template' : 'Start from a template';
    templatesMenu.append(head);
    currentMode().templates.forEach(function (template) {
      const option = menuItem('', template.name, function () { useTemplate(template.text); });
      const note = document.createElement('span');
      note.className = 'item-note';
      note.textContent = template.hint;
      option.querySelector('.item-text').append(note);
      templatesMenu.append(option);
    });
    const foot = document.createElement('div');
    foot.className = 'menu-foot';
    foot.textContent = 'Press Tab to jump to the next [bracket].';
    templatesMenu.append(foot);
    toggleMenu(templatesMenu);
  }

  function useTemplate(text) {
    promptInput.value = text;
    growPrompt();
    refreshForm();
    promptInput.focus();
    selectPlaceholder(0);
  }

  // Selects the next [placeholder] at or after a position, so typing replaces
  // it. Returns false when none is left, and Tab then moves focus as usual.
  function selectPlaceholder(from) {
    const found = PLACEHOLDER.exec(promptInput.value.slice(from));
    if (!found) return false;
    promptInput.setSelectionRange(from + found.index, from + found.index + found[0].length);
    return true;
  }

  templatesToggle.addEventListener('click', function () {
    if (templatesMenu.hidden) openTemplates(); else closeMenus();
  });
  promptInput.addEventListener('keydown', function (event) {
    if (event.key !== 'Tab' || event.shiftKey) return;
    if (selectPlaceholder(promptInput.selectionEnd)) event.preventDefault();
  });
  form.addEventListener('input', refreshForm);
  form.addEventListener('change', refreshForm);

  // The mode only changes what the form looks like. The route stays /generate,
  // which dispatches on the mode field. Swapping hx-post here does not work:
  // htmx resolves the route when it first processes the element, so a later
  // setAttribute is ignored and every edit went to the generate engine.
  // The references are cleared, because the two modes read them differently:
  // a list built for an edit would silently shrink to its first image. The
  // prompt is cleared too: a scene description is not an edit instruction.
  // ---- Look -------------------------------------------------------------------
  // Each choice adds one sentence after the prompt, at run time only, so the
  // prompt field, the caption and Reuse prompt keep the user's own text. The
  // rows and their wording come from the backend, tuned on its model.
  let look = {};            // row name to the labels picked in it

  function lookRows() {
    return currentMode().looks;
  }

  function lookText() {
    return lookRows().map(function (row) {
      const picked = row.options.find(function (option) { return (look[row.name] || []).includes(option[0]); });
      return picked ? picked[1] : '';
    }).filter(Boolean).join(' ');
  }

  function lookLabels() {
    return lookRows().flatMap(function (row) { return look[row.name] || []; });
  }

  function pickLook(row, label) {
    const had = (look[row.name] || []).includes(label);
    look[row.name] = had ? [] : [label];
    renderLook();
  }

  function renderLook() {
    const rows = document.getElementById('look-rows');
    rows.replaceChildren();
    lookRows().forEach(function (row) {
      const line = document.createElement('div');
      line.className = 'look-row';
      const name = document.createElement('span');
      name.className = 'label';
      name.textContent = row.name;
      const chips = document.createElement('div');
      chips.className = 'look-chips';
      row.options.forEach(function ([label]) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.textContent = label;
        chip.setAttribute('aria-pressed', String((look[row.name] || []).includes(label)));
        chip.addEventListener('click', function () { pickLook(row, label); });
        chips.append(chip);
      });
      line.append(name, chips);
      rows.append(line);
    });
    const labels = lookLabels();
    document.getElementById('look-values').textContent = labels.length ? labels.join(', ') : 'none';
    const adds = document.getElementById('look-adds');
    const added = lookText();
    adds.replaceChildren(added ? 'Adds after your prompt: ' : 'Pick any to add a line after your prompt.');
    if (added) {
      const quote = document.createElement('q');
      quote.textContent = added;
      adds.append(quote);
    }
  }

  // The prompt as the model gets it: the user's text, closed as a sentence,
  // then the look.
  function withLook(prompt) {
    const added = lookText();
    if (!added) return prompt;
    return (/[.!?。！？]$/.test(prompt) ? prompt : prompt + '.') + ' ' + added;
  }

  function applyMode() {
    form.classList.toggle('mode-edit', editing());
    form.classList.toggle('mode-generate', !editing());
    promptInput.placeholder = currentMode().prompt_hint;
    document.getElementById('templates-toggle').hidden = !currentMode().templates.length;
    document.getElementById('look').hidden = !currentMode().looks.length;
    applyParams();
  }
  form.querySelectorAll('input[name=mode]').forEach(function (radio) {
    radio.addEventListener('change', function () {
      applyMode();
      closeMenus();
      references = [];
      promptInput.value = '';
      look = {};
      renderLook();
      growPrompt();
      renderReferences();
      // The run in flight is not this form's, so its frame stays as it is.
      if (view !== 'progress') renderStage();
    });
  });

  // ---- Gallery ----------------------------------------------------------------
  // The gallery lives in this tab only. The server keeps no image after it
  // answers and the page keeps them in memory, so a reload clears them and
  // nothing reaches disk. Download is the way to keep one.
  const canvas = document.getElementById('canvas');
  const stageBar = document.getElementById('stage-bar');
  const strip = document.getElementById('strip');
  let gallery = [];
  let view = null;          // an image id, or 'progress' while a run is shown
  let arrivedId = null;     // the image to fade in once, on arrival
  let nextId = 1;
  let batchSource = null;   // the source of a one-image edit, for before and after
  let runLook = null;       // the run's own prompt and look, apart from what the model got

  // Each image is shown by a blob URL. As a data URL, every img that showed it
  // made the browser parse megabytes of base64 text again. The base64 stays on
  // the entry for the moment the image goes back to the server as a reference.
  function blobUrl(dataUrl) {
    const comma = dataUrl.indexOf(',');
    const binary = atob(dataUrl.slice(comma + 1));
    const bytes = new Uint8Array(binary.length);
    for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
    const type = dataUrl.slice(5, dataUrl.indexOf(';'));
    return URL.createObjectURL(new Blob([bytes], { type: type }));
  }

  // A batch of edits shares one source, so it is freed with the last of them.
  function release(entry) {
    URL.revokeObjectURL(entry.src);
    const shared = entry.before === batchSource || gallery.some(function (other) {
      return other.before === entry.before;
    });
    if (entry.before && !shared) URL.revokeObjectURL(entry.before);
  }

  function harvest() {
    incoming.querySelectorAll('.item').forEach(function (node) {
      const data = node.dataset;
      const source = node.querySelector('img').src;
      const entry = {
        id: nextId++, src: blobUrl(source), b64: source.split(',')[1], seed: data.seed,
        width: data.width, height: data.height, steps: data.steps, elapsed: data.elapsed,
        position: data.position, mode: data.mode, prompt: data.prompt, look: null,
        before: data.mode === 'edit' ? batchSource : null,
      };
      if (runLook && data.prompt === runLook.sent) {
        entry.prompt = runLook.prompt;
        if (runLook.labels.length) entry.look = runLook;
      }
      gallery.unshift(entry);
      arrivedId = entry.id;
      if (view !== 'progress') view = entry.id;
      node.remove();
    });
    incoming.querySelectorAll(':scope > .err, :scope > .hint').forEach(function (node) {
      showToast(node.classList.contains('err') ? 'error' : 'info', node.textContent);
      node.remove();
    });
    // The last image of a batch arrives by a chain placeholder, and removing it
    // here detaches the node htmx then fires afterSettle on, so that event never
    // reaches the body. The run ends here instead, once no link is left.
    // stopWork renders, and a second render would restart the arrival fade.
    if (busy() && !incoming.querySelector('.chain')) return stopWork();
    renderStrip();
    renderStage();
  }

  // Answers arrive by several routes: the form's own request, and each chain
  // placeholder replacing itself. Watching the container catches all of them.
  new MutationObserver(function (records) {
    if (records.some(function (record) { return record.addedNodes.length; })) harvest();
  }).observe(incoming, { childList: true, subtree: true });

  function selected() {
    return gallery.find(function (entry) { return entry.id === view; });
  }

  // A frame's number, as printed on the film's edge.
  function frameNumber(id) {
    return String(id).padStart(2, '0');
  }

  // The pencil loop, one hand-drawn stroke that overlaps where it closes.
  const MARK = '<svg class="mark" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
    + '<path pathLength="1" d="M58 5 C80 5 97 16 98 44 C99 74 84 95 52 96 C20 97 3 80 2 52'
    + ' C1 24 18 7 44 4 C52 3 62 4 70 7"/></svg>';
  let markedId = null;      // the frame the loop was last drawn on, so it draws once
  const frames = new Map(); // image id to its frame, built once so no redraw reloads an image
  let pendingFrame = null;

  function show(id) {
    view = id;
    renderStrip();
    renderStage();
  }

  function pendingNode() {
    if (!pendingFrame) {
      pendingFrame = document.createElement('button');
      pendingFrame.type = 'button';
      pendingFrame.className = 'frame pending';
      pendingFrame.setAttribute('aria-label', 'Show the image in progress');
      pendingFrame.innerHTML = '<span class="still waiting"><span class="exposure"></span></span><span class="no"></span>';
      pendingFrame.addEventListener('click', function () { show('progress'); });
    }
    pendingFrame.querySelector('.still').style.width = Math.round(64 * Math.min(2, Math.max(0.5, runRatio))) + 'px';
    pendingFrame.querySelector('.no').textContent = frameNumber(nextId);
    return pendingFrame;
  }

  function frameNode(entry) {
    if (frames.has(entry.id)) return frames.get(entry.id);
    const frame = document.createElement('button');
    frame.type = 'button';
    frame.className = 'frame' + (entry.id === arrivedId ? ' arrive' : '');
    frame.title = 'Seed ' + entry.seed;
    frame.setAttribute('aria-label', entry.mode + ', seed ' + entry.seed);
    frame.innerHTML = '<span class="still"><img alt="" src="' + entry.src + '">'
      + (entry.mode === 'edit' ? '<span class="corner">' + icon('brush') + '</span>' : '')
      + '</span><span class="no">' + frameNumber(entry.id) + '</span>';
    frame.addEventListener('click', function () { show(entry.id); });
    frames.set(entry.id, frame);
    return frame;
  }

  // Frames never change order, so the ones kept are already in place. Only a
  // gone frame comes out and only a new one goes in. A moved node would restart
  // its entrance and reload its image.
  function placeFrames(wanted) {
    Array.from(strip.children).forEach(function (frame) {
      if (!wanted.includes(frame)) frame.remove();
    });
    let cursor = strip.firstElementChild;
    wanted.forEach(function (frame) {
      if (frame === cursor) cursor = cursor.nextElementSibling;
      else strip.insertBefore(frame, cursor);
    });
  }

  function markSelected() {
    strip.querySelectorAll('.mark').forEach(function (mark) { mark.remove(); });
    strip.querySelectorAll('.selected').forEach(function (frame) { frame.classList.remove('selected'); });
    const chosen = view === 'progress' ? pendingFrame : frames.get(view);
    if (chosen && chosen.isConnected) {
      chosen.classList.add('selected');
      chosen.insertAdjacentHTML('beforeend', MARK);
      chosen.querySelector('.mark').classList.toggle('draw', view !== 'progress' && markedId !== view);
    }
    markedId = view;
  }

  function renderStrip() {
    const wrap = document.getElementById('strip-wrap');
    wrap.hidden = !gallery.length && !busy();
    const wanted = gallery.map(frameNode);
    if (busy()) wanted.unshift(pendingNode());
    placeFrames(wanted);
    frames.forEach(function (frame, id) {
      if (!frame.isConnected) frames.delete(id);
    });
    markSelected();
    const count = gallery.length;
    document.getElementById('strip-note').innerHTML = count
      ? count + (count === 1 ? ' image' : ' images') + ' in this tab.'
        + '<span class="wide-only"> Download the ones you want to keep.</span>'
      : 'Images stay in this tab only.';
    document.getElementById('clear-gallery').hidden = !count;
    renderProgress();
  }

  function renderStage() {
    canvas.innerHTML = '';
    stageBar.hidden = true;
    if (view === 'progress' && busy()) {
      const card = document.createElement('div');
      card.className = 'card';
      const now = progressNow();
      paintPlate(card, now.running, now.percent);
      card.innerHTML = '<div class="plate"><div class="exposure"></div>'
        + '<div class="lines"><span class="percent num"></span><strong class="num" data-slot="step"></strong>'
        + '<span class="num" data-slot="image"></span><span class="num" data-slot="left"></span></div></div>'
        + '<div class="edge"><span>' + EDGE_NAME + '</span><span>' + frameNumber(nextId) + '</span></div>';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'btn';
      cancel.textContent = 'Cancel';
      cancel.addEventListener('click', requestCancel);
      card.querySelector('.plate').append(cancel);
      canvas.append(card);
      fitStage();
      renderProgress();
      return;
    }
    const entry = selected();
    if (!entry) return renderEmpty();
    const shot = document.createElement('div');
    shot.className = 'shot' + (entry.id === arrivedId ? ' arrive' : '');
    const pic = document.createElement('div');
    pic.className = 'pic';
    pic.dataset.ratio = entry.width / entry.height;
    const image = document.createElement('img');
    image.src = entry.src;
    image.alt = entry.prompt;
    pic.append(image);
    if (entry.before) renderCompare(pic, entry);
    const edge = document.createElement('div');
    edge.className = 'edge';
    edge.innerHTML = '<span>' + EDGE_NAME + '</span><span>' + frameNumber(entry.id) + '</span>';
    shot.append(pic, edge);
    canvas.append(shot);
    arrivedId = null;
    // The bar takes its height from the stage, so the shot is fitted after it.
    renderStageBar(entry);
    fitStage();
  }

  // An empty stage names the next step and offers it as a button.
  function renderEmpty() {
    const empty = document.createElement('div');
    empty.className = 'empty';
    const title = document.createElement('strong');
    const line = document.createElement('p');
    const start = document.createElement('button');
    start.type = 'button';
    start.className = 'btn';
    if (editing() && references.length) {
      title.textContent = 'Ready to edit';
      line.textContent = 'Say what to change, then press Edit.';
      empty.append(title, line);
      canvas.append(empty);
      return;
    }
    if (editing()) {
      title.textContent = 'Edit an image';
      line.textContent = 'Add the image, then say what to change.';
      start.innerHTML = icon('image-in') + 'Choose an image';
      start.addEventListener('click', function () { referenceInput.click(); });
    } else if (!currentMode().templates.length) {
      title.textContent = 'Nothing here yet';
      line.textContent = 'Write a prompt and press Generate.';
      empty.append(title, line);
      canvas.append(empty);
      return;
    } else {
      title.textContent = 'Nothing here yet';
      line.textContent = 'Write a prompt and press Generate, or start from a template.';
      start.innerHTML = icon('layout') + 'Browse templates';
      start.addEventListener('click', function (event) {
        event.stopPropagation();  // the click would reach the document and close the menu
        openTemplates();
      });
    }
    empty.append(title, line, start);
    canvas.append(empty);
  }

  // The first time an edit shows, the divider sweeps in from the left edge,
  // which shows it can be dragged. After that it opens at the middle.
  function renderCompare(pic, entry) {
    const before = document.createElement('img');
    before.className = 'before';
    before.src = entry.before;
    before.alt = 'The image before the edit';
    const range = document.createElement('input');
    range.type = 'range';
    range.className = 'compare-range';
    range.min = '0';
    range.max = '100';
    range.setAttribute('aria-label', 'Compare before and after');
    const divider = document.createElement('div');
    divider.className = 'divider';
    divider.innerHTML = icon('grip');
    const left = document.createElement('span');
    left.className = 'compare-tag left';
    left.textContent = 'Before';
    const right = document.createElement('span');
    right.className = 'compare-tag right';
    right.textContent = 'After';
    function split() { pic.style.setProperty('--split', range.value + '%'); }
    range.addEventListener('input', split);
    pic.append(before, range, divider, left, right);
    range.value = '50';
    split();
    if (entry.swept || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    entry.swept = true;
    sweep(range, split);
  }

  function sweep(range, split) {
    const delay = 900;      // after the print has mostly developed
    const length = 650;
    let start = null;
    range.value = '0';
    split();
    requestAnimationFrame(function frame(now) {
      if (!range.isConnected || range.dataset.touched) return;
      if (start === null) start = now + delay;
      const progress = Math.min(1, Math.max(0, (now - start) / length));
      range.value = String(Math.round(50 * (1 - Math.pow(1 - progress, 3))));
      split();
      if (progress < 1) requestAnimationFrame(frame);
    });
    range.addEventListener('pointerdown', function () { range.dataset.touched = '1'; }, { once: true });
    range.addEventListener('keydown', function () { range.dataset.touched = '1'; }, { once: true });
  }

  function renderStageBar(entry) {
    stageBar.hidden = false;
    stageBar.innerHTML = '';
    const about = document.createElement('div');
    about.className = 'about';
    const facts = document.createElement('div');
    facts.className = 'facts num';
    const mode = document.createElement('span');
    mode.className = 'mode';
    mode.textContent = entry.mode === 'edit' ? 'Edit' : 'Generate';
    facts.append(mode);
    [entry.position === '1 image' ? '' : 'Image ' + entry.position,
     'Seed ' + entry.seed, entry.width + ' × ' + entry.height,
     entry.steps + ' steps', entry.elapsed + 's',
     entry.look ? 'Look: ' + entry.look.labels.join(', ') : ''].forEach(function (text) {
      if (!text) return;
      const fact = document.createElement('span');
      fact.textContent = text;
      facts.append(fact);
    });
    // The prompt leads, as the frame's caption; the facts sit quietly under it.
    const prompt = document.createElement('p');
    prompt.className = 'prompt-line';
    prompt.textContent = entry.prompt;
    prompt.title = entry.prompt;
    about.append(prompt, facts);

    // Every action is page state only; nothing is sent until the next run.
    const actions = document.createElement('div');
    actions.className = 'actions';
    // Edit this and Download are the two next steps people take; the reuse
    // actions are rarer, so they wait behind More to keep the row short.
    const more = document.createElement('div');
    more.className = 'menu-anchor';
    const moreToggle = iconButton('more', 'More actions', function () { toggleMenu(moreMenu); });
    moreToggle.setAttribute('aria-controls', 'more-menu');
    moreToggle.setAttribute('aria-expanded', 'false');
    const moreMenu = document.createElement('div');
    moreMenu.className = 'menu up';
    moreMenu.id = 'more-menu';
    moreMenu.setAttribute('role', 'menu');
    moreMenu.hidden = true;
    moreMenu.append(
      menuItem('image-in', 'Use as reference', function () {
        addReference(entry.b64, 'Seed ' + entry.seed);
      }),
      menuItem('hash', 'Reuse seed ' + entry.seed, function () {
        document.getElementById('seed').value = entry.seed;
        document.getElementById('advanced').open = true;
        refreshForm();
      }),
      menuItem('text', 'Reuse prompt', function () {
        promptInput.value = entry.prompt;
        if (entry.mode === (editing() ? 'edit' : 'generate')) {
          look = entry.look ? JSON.parse(JSON.stringify(entry.look.picks)) : {};
          renderLook();
        }
        growPrompt();
        refreshForm();
        promptInput.focus();
      })
    );
    more.append(moreToggle, moreMenu);
    const download = document.createElement('a');
    download.className = 'icon-btn';
    download.href = entry.src;
    download.download = STUDIO.backend.id + '-' + entry.mode + '-' + entry.seed + '.png';
    download.title = 'Download';
    download.setAttribute('aria-label', 'Download');
    download.innerHTML = icon('download');
    const rule = document.createElement('span');
    rule.className = 'rule';
    actions.append(textButton('brush', 'Edit this', function () { editThis(entry); }), more,
      rule, download,
      iconButton('trash', 'Remove from this tab', function () { removeEntry(entry.id); }, 'danger'));
    if (document.fullscreenEnabled) {
      actions.append(document.fullscreenElement
        ? iconButton('shrink', 'Exit full screen (F)', toggleFullscreen)
        : iconButton('expand', 'Full screen (F)', toggleFullscreen));
    }
    stageBar.append(about, actions);
  }

  // ---- Menus -----------------------------------------------------------------
  // One menu is open at most. A click outside or Escape closes it, and Escape
  // returns focus to the button that opened it.
  function toggleMenu(menu) {
    const opening = menu.hidden;
    closeMenus();
    if (!opening) return;
    menu.hidden = false;
    menuToggle(menu).setAttribute('aria-expanded', 'true');
    menu.querySelector('button').focus();
  }

  function menuToggle(menu) {
    return document.querySelector('[aria-controls="' + menu.id + '"]');
  }

  function closeMenus() {
    document.querySelectorAll('.menu:not([hidden])').forEach(function (menu) {
      menu.hidden = true;
      const toggle = menuToggle(menu);
      if (toggle) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  function menuItem(name, label, handler) {
    const item = document.createElement('button');
    item.type = 'button';
    item.setAttribute('role', 'menuitem');
    item.innerHTML = (name ? icon(name) : '') + '<span class="item-text"></span>';
    item.querySelector('.item-text').textContent = label;
    item.addEventListener('click', function () {
      closeMenus();
      handler();
    });
    return item;
  }

  document.addEventListener('click', function (event) {
    if (event.target.closest('.menu, [aria-controls]')) return;
    closeMenus();
  });
  document.addEventListener('keydown', function (event) {
    const open = document.querySelector('.menu:not([hidden])');
    if (!open) return;
    if (event.key === 'Escape') {
      closeMenus();
      menuToggle(open).focus();
      return;
    }
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    event.preventDefault();
    const items = Array.from(open.querySelectorAll('button'));
    const step = event.key === 'ArrowDown' ? 1 : -1;
    const index = items.indexOf(document.activeElement);
    items[(index + step + items.length) % items.length].focus();
  });

  // Edit mode with this image as the only reference, an empty prompt, and the
  // image's own seed, so a rerun of the same edit gives the same result.
  function editThis(entry) {
    const editRadio = document.getElementById('mode-edit');
    if (!editRadio.checked) {
      editRadio.checked = true;
      editRadio.dispatchEvent(new Event('change', { bubbles: true }));
    }
    references = [];
    promptInput.value = '';
    growPrompt();
    document.getElementById('seed').value = entry.seed;
    addReference(entry.b64, 'Seed ' + entry.seed);
    view = entry.id;
    renderStage();
    promptInput.focus();
  }

  function textButton(name, label, handler) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'btn quiet';
    button.innerHTML = icon(name) + label;
    button.addEventListener('click', handler);
    return button;
  }

  function iconButton(name, label, handler, extra) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon-btn' + (extra ? ' ' + extra : '');
    button.title = label;
    button.setAttribute('aria-label', label);
    button.innerHTML = icon(name);
    button.addEventListener('click', handler);
    return button;
  }

  // The card takes the shape of the coming image, fitted inside the stage the
  // way the image itself will be.
  const REBATE_WIDTH = 20;   // the film's left and right rebate together
  const REBATE_HEIGHT = 34;  // top and bottom, the bottom holding the edge print

  function fitBox(box, ratio, share) {
    const width = Math.min((canvas.clientWidth - 48 - REBATE_WIDTH) * share,
      (canvas.clientHeight - 48 - REBATE_HEIGHT) * share * ratio);
    box.style.width = Math.round(width) + 'px';
    box.style.height = Math.round(width / ratio) + 'px';
  }

  function fitStage() {
    const plate = canvas.querySelector('.card .plate');
    if (plate) fitBox(plate, runRatio, 0.9);
    const pic = canvas.querySelector('.pic');
    if (pic) fitBox(pic, Number(pic.dataset.ratio), 1);
  }
  window.addEventListener('resize', fitStage);

  function removeEntry(id) {
    const index = gallery.findIndex(function (entry) { return entry.id === id; });
    release(gallery.splice(index, 1)[0]);
    const neighbour = gallery[Math.min(index, gallery.length - 1)];
    view = neighbour ? neighbour.id : null;
    renderStrip();
    renderStage();
  }

  document.getElementById('clear-gallery').addEventListener('click', function () {
    if (!confirm('Remove all ' + gallery.length + ' images from this tab?')) return;
    const cleared = gallery;
    gallery = [];
    cleared.forEach(release);
    view = busy() ? 'progress' : null;
    renderStrip();
    renderStage();
  });

  // ---- Toasts -----------------------------------------------------------------
  // Errors stay until closed, because they say what to fix. Anything else
  // clears itself.
  const toasts = document.getElementById('toasts');
  function showToast(kind, text) {
    const toast = document.createElement('div');
    toast.className = 'toast ' + kind;
    toast.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    const message = document.createElement('p');
    message.textContent = text;
    toast.innerHTML = icon(kind === 'error' ? 'alert' : 'info');
    toast.append(message, iconButton('x', 'Dismiss', function () { toast.remove(); }));
    toasts.append(toast);
    if (kind !== 'error') setTimeout(function () { toast.remove(); }, 4000);
  }

  // ---- Run, progress, cancel --------------------------------------------------
  // The poller clocks itself off its own response, and stops when the server
  // says nothing is running. That gap happens between two images of a batch, so
  // every request the page sends plants a fresh poller.
  const POLLER = '<div hx-get="/progress" hx-trigger="load"'
    + ' hx-target="#progress" hx-swap="innerHTML"></div>';
  let progressState = null;
  let pace = null;          // how fast this run's steps arrive, for the time left

  function startWork(element) {
    const fresh = element === form;
    document.body.classList.add('busy');
    go.disabled = true;
    countToggle.disabled = true;
    document.getElementById('go-busy').textContent = editing() ? 'Editing' : 'Generating';
    progressSlot.innerHTML = POLLER;
    htmx.process(progressSlot);
    if (fresh) {
      runKey = costKey();
      runPixels = targetPixels();
      runEstimate = currentMode().estimate;
      runRatio = targetRatio();
      runStepSeconds = stepSeconds();
      view = 'progress';
      progressState = null;
      pace = null;
      renderStrip();
      renderStage();
    }
  }

  // The tab title shows the progress, so a run can be watched from another tab.
  // A run that ends in the background leaves "Done" until the tab is seen.
  const BASE_TITLE = document.title;
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !busy()) document.title = BASE_TITLE;
  });

  function stopWork() {
    if (!busy()) return;
    document.title = (document.hidden ? '(Done) ' : '') + BASE_TITLE;
    document.body.classList.remove('busy', 'stopping');
    progressSlot.innerHTML = '';
    progressState = null;
    goFill.style.width = '0';
    countToggle.disabled = false;
    if (view === 'progress') view = gallery.length ? gallery[0].id : null;
    renderStrip();
    renderStage();
    renderRunButton();
  }

  function requestCancel() {
    if (document.body.classList.contains('stopping')) return;
    document.body.classList.add('stopping');
    renderProgress();
    htmx.ajax('POST', '/cancel', { swap: 'none' });
  }

  // ---- Full screen ------------------------------------------------------------
  // The stage and the sheet fill the screen. F toggles it, the arrow keys walk
  // the sheet, and Escape leaves by the browser's own rule.
  const work = document.querySelector('.work');

  function toggleFullscreen() {
    const change = document.fullscreenElement ? document.exitFullscreen() : work.requestFullscreen();
    change.catch(function (error) { showToast('error', 'Full screen failed: ' + error.message); });
  }
  document.addEventListener('fullscreenchange', renderStage);

  function stepFrame(delta) {
    const order = (busy() ? ['progress'] : []).concat(gallery.map(function (entry) { return entry.id; }));
    const index = order.indexOf(view);
    const next = order[index + delta];
    if (next === undefined) return;
    show(next);
    strip.querySelector('.selected').scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  document.addEventListener('keydown', function (event) {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    if (event.target.closest('input, textarea, select, [contenteditable]')) return;
    if (document.querySelector('.menu:not([hidden])')) return;
    if (event.key === 'f' && document.fullscreenEnabled && (gallery.length || busy())) {
      event.preventDefault();
      toggleFullscreen();
    }
    if (!document.fullscreenElement) return;
    if (event.key === 'ArrowRight') stepFrame(1);
    if (event.key === 'ArrowLeft') stepFrame(-1);
  });

  // Cmd+Enter (Ctrl+Enter off a Mac) runs from anywhere on the page. It obeys
  // the same rule as a click: nothing happens while the button is disabled.
  document.addEventListener('keydown', function (event) {
    if (event.key !== 'Enter' || !(event.metaKey || event.ctrlKey)) return;
    event.preventDefault();
    if (!go.disabled) form.requestSubmit(go);
  });

  new MutationObserver(function () {
    const node = progressSlot.querySelector('.progress-state');
    progressState = node ? {
      stage: node.dataset.stage, step: Number(node.dataset.step), total: Number(node.dataset.total),
      label: node.dataset.label, stopping: node.dataset.stopping === '1',
    } : null;
    trackPace();
    renderProgress();
  }).observe(progressSlot, { childList: true, subtree: true });

  // Time left comes from when steps arrive, never from the clock between them:
  // dividing by "now" made the number climb during every step and drop at the
  // next. The rate carries across the images of a batch. Until two steps have
  // arrived, the pre-run guess stands in. An image also needs time after its
  // last step, to decode and reach the page. That tail is measured on each
  // finished image; before the first, the backend's overhead stands in.
  function trackPace() {
    const state = progressState;
    if (!state) return;
    const now = Date.now();
    if (!pace) pace = { label: null, stepTime: 0, stepsTimed: 0, tail: null };
    if (state.label !== pace.label) {
      if (pace.label !== null && pace.lastStepAt) pace.tail = (now - pace.lastStepAt) / 1000;
      pace.label = state.label;
      pace.lastStep = 0;
      pace.lastStepAt = 0;
    }
    if (state.stage !== 'running' || state.step <= pace.lastStep) return;
    if (pace.lastStepAt) {
      pace.stepTime += (now - pace.lastStepAt) / 1000;
      pace.stepsTimed += state.step - pace.lastStep;
    }
    pace.lastStep = state.step;
    pace.lastStepAt = now;
    if (pace.stepsTimed >= 2 && runEstimate) {
      learnedCost[runKey] = paceRate() / Math.pow(runPixels / 1e6, runEstimate.exponent);
    }
  }

  function paceRate() {
    return pace && pace.stepsTimed >= 2 ? pace.stepTime / pace.stepsTimed : runStepSeconds;
  }

  function timeLeft() {
    const state = progressState;
    const perStep = paceRate();
    if (!state || !perStep) return '';
    const tail = pace && pace.tail !== null ? pace.tail : (runEstimate ? runEstimate.overhead : 0);
    const batch = (state.label || '').match(/(\d+) of (\d+)/);
    const imagesAfter = batch ? Number(batch[2]) - Number(batch[1]) : 0;
    const step = state.stage === 'running' ? state.step : 0;
    const sinceStep = pace && pace.lastStepAt ? (Date.now() - pace.lastStepAt) / 1000 : 0;
    const thisImage = Math.max(0, perStep * (state.total - step) + tail - sinceStep);
    const seconds = thisImage + imagesAfter * (perStep * state.total + tail);
    return seconds < 3 ? 'Almost done' : 'About ' + spell(seconds) + ' left';
  }

  function progressNow() {
    const state = progressState;
    const running = Boolean(state && state.stage === 'running' && state.total);
    return { running: running, percent: running ? Math.round(state.step / state.total * 100) : 0 };
  }

  // Exposure only grows with a sweep. A drop, at the next image of a batch or a
  // new run, jumps back to the left edge at once.
  function paintPlate(plate, running, percent) {
    const rewind = percent < (parseFloat(plate.style.getPropertyValue('--exposed')) || 0);
    plate.classList.toggle('rewind', rewind);
    plate.classList.toggle('waiting', !running);
    plate.style.setProperty('--exposed', percent + '%');
    if (!rewind) return;
    void plate.offsetWidth;   // apply the drop while the sweep is off
    plate.classList.remove('rewind');
  }

  function renderProgress() {
    if (!busy()) return;
    const state = progressState;
    const stopping = document.body.classList.contains('stopping') || (state && state.stopping);
    const now = progressNow();
    const running = now.running;
    let stepText = 'Starting';
    if (state && state.stage === 'preparing') stepText = 'Preparing the model';
    if (running) stepText = 'Step ' + state.step + ' of ' + state.total;
    if (stopping) stepText = 'Stopping at the end of this step';

    goSub.textContent = stopping ? '' : stepText;
    document.title = (running ? '(' + now.percent + '%) ' : '') + BASE_TITLE;
    goFill.style.width = now.percent + '%';
    document.querySelectorAll('.card, .frame.pending .still').forEach(function (plate) {
      paintPlate(plate, running, now.percent);
      const percent = plate.querySelector('.percent');
      if (percent) percent.textContent = running ? now.percent + '%' : '';
    });
    const slots = canvas.querySelectorAll('[data-slot]');
    slots.forEach(function (slot) {
      if (slot.dataset.slot === 'step') slot.textContent = stepText;
      if (slot.dataset.slot === 'image') slot.textContent = state && state.label ? 'Image ' + state.label : '';
      if (slot.dataset.slot === 'left') slot.textContent = running && !stopping ? timeLeft() : '';
    });
  }

  function sideChannel(event) {
    const config = event.detail.requestConfig || event.detail.pathInfo || {};
    const path = config.path || config.requestPath || '';
    return path === '/progress' || path === '/cancel';
  }

  // The references are an array, not a form field, so they are attached here.
  // Only the form itself carries them: a chain request already has a token.
  document.body.addEventListener('htmx:configRequest', function (event) {
    if (event.detail.elt !== form) return;
    // Only a one-image edit changes that image in place. An edit from several
    // images composes them, so no single source lines up with the result and
    // a wipe between them would mislead.
    batchSource = editing() && references.length === 1
      ? blobUrl('data:image/png;base64,' + references[0].b64) : null;
    const own = promptInput.value.trim();
    runLook = { prompt: own, sent: withLook(own), labels: lookLabels(), picks: JSON.parse(JSON.stringify(look)) };
    event.detail.parameters.prompt = runLook.sent;
    event.detail.parameters.references = JSON.stringify(references.map(function (r) {
      return r.b64;
    }));
  });
  document.body.addEventListener('htmx:beforeRequest', function (event) {
    if (sideChannel(event)) return;
    if (event.detail.elt === form) toasts.innerHTML = '';
    startWork(event.detail.elt);
  });
  document.body.addEventListener('htmx:afterSettle', function (event) {
    // A /progress response settles once a second. It is not the end of the run,
    // and treating it as one used to clear the busy state mid-generation.
    if (sideChannel(event)) return;
    if (!document.querySelector('.chain')) stopWork();
  });
  document.body.addEventListener('htmx:responseError', stopWork);
  document.body.addEventListener('htmx:sendError', function () {
    stopWork();
    showToast('error', 'The server did not answer. Check that the studio server is still running.');
  });

  // The images live only in this tab, so a reload or a close would lose them.
  // Browsers show their own fixed text here; the page cannot set it.
  window.addEventListener('beforeunload', function (event) {
    if (!gallery.length && !busy()) return;
    event.preventDefault();
    event.returnValue = '';
  });

  // A mode the backend lacks stays in view, disabled, so the page keeps its shape.
  function setupModes() {
    form.querySelectorAll('input[name=mode]').forEach(function (radio) {
      const spec = MODES[radio.value];
      const label = form.querySelector('label[for=' + radio.id + ']');
      radio.disabled = !spec;
      if (spec) label.lastChild.textContent = spec.label;
      else label.title = STUDIO.backend.name + ' has no ' + label.textContent.trim().toLowerCase() + ' mode';
    });
    const first = form.querySelector('input[name=mode]:not(:disabled)');
    if (form.querySelector('input[name=mode]:checked').disabled) first.checked = true;
  }

  // The title is the switch, and only when there is a choice. A switch frees
  // the old backend and loads the new one, then the page reloads with its
  // capabilities.
  function setupBackends() {
    const toggle = document.getElementById('backend-toggle');
    const menu = document.getElementById('backend-menu');
    if (STUDIO.backends.length < 2) return;
    toggle.disabled = false;
    toggle.title = 'Switch the model';
    toggle.addEventListener('click', function () { toggleMenu(menu); });
    const head = document.createElement('div');
    head.className = 'menu-head';
    head.textContent = 'Model';
    menu.append(head);
    STUDIO.backends.forEach(function ([id, name]) {
      const item = menuItem('check', name, function () { switchBackend(id, name); });
      item.setAttribute('role', 'menuitemradio');
      item.setAttribute('aria-checked', String(id === STUDIO.backend.id));
      menu.append(item);
    });
  }

  function switchBackend(id, name) {
    const toggle = document.getElementById('backend-toggle');
    if (id === STUDIO.backend.id) return;
    if (busy()) return showToast('info', 'Wait for the run to finish, then switch.');
    if (gallery.length && !confirm('Switching the model reloads the page and clears the gallery.')) return;
    toggle.disabled = true;
    showToast('info', 'Loading ' + name + '. This can take a minute.');
    fetch('/backend', { method: 'POST', body: new URLSearchParams({ backend: id }) })
      .then(function (answer) { return answer.text(); })
      .then(function (text) {
        if (!text) { gallery.length = 0; location.reload(); return; }
        toggle.disabled = false;
        showToast('error', new DOMParser().parseFromString(text, 'text/html').body.textContent);
      })
      .catch(function (error) {
        toggle.disabled = false;
        showToast('error', 'The switch failed: ' + error.message);
      });
  }

  setupModes();
  setupBackends();
  buildSizeControls();
  applyMode();
  renderLook();
  renderReferences();
  renderStrip();
  renderStage();
</script>
</body>
</html>
