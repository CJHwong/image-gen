# The backend the page opens with, and the backends it may offer. The page
# shows a model picker only when it may offer more than one, so the default is
# the one model and no picker. `--backend` opens on another one and adds it to
# the list, and `--all-backends` enables selection in Image, Video and Voice.
# Optional models require their weights before generation; startup loads no weights.
default_backend = "qwen21_turbo"
visible_backends = ["qwen21_turbo"]
# Video offers LTX-2.5 only, so its header shows the model name without a picker.
# LTX-2.3 remains optional; --all-backends exposes it. Restore its weights before use.
default_video_backend = "ltx25_mlx"
visible_video_backends = ["ltx25_mlx"]
default_voice_backend = "drama3"
visible_voice_backends = ["drama3"]

[mlx_video]
# Image-aware LTX enhancement requires mlx-vlm==0.4.3 in this CLI environment.
# It reads the first attached keyframe and frees Gemma before video rendering.
# Auto selects a measured reuse profile by output geometry, length, and physical memory.
# Auto shares prompt enhancement before eligible video reuse.
# Enhance_only shares enhancement but creates a fresh video pipeline for each clip.
# Sequential disables cross-clip reuse, including enhancement, for a baseline.
batch_policy = "auto"
# LTX-2.5 Fast mode is selected per request in Video Advanced or with API fast_mode=true.
# It uses float16 transformer computation with the same q8 weights; generated details can differ.
# The third-party MLX port, its 8-bit pack, and ffmpeg for padding a short track. The
# paths are the office machine's; a laptop runs the stub and never reads them.
cli_path = "~/ltx-experiments/ltx-2-mlx/.venv/bin/ltx-2-mlx"
ffmpeg_path = "/opt/homebrew/bin/ffmpeg"
model_ltx25 = "dgrauet/ltx-2.5-mlx-q8"
model_ltx23 = "dgrauet/ltx-2.3-mlx-q8"
# The seven LTX-2.5 effects, one file each, fetched from the Creative Lab collection.
# Custom Edit uses no task LoRA and does not need this directory or a download.
lora_dir = "~/Library/Caches/models/ltx-2.5-loras"
# Fetch an effect's weights when the file is not there. A download is a side effect the
# person did not ask for, so it is off by default. On, the studio fetches the one file
# the run needs, from the Lightricks collection, the first time that effect runs.
fetch_loras = false

[qwen21]
# bf16 by default, which is 0. Measured on 2026-10-19: no level is faster than another, so a
# quantized one costs accuracy for nothing this machine needs. -q on the command line overrides
# this, and 8 is the level to ask for when memory is the constraint.
quantize = 0
# The prompt rewriters: fine-tuned Qwen3.5-VL 9B, 18.84 GB each, and each is
# released again before an image engine loads. The text one serves generate, the
# image one serves edit. Neither is fetched until the toggle is first used.
rewrite_generate_model = "Qwen/Qwen-Image-2.1-PE-T2I"
rewrite_edit_model = "Qwen/Qwen-Image-2.1-PE-I2I"

[qwen21_turbo]
# Active Generate/Edit/batch work uses a wired limit bounded by MLX and 75% of RAM.
# The previous process limit is restored while idle; precision is unchanged.
quantize = 0                              # bf16, for the reason above
model_dir = "~/Library/Caches/models/qwen-image-2.1-turbo"
# The checkpoint ships its own eight-node sampling schedule and this backend samples
# it, so 8 steps is the count rather than a setting. `gateways/image/shared/qwen21_turbo_schedule.py`
# holds the table; `docs/explanation/design-decisions.md` explains why it differs from the default table.
rewrite_generate_model = "Qwen/Qwen-Image-2.1-PE-T2I"
rewrite_edit_model = "Qwen/Qwen-Image-2.1-PE-I2I"

[flux2]
quantize = 0
model_dir = "~/Library/Caches/models/mflux-klein-base-9b-uncensored"   # docs/how-to/set-up-models.md has the download

[viggle_turbo]
quantize = 0                              # bf16, for the reason above; the LoRA is passed unmerged
# Viggle's distilled 6-step adapter for Qwen-Image-2.1, 1.3 GB. The base weights
# are the ones [qwen21] already downloads. docs/how-to/set-up-models.md has the download recipe.
lora_path = "~/Library/Caches/models/viggle-turbo/Qwen-Image-2.1-viggle-turbo-v0.3-6step-lora-r256.safetensors"
# The same two prompt rewriters as [qwen21]: they are their own models and do not
# depend on which weights draw the image.
rewrite_generate_model = "Qwen/Qwen-Image-2.1-PE-T2I"
rewrite_edit_model = "Qwen/Qwen-Image-2.1-PE-I2I"

[auk]
# AuK Flash runs its pinned environment in a lazy resident child.
child_script = "studio/l3_interface_adapters/gateways/audio/auk_runtime/auk_child.py"

[auk_base]
# AuK uses the same pinned child and shared encoder, with its 32-step Base weights.

[drama3]
# The child bounds active wired memory by MLX’s recommendation and 75% of RAM,
# then restores the prior limit while idle. Sampling and precision are unchanged.
# Eight-bit Drama-3 in its separate pinned MLX Audio script environment.
child_script = "studio/l3_interface_adapters/gateways/audio/drama3/drama3_child.py"
# Optional: an existing environment with the exact versions declared by the child.
# python_path = "~/ltx-experiments/drama3-env/bin/python"
