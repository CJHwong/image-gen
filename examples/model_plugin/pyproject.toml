[project]
name = "open-imagine-example-models"
version = "0.1.0"
description = "CPU-only Image, Video and Voice plugin examples for Open Imagine"
requires-python = ">=3.11"

[project.entry-points."open_imagine.models.image"]
example_image = "open_imagine_example.image:plugin"

[project.entry-points."open_imagine.models.video"]
example_video = "open_imagine_example.video:plugin"

[project.entry-points."open_imagine.models.audio"]
example_voice = "open_imagine_example.audio:plugin"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "open_imagine_example"
