[project]
name = "studio"
version = "0.1.0"
description = "A local web page for image generation. The model backends plug in as adapters."
requires-python = ">=3.11"
dependencies = [
    # The same commit the qwen21 CLI pins. It carries the qwen21, flux2 and krea2 ports.
    "mflux @ git+https://github.com/mflux-community/mflux@8c00dab2505a96019df9d30bc9c223bf20d733c4",
    "pillow",
    # The prompt rewriters, a second model per mode. MLX like mflux, so it shares
    # this process and needs no child; the import is deferred to the first
    # rewrite, so a studio that never rewrites never pays for it.
    "mlx-vlm>=0.7.3",
]

[project.scripts]
studio = "studio.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-cov", "import-linter", "ruff>=0.16", "ty"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

# These scripts run in their own environments: the PEP 723 ones on diffusers, the
# browser checks through `uv run --with playwright`. diffusers cannot resolve in
# this venv, so ty cannot check these files here. torch does resolve: mflux pulls
# it as a dependency. Pass `--cov=studio`, the directory, not `--cov=studio/__main__`:
# coverage reads any source entry that is not a directory as a package name, and
# the entry then matches nothing.
[tool.ty.src]
exclude = [
    "studio/l3_interface_adapters/gateways/qwen21/qwen21_edit.py",
    "studio/l3_interface_adapters/gateways/qwen21/vae_device_sweep.py",
    "tests/e2e/verify_*.py",
]

# Branch coverage as well as statement coverage. A statement can run while one side
# of its condition never does, and then no test has proved that path: the first run
# with this on left three such branches, in stdio_child and main.
[tool.coverage.run]
branch = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the real model weights and the GPU"]
# Every statement and every branch in studio/ runs under this command, in every layer.
# The weight of the gate is the point: a module added without a test stops the suite,
# so the mirrored test file gets written rather than promised.
addopts = "-m 'not live' --cov=studio --cov-fail-under=100"
