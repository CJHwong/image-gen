[package]
name = "krea2-harness"
version = "0.1.0"
edition = "2021"
description = "Krea 2 (txt2img / img2img / edit / pose-control) over the SceneWorks/mlx-gen Rust MLX engine."

[[bin]]
name = "krea2"
path = "src/main.rs"

[dependencies]
# mlx-gen is NOT on crates.io. Pin the upstream engine by rev; Cargo.lock freezes the
# full transitive tree (mlx-rs Metal kernels, mlx-gen-qwen-image / -boogu / -pid reused by
# the krea crate for the Qwen-Image VAE + Qwen3-VL vision tower).
mlx-gen      = { git = "https://github.com/SceneWorks/mlx-gen", rev = "1b3dacbe6b4bbf6a6df20f50ab2934c444ac144b" }
mlx-gen-krea = { git = "https://github.com/SceneWorks/mlx-gen", rev = "1b3dacbe6b4bbf6a6df20f50ab2934c444ac144b" }

# CLI + PNG encode + error chaining. Pinned exact to match the repo's pin-everything
# convention; Cargo.lock additionally freezes the mlx-gen git rev + the full transitive tree.
clap   = { version = "=4.6.1", features = ["derive", "env"] }
image  = "=0.25.10"
anyhow = "=1.0.103"